<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAAZAH — Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Bagel+Fat+One&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  /* ============================================================
     Maazah brand palette — sampled from @maazahmagic + packaging.
     Token structure mirrors the OBSOLETE engine pattern
     (brand-primary / brand-accent / butter / ink / pillar-* / sku-*)
     so structural components port cleanly across engines.
     ============================================================ */

  /* Brand — primary green (Maazah kelly) */
  --brand-primary:#6FAF4D;        /* dominant — sidebar, header rules, primary CTAs */
  --brand-deep:#3F7B28;           /* deeper green for hover + ink-on-green */
  --brand-light:#C6E29F;          /* soft lime — accent surface */
  --brand-light-soft:#E8F2D5;     /* lightest green — subtle bg */

  /* Accent — Maazah's "magenta-equivalent" CTA color (chili coral) */
  --brand-accent:#D67A5A;         /* drop buttons, "ride this" callouts, hot chips */
  --brand-accent-deep:#B5563B;    /* deeper coral hover */

  /* Ink + paper (cream-on-warm-dark) */
  --ink:#2A1F12;                  /* warm dark ink — body text + headlines */
  --ink-soft:#5C4E3E;             /* softened ink */
  --butter:#F7F3E5;               /* cream paper — body bg */
  --butter-deep:#EDE5C8;          /* elevated cream surface */
  --butter-light:#FDFAF0;         /* lightest cream — card bg */
  --border:#D8CFB0;               /* warm cream-edge border */

  /* Pillar palette — one per Maazah content pillar */
  --pillar-magic:#6FAF4D;         /* MAGIC IS REAL — kelly green */
  --pillar-multiply:#D67A5A;      /* PUT IT ON EVERYTHING — chili coral */
  --pillar-mom:#E08642;           /* MOM'S TABLE — turmeric orange */
  --pillar-squad:#E8C547;         /* SAUCY SQUAD — lemon yellow */

  /* SKU chip palette */
  --sku-basil:#87B26F;            /* Basil Jalapeño dip */
  --sku-lemon:#E8C547;            /* Classic Lemon dip + Lemon Aioli */
  --sku-coral:#D67A5A;            /* Roasted Red Pepper dip */
  --sku-turmeric:#E08642;         /* Turmeric Ginger dip */
  --sku-cilantro:#7FB069;         /* Cilantro Chutney sauce */
  --sku-mango:#E8A66F;            /* Mango Chutney sauce */
  --sku-chili:#C84A38;            /* Chili Aioli sauce (NEW) */

  /* Shadows */
  --shadow:0 2px 10px rgba(42,31,18,0.08);
  --shadow-lg:0 10px 40px rgba(42,31,18,0.14);

  /* ============================================================
     Legacy V2 aliases — keep so existing CSS keeps working
     while new ported components reference abstract token names.
     ============================================================ */
  --green:#6FAF4D;                /* alias → --brand-primary */
  --green-deep:#3F7B28;           /* alias → --brand-deep */
  --green-soft:#C6E29F;           /* alias → --brand-light */
  --green-light:#E8F2D5;          /* alias → --brand-light-soft */
  --cream:#F7F3E5;                /* alias → --butter */
  --cream-deep:#EDE5C8;           /* alias → --butter-deep */
  --paper:#FDFAF0;                /* alias → --butter-light */
  --basil:#87B26F;
  --lemon:#E8C547;
  --coral:#D67A5A;
  --turmeric:#E08642;
  --cilantro:#7FB069;
  --mango:#E8A66F;
  --chili:#C84A38;
}
.display{font-family:'Bagel Fat One','Cooper Std',Georgia,serif;font-weight:400;letter-spacing:0.005em}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.mono{font-family:'JetBrains Mono','Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--butter);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:100vh}

/* Sidebar */
.sb{background:var(--green);color:#fff;border-right:1px solid var(--green-deep);padding:18px 11px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:1px solid rgba(255,255,255,0.22);margin-bottom:10px}
.sb-logo{width:34px;height:38px;flex-shrink:0;color:var(--ink)}
.sb-brand-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:21px;letter-spacing:0.005em;color:var(--ink);line-height:0.95}
.sb-brand-sub{font-size:9px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(255,255,255,0.85);margin-top:3px;font-weight:600}
.sb-section-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.16em;color:rgba(255,255,255,0.75);padding:12px 9px 5px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-weight:500;font-size:12.5px;color:rgba(255,255,255,0.92);position:relative;text-align:left;width:100%}
.sb-item:hover{background:rgba(255,255,255,0.14)}
.sb-item.active{background:var(--ink);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(42,31,18,0.35)}
.sb-item-icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
.sb-item-soon{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;background:rgba(255,255,255,0.20);color:rgba(255,255,255,0.92);padding:2px 6px;border-radius:3px;margin-left:auto;font-weight:600}
.sb-item.active .sb-item-soon{background:rgba(255,255,255,0.28);color:#fff}
.sb-footer{margin-top:8px;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,0.18);font-size:11px;color:rgba(255,255,255,0.85);line-height:1.55}
.sb-footer strong{color:#fff;font-weight:700;display:block;margin-bottom:2px}
.sb-howit{margin-top:10px;width:100%;text-align:left;font-size:11.5px;color:#fff;background:rgba(255,255,255,0.16);padding:9px 12px;border-radius:8px;font-weight:500;letter-spacing:0.01em}
.sb-howit:hover{background:rgba(255,255,255,0.24)}

/* Diagnostic Inbox button — coral gradient pill, bottom of sidebar (Phase 1) */
.sb-diag-btn{margin-top:auto;margin-bottom:10px;display:flex;align-items:center;gap:10px;width:100%;background:linear-gradient(135deg,var(--brand-accent) 0%,var(--brand-accent-deep) 100%);color:#fff;border:1px solid rgba(255,255,255,0.18);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;box-shadow:0 4px 12px rgba(181,86,59,0.32);transition:transform 0.12s,box-shadow 0.12s;position:relative}
.sb-diag-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(181,86,59,0.42)}

/* Main footer — JetBrains Mono attribution line at bottom of every page */
.main-footer{margin-top:48px;padding:18px 0 6px;border-top:1px solid rgba(111,175,77,0.22);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--ink-soft);font-weight:600;text-transform:uppercase}
.main-footer strong{color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:0.12em}
.main-footer .footer-dot{width:5px;height:5px;border-radius:50%;background:var(--brand-primary);box-shadow:0 0 5px rgba(111,175,77,0.6)}

/* ============================================================
   How It Works tab — engine in motion
   ============================================================ */
.hiw-hero{background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand-primary) 50%,var(--brand-accent-deep) 130%);color:#fff;border-radius:18px;padding:36px 40px 32px;margin-bottom:28px;position:relative;overflow:hidden}
.hiw-hero-eye{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;font-weight:700;text-transform:uppercase;opacity:0.9;margin-bottom:12px}
.hiw-hero-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:38px;line-height:1.05;letter-spacing:0.005em;max-width:680px}

.hiw-flow-band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:32px}
.hiw-step{background:var(--butter-light);border:1.5px solid var(--brand-primary);border-radius:14px;padding:18px 18px 20px;position:relative;display:flex;flex-direction:column;min-width:0;box-shadow:0 2px 0 var(--brand-primary)}
.hiw-step:last-child{background:linear-gradient(160deg,var(--brand-accent) 0%,var(--brand-accent-deep) 100%);color:#fff;border-color:var(--brand-accent-deep);box-shadow:0 2px 0 var(--brand-accent-deep)}
.hiw-step-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-width:0}
.hiw-step-icon{width:36px;height:36px;border-radius:9px;background:var(--brand-light-soft);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--brand-light)}
.hiw-step:last-child .hiw-step-icon{background:rgba(255,255,255,0.2);color:#fff;border-color:rgba(255,255,255,0.32)}
.hiw-step-num{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;font-weight:700;color:var(--ink-soft);text-transform:uppercase;min-width:0;flex:1}
.hiw-step:last-child .hiw-step-num{color:rgba(255,255,255,0.85)}
.hiw-step-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:24px;letter-spacing:0.005em;line-height:1.05;color:var(--ink);margin-bottom:8px;word-wrap:normal}
.hiw-step:last-child .hiw-step-name{color:#fff}
.hiw-step-body{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.5;color:var(--ink-soft);font-weight:500;letter-spacing:-0.005em;word-wrap:normal;overflow-wrap:normal;min-width:0}
.hiw-step:last-child .hiw-step-body{color:rgba(255,255,255,0.92)}
.hiw-step-arrow{position:absolute;right:-18px;top:30px;width:22px;height:22px;border-radius:50%;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2;box-shadow:0 2px 8px rgba(63,123,40,0.32)}
.hiw-step:last-child .hiw-step-arrow{display:none}
@media(max-width:980px){.hiw-flow-band{grid-template-columns:1fr 1fr}.hiw-step-arrow{display:none}}
@media(max-width:560px){.hiw-flow-band{grid-template-columns:1fr}}
.hiw-step:last-child .hiw-step-body{color:rgba(255,255,255,0.92)}
.hiw-step-arrow{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:2}
.hiw-step:last-child .hiw-step-arrow{display:none}

/* Engine Thinking Flow — 7 nodes + per-step card */
.etf-section{margin-bottom:32px;background:var(--butter-light);border:1.5px solid var(--brand-primary);border-radius:18px;padding:28px 32px}
.etf-head{margin-bottom:24px}
.etf-eye{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.etf-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:30px;letter-spacing:0.005em;line-height:1.05;color:var(--ink);margin-bottom:6px}
.etf-sub{font-family:'Fraunces',Georgia,serif;font-size:14px;line-height:1.5;color:var(--ink-soft);font-style:italic;max-width:680px}

.etf-pipeline{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:28px;padding:0 12px}
.etf-rail{position:absolute;top:50%;left:32px;right:32px;height:3px;background:var(--brand-light);transform:translateY(-50%);z-index:1;border-radius:99px}
.etf-rail-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--brand-primary) 0%,var(--brand-accent) 100%);border-radius:99px;transition:width 0.4s cubic-bezier(0.4,0,0.2,1)}
.etf-node{width:46px;height:46px;border-radius:50%;background:#fff;border:2.5px solid var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative;z-index:2;transition:transform 0.2s,box-shadow 0.2s,background 0.2s,border-color 0.2s}
.etf-node:hover{transform:scale(1.06)}
.etf-node.done{background:var(--brand-primary);border-color:var(--brand-deep);color:#fff}
.etf-node.active{background:var(--brand-accent);border-color:var(--brand-accent-deep);color:#fff;transform:scale(1.15);box-shadow:0 0 0 6px rgba(214,122,90,0.22),0 4px 14px rgba(214,122,90,0.4);animation:etf-pulse 2.2s ease-in-out infinite}
@keyframes etf-pulse{0%,100%{box-shadow:0 0 0 6px rgba(214,122,90,0.22),0 4px 14px rgba(214,122,90,0.4)}50%{box-shadow:0 0 0 10px rgba(214,122,90,0.12),0 4px 18px rgba(214,122,90,0.5)}}
.etf-node-num{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:700;white-space:nowrap}

.etf-card{background:#fff;border:1.5px solid var(--brand-primary);border-radius:14px;padding:24px 28px;box-shadow:0 4px 16px rgba(63,123,40,0.1)}
.etf-card-row1{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.etf-card-icon{width:48px;height:48px;border-radius:12px;background:var(--brand-light-soft);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:1.5px solid var(--brand-light)}
.etf-card-agent{flex:1;min-width:0}
.etf-card-agent-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:20px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.etf-card-agent-focus{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-family:'JetBrains Mono',monospace;letter-spacing:0.04em}
.etf-card-step-counter{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--brand-accent-deep);background:rgba(214,122,90,0.14);padding:5px 11px;border-radius:99px;font-weight:700;text-transform:uppercase;border:1px solid rgba(214,122,90,0.32);white-space:nowrap}
.etf-card-incoming{display:inline-flex;align-items:center;gap:6px;background:var(--brand-light-soft);color:var(--brand-deep);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;font-weight:700;padding:5px 11px;border-radius:99px;text-transform:uppercase;margin-bottom:12px;border:1px dashed rgba(111,175,77,0.4)}
.etf-card-watches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.etf-card-watch-chip{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--brand-light-soft);color:var(--brand-deep);padding:3px 9px;border-radius:99px;letter-spacing:0.04em;font-weight:600;border:1px solid rgba(111,175,77,0.32)}
.etf-card-title{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:700;letter-spacing:-0.01em;color:var(--ink);margin-bottom:6px}
.etf-card-what{font-size:13.5px;line-height:1.55;color:var(--ink);margin-bottom:14px}
.etf-card-filters{padding-top:14px;border-top:1px dashed var(--border);margin-bottom:14px}
.etf-card-filters-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.etf-card-filter{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin-bottom:5px}
.etf-card-filter::before{content:"·";color:var(--brand-primary);font-weight:800;flex-shrink:0}
.etf-card-verdict{background:linear-gradient(135deg,rgba(111,175,77,0.18) 0%,rgba(111,175,77,0.08) 100%);border-left:3px solid var(--brand-primary);padding:11px 14px;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.5;color:var(--brand-deep);font-weight:600;letter-spacing:-0.005em}
.etf-card-verdict::before{content:"✓ ";color:var(--brand-primary);font-weight:800;font-family:'Bagel Fat One',serif}

/* Pipeline Status panel (Phase C) — live engine state */
.ps-section{background:var(--ink);color:#fff;border-radius:18px;padding:24px 28px;margin-bottom:32px;position:relative;overflow:hidden}
.ps-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed rgba(255,255,255,0.18)}
.ps-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;font-weight:700;color:var(--brand-light);text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.ps-eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--brand-primary);box-shadow:0 0 6px rgba(111,175,77,0.9);animation:ps-pulse 2.4s ease-in-out infinite}
@keyframes ps-pulse{0%,100%{opacity:0.5;box-shadow:0 0 4px rgba(111,175,77,0.6)}50%{opacity:1;box-shadow:0 0 10px rgba(111,175,77,1)}}
.ps-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;line-height:1.05;color:#fff}
.ps-meta{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:rgba(255,255,255,0.65);text-align:right;line-height:1.5;text-transform:uppercase}
.ps-meta strong{color:#fff;font-weight:700;display:block}
.ps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:820px){.ps-grid{grid-template-columns:1fr 1fr}}
.ps-stat{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:10px;padding:14px 16px}
.ps-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:32px;line-height:1;letter-spacing:0.005em;color:var(--brand-light);margin-bottom:4px}
.ps-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#fff;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.ps-detail{font-size:11px;color:rgba(255,255,255,0.72);line-height:1.45}
.ps-workers-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.18em;color:var(--brand-light);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.ps-workers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:680px){.ps-workers{grid-template-columns:1fr}}
.ps-worker{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:6px;padding:8px 11px;display:flex;align-items:flex-start;gap:8px;font-size:11px}
.ps-worker-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ps-worker-dot-active{background:#7FB069;box-shadow:0 0 4px rgba(127,176,105,0.6)}
.ps-worker-dot-ready{background:#E8C547}
.ps-worker-dot-deploying{background:#D67A5A}
.ps-worker-dot-auth-pending{background:#E08642}
.ps-worker-dot-platform-block{background:#9E3F31}
.ps-worker-body{flex:1;min-width:0}
.ps-worker-name{font-family:'JetBrains Mono',monospace;font-weight:700;color:#fff;letter-spacing:0.06em;text-transform:uppercase;font-size:10.5px;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ps-worker-count{font-family:'Bagel Fat One',serif;font-weight:400;font-size:13px;color:var(--brand-light);letter-spacing:0.02em}
.ps-worker-note{font-size:10.5px;color:rgba(255,255,255,0.6);line-height:1.4}
.ps-foot{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:rgba(255,255,255,0.45);text-transform:uppercase;font-weight:600;margin-top:18px;padding-top:14px;border-top:1px dashed rgba(255,255,255,0.14);text-align:center}

/* ETF nav buttons */
.etf-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:18px;border-top:1px dashed var(--border)}
.etf-nav-btn{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:9px 16px;border-radius:99px;cursor:pointer;background:transparent;border:1.5px solid var(--brand-primary);color:var(--brand-deep);transition:background 0.15s,color 0.15s}
.etf-nav-btn:hover:not(:disabled){background:var(--brand-primary);color:#fff}
.etf-nav-btn:disabled{opacity:0.4;cursor:not-allowed}
.etf-nav-progress{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:600;text-transform:uppercase}

/* HIW accordions — Decisions · Receipts · Brand Fence · Sources */
.howit-acc{background:var(--butter-light);border:1.5px solid var(--brand-primary);border-radius:14px;margin-bottom:14px;overflow:hidden}
.howit-acc summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.howit-acc summary::-webkit-details-marker{display:none}
.howit-acc[open] .howit-acc-chevron{transform:rotate(180deg)}

.amp-placement{padding:12px 14px;background:#fff;border:1px solid var(--brand-light);border-radius:10px}
.amp-placement-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.amp-placement-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.amp-placement-dot-meta{background:#1877F2}
.amp-placement-dot-tiktok{background:#FF0050}
.amp-placement-dot-pinterest{background:#E60023}
.amp-placement-dot-default{background:var(--brand-primary)}
.amp-placement-platform{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;font-weight:800;color:var(--ink)}
.amp-placement-format{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.06em;color:var(--ink-soft);font-weight:600}
.amp-placement-budget{font-family:'Bagel Fat One',serif;font-size:14px;color:var(--brand-deep);margin-left:auto;letter-spacing:0.005em}
.amp-placement-reach{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-soft);font-weight:600}
.amp-placement-audience{font-size:11.5px;line-height:1.5;color:var(--ink);margin-bottom:5px}
.amp-placement-lookalike{font-size:11px;line-height:1.5;color:var(--ink-soft);margin-bottom:5px}
.amp-placement-lookalike strong{color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;font-size:9.5px;font-family:'JetBrains Mono',monospace}
.amp-placement-note{font-size:11px;line-height:1.5;color:var(--ink-soft);font-style:italic;padding-top:6px;border-top:1px dashed var(--border);margin-top:6px}

/* WIP under-construction banner — used by Calendar + Performance + Diagnostic Inbox modal */
.wip-banner{background:var(--butter-light);border:2px dashed var(--brand-accent);border-radius:12px;padding:18px 22px;margin-bottom:24px;display:flex;align-items:flex-start;gap:14px}
.wip-banner-icon{font-size:24px;line-height:1;flex-shrink:0;margin-top:2px}
.wip-banner-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;font-weight:700;color:var(--brand-accent-deep);text-transform:uppercase;margin-bottom:4px}
.wip-banner-body{font-size:13px;line-height:1.5;color:var(--ink-soft)}
.wip-banner-body strong{color:var(--ink);font-weight:700}

/* Main */
.main{padding:20px 26px 60px;max-width:1400px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:12px;border-bottom:2px solid var(--green);margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-family:'Bagel Fat One',serif;font-weight:400;font-size:30px;letter-spacing:0.005em;line-height:0.95;color:var(--ink)}
.page-head .eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:0.18em;color:var(--green-deep);margin-bottom:5px;font-weight:700}
.page-head .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.date-pill{background:var(--green);color:#fff;font-weight:700;padding:6px 13px;border-radius:99px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase}
.refresh-pill{font-size:11px;color:var(--ink);display:flex;align-items:center;gap:6px;font-weight:500}
.refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(111,175,77,0.7)}

/* Ticker — slowed + label no longer competes with scroll */
.ticker{background:var(--ink);color:#fff;padding:10px 0 10px 18px;border-radius:10px;margin-bottom:24px;display:flex;align-items:center;gap:0;overflow:hidden;font-size:12px;position:relative}
.ticker-label{font-family:'Bagel Fat One',serif;color:var(--brand-light);font-size:13px;letter-spacing:0.01em;white-space:nowrap;flex-shrink:0;background:var(--ink);padding:4px 22px 4px 0;position:relative;z-index:5;box-shadow:14px 0 14px -10px var(--ink)}
.ticker-track{display:flex;gap:36px;flex:1;white-space:nowrap;animation:tickerScroll 70s linear infinite;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,0.92);letter-spacing:0.02em;padding-right:24px}
.ticker-track strong{color:var(--brand-light);margin-right:6px}
.ticker-item{display:inline-flex;align-items:center;gap:8px}
.ticker-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 4px currentColor}
.ticker-dot-signal{background:#6FAF4D;color:#6FAF4D}
.ticker-dot-pulse{background:#D67A5A;color:#D67A5A}
.ticker-dot-decision{background:#E8C547;color:#E8C547}
.ticker-dot-win{background:#7FB069;color:#7FB069}
.ticker-dot-warning{background:#E08642;color:#E08642}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* Sub tabs */
.subtabs{display:flex;gap:4px;margin:0 0 24px;border-bottom:1px solid var(--border);padding-bottom:0}
.subtab{padding:10px 16px 13px;font-weight:600;font-size:13px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.subtab:hover{color:var(--ink)}
.subtab.active{color:var(--ink);border-bottom-color:var(--green)}
.subtab-count{background:rgba(111,175,77,0.16);color:var(--green-deep);padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;letter-spacing:0.02em}
.subtab.active .subtab-count{background:var(--green);color:#fff}

/* Editorial lede */
.lede{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--paper);border:1.5px solid var(--green);border-radius:12px;padding:0;margin-bottom:18px;overflow:hidden;box-shadow:0 2px 0 var(--green)}
.lede-col{padding:12px 16px;border-right:1px solid var(--border);min-width:0}
.lede-col:last-child{border-right:0}
.lede-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.16em;color:var(--green-deep);margin-bottom:5px;font-weight:700}
.lede-text{font-family:'Fraunces';font-size:12.5px;line-height:1.45;font-weight:500;color:var(--ink);letter-spacing:-0.005em}
@media(max-width:1180px){.lede{grid-template-columns:1fr 1fr}.lede-col:nth-child(2){border-right:0}.lede-col:nth-child(3){grid-column:1/-1;border-top:1px solid var(--border)}}
@media(max-width:680px){.lede{grid-template-columns:1fr}.lede-col{border-right:0;border-bottom:1px solid var(--border)}.lede-col:last-child{border-bottom:0}}

/* Cards grid */
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1180px){.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* Generic card */
.card{background:var(--paper);border:1.5px solid var(--green);border-radius:12px;padding:15px;position:relative;transition:transform 0.12s,box-shadow 0.12s;box-shadow:0 2px 0 var(--green)}
.card:hover{box-shadow:0 4px 0 var(--green),0 6px 18px rgba(42,31,18,0.1);transform:translateY(-1px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.card-type{font-size:9.5px;text-transform:uppercase;letter-spacing:0.14em;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--green);color:#fff}
.card-velocity{font-size:9.5px;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink);display:flex;align-items:center;gap:5px;font-weight:600}
.velocity-dot{width:6px;height:6px;border-radius:50%}
.velocity-high{background:#D34A4A}
.velocity-medium{background:#E0A53C}
.velocity-low{background:#7FB069}
.card-hook{font-family:'Fraunces';font-size:16px;line-height:1.25;font-weight:600;letter-spacing:-0.015em;margin-bottom:8px;color:var(--ink)}
.card-detail{font-size:12px;line-height:1.5;color:var(--ink-soft);margin-bottom:10px}
.card-play{background:var(--green-light);border-left:3px solid var(--green);padding:11px 13px;border-radius:0 6px 6px 0;font-size:13px;line-height:1.5;margin-bottom:12px;color:var(--ink)}
.card-play-label{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;font-weight:700;color:var(--green-deep);display:block;margin-bottom:4px}
.card-meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.card-meta-chip{font-size:11px;background:var(--cream-deep);padding:4px 10px;border-radius:99px;color:var(--ink);font-weight:600;border:1px solid var(--border)}
.card-dna-chip{font-size:10.5px;background:var(--ink);color:#fff;padding:4px 10px;border-radius:99px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase}
.card-sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:10px;border-top:1px solid var(--border)}
.source-chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;background:var(--green-light);color:var(--green-deep);padding:3px 8px;border-radius:99px;letter-spacing:0;font-weight:600;border:1px solid rgba(111,175,77,0.4)}
.source-chip:hover{background:var(--green);color:#fff;border-color:var(--green)}
.card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.drop-btn{background:var(--green);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;padding:7px 13px;border-radius:99px;display:flex;align-items:center;gap:6px;transition:background 0.15s,transform 0.1s}
.drop-btn:hover{background:var(--green-deep);transform:translateY(-1px)}

/* ============================================================
   Conviction Chip + hover tooltip
   ============================================================ */
.brief-conviction{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.1em;font-weight:800;text-transform:uppercase;cursor:help;position:relative;border:1.5px solid currentColor}
.conv-band-high{color:#3B6B2D}
.conv-band-medium{color:#8B6F1F}
.conv-band-watch{color:#9E3F31}
.brief-conviction-label{letter-spacing:0.12em}
.brief-conviction-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:13px;line-height:1;letter-spacing:0;padding:3px 7px 2px;color:#fff;border-radius:99px;min-width:24px;text-align:center}
.conv-band-high .brief-conviction-num{background:#6FAF4D}
.conv-band-medium .brief-conviction-num{background:#D9A93A}
.conv-band-watch .brief-conviction-num{background:#C84A38}
.brief-conviction-tt{position:absolute;top:calc(100% + 8px);left:0;z-index:60;width:320px;background:#fff;border:1.5px solid var(--brand-primary);border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px rgba(42,31,18,0.18);opacity:0;transform:translateY(-4px);transition:opacity 0.15s,transform 0.15s;pointer-events:none;text-transform:none;letter-spacing:0;font-weight:normal;font-family:'Inter',sans-serif}
.brief-conviction:hover .brief-conviction-tt{opacity:1;transform:translateY(0);pointer-events:auto}
.brief-conviction-tt::before{content:"";position:absolute;top:-7px;left:18px;width:12px;height:12px;background:#fff;border-left:1.5px solid var(--brand-primary);border-top:1.5px solid var(--brand-primary);transform:rotate(45deg)}
.bct-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:9px;border-bottom:1px dashed var(--brand-light);margin-bottom:9px}
.bct-head-band{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;font-weight:800;color:var(--ink);text-transform:uppercase}
.bct-head-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.bct-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.bct-row{display:flex;align-items:center;gap:8px;font-size:11px}
.bct-row-label{flex:0 0 120px;font-family:'Inter',sans-serif;color:var(--ink-soft);font-weight:600;font-size:10.5px}
.bct-row-bar{flex:1;height:5px;background:var(--brand-light-soft);border-radius:99px;overflow:hidden}
.bct-row-fill{height:100%;background:linear-gradient(90deg,var(--brand-primary) 0%,var(--brand-accent) 100%);border-radius:99px}
.bct-row-num{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;color:var(--ink);min-width:24px;text-align:right}
.bct-math{display:flex;flex-direction:column;gap:3px;padding:8px 10px;background:var(--butter-light);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink);margin-bottom:8px}
.bct-math strong{color:var(--brand-accent-deep);font-weight:800}
.bct-math-total{padding-top:3px;border-top:1px dashed rgba(111,175,77,0.32);margin-top:2px}
.bct-foot{font-family:'Fraunces',Georgia,serif;font-size:11.5px;line-height:1.45;color:var(--ink);font-style:italic;font-weight:500}

/* ============================================================
   Ride-now hero — sits at top of Content Briefs page
   ============================================================ */
.ride-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand-primary) 55%,var(--brand-accent-deep) 130%);color:#fff;border-radius:14px;padding:20px 28px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(63,123,40,0.28)}
.ride-hero::before{content:"";position:absolute;top:-40px;right:-30px;width:240px;height:240px;background:radial-gradient(circle,rgba(214,122,90,0.42) 0%,transparent 65%);pointer-events:none}
.ride-hero-left{display:flex;align-items:center;gap:20px;position:relative;z-index:2}
.ride-hero-pill{display:flex;align-items:center;gap:10px;background:var(--brand-accent);padding:11px 20px;border-radius:99px;box-shadow:0 4px 14px rgba(214,122,90,0.5)}
.ride-hero-icon{font-size:22px;line-height:1}
.ride-hero-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:38px;color:#fff;letter-spacing:0.005em;line-height:1}
.ride-hero-body{display:flex;flex-direction:column;gap:4px}
.ride-hero-label{font-family:'Bagel Fat One',serif;font-weight:400;font-size:20px;letter-spacing:0.005em;line-height:1.1;color:#fff}
.ride-hero-sub{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.4;color:rgba(255,255,255,0.92);font-weight:500;font-style:italic;letter-spacing:-0.005em}
.ride-hero-right{position:relative;z-index:2;flex-shrink:0;text-align:right}
.ride-hero-mini{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;color:rgba(255,255,255,0.85);font-weight:600;text-transform:uppercase}
@media(max-width:740px){.ride-hero{flex-direction:column;align-items:flex-start;gap:14px}.ride-hero-right{align-self:flex-start;text-align:left}}

/* Brief card — pillar rail color via inline style on intel-card wrapper */

/* ============================================================
   Intel card upgrades (Phase 3) — 5px rail + 32px glyph + drop button
   ============================================================ */
.intel-card{border-left-width:5px}
.intel-glyph{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1;flex-shrink:0;border:1px solid currentColor}
.icard-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.icard-head-meta{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Memo trigger button — sits at top of Intel page, opens MondayMemoModal */
.memo-trigger{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;background:linear-gradient(135deg,var(--brand-primary) 0%,var(--brand-deep) 100%);color:#fff;border-radius:12px;padding:14px 18px;margin-bottom:18px;cursor:pointer;border:0;text-align:left;transition:transform 0.12s,box-shadow 0.15s;box-shadow:0 4px 14px rgba(63,123,40,0.32)}
.memo-trigger:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(63,123,40,0.42)}
.memo-trigger-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;font-weight:700;opacity:0.85;text-transform:uppercase}
.memo-trigger-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:17px;letter-spacing:0.005em;line-height:1.15;margin-top:3px}
.memo-trigger-sub{background:var(--brand-accent);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:8px 13px;border-radius:99px;flex-shrink:0;box-shadow:0 2px 8px rgba(214,122,90,0.4)}

/* Competitor direction badge — chunky pill (replaces inline arrow text) */
.comp-dir-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;flex-shrink:0;border:1.5px solid currentColor;background:transparent}
.comp-dir-badge-up{color:#A85959;background:rgba(168,89,89,0.08)}
.comp-dir-badge-down{color:#5D8054;background:rgba(93,128,84,0.08)}
.comp-dir-badge-flat{color:#7C7C7C;background:rgba(124,124,124,0.06)}
.comp-dir-badge-arrow{font-family:'Bagel Fat One',serif;font-size:13px;line-height:1}

/* ============================================================
   Counter-Strike Log (Phase 3 — new subtab)
   Native <details> accordion · collapsed shows 1-line · expanded shows full
   ============================================================ */
.cs-section{margin-top:8px}
.cs-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.cs-section-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.cs-section-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:26px;letter-spacing:0.005em;line-height:1;color:var(--ink)}
.cs-section-sub{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.5;color:var(--ink-soft);font-style:italic;max-width:520px;margin-top:6px}
.cs-section-count{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--ink);background:var(--brand-light-soft);padding:5px 11px;border-radius:99px;font-weight:700;text-transform:uppercase;border:1px solid rgba(111,175,77,0.32);white-space:nowrap}

.cs-log{display:flex;flex-direction:column;gap:12px}
.cs-entry{background:var(--butter-light);border:1.5px solid var(--brand-primary);border-radius:14px;box-shadow:0 2px 0 var(--brand-primary);overflow:hidden}
.cs-entry summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.cs-entry summary::-webkit-details-marker{display:none}
.cs-entry[open] .cs-entry-chev{transform:rotate(180deg)}
.cs-entry-chev{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--brand-primary);font-weight:700;transition:transform 0.2s;display:inline-block;margin-left:8px}
.cs-entry-trigger{min-width:0}
.cs-entry-stamp{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.cs-entry-comp{font-family:'Bagel Fat One',serif;font-weight:400;font-size:18px;letter-spacing:0.005em;color:var(--ink);line-height:1.1;margin-bottom:5px}
.cs-entry-detail-compact{font-size:12.5px;line-height:1.45;color:var(--ink-soft);max-width:640px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cs-entry-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.cs-entry-time{font-family:'Bagel Fat One',serif;font-size:26px;font-weight:400;color:var(--brand-accent);letter-spacing:0.005em;line-height:1}
.cs-entry-resp{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:0.04em;text-transform:uppercase}
.cs-entry-status{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:800;padding:4px 11px;border-radius:99px;margin-top:4px}
.cs-status-shipped{background:#DAEDC8;color:#3B6B2D}
.cs-status-ready{background:#FAEED1;color:#8B6F1F}
.cs-status-tracking{background:#E5E0F2;color:#4F4885}
.cs-entry-expanded{padding:14px 18px 18px;border-top:1px solid var(--brand-light);background:#fff}
.cs-entry-expanded-full{font-size:13.5px;line-height:1.55;color:var(--ink);margin-bottom:12px}
.cs-entry-source{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--brand-deep);font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
.cs-entry-drafts{margin-top:12px;padding-top:12px;border-top:1px dashed var(--brand-light);font-size:12px;color:var(--ink-soft);line-height:1.5}
.cs-entry-drafts strong{color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:10.5px;display:block;margin-bottom:4px;font-family:'JetBrains Mono',monospace}

/* Culture Momentum — popping/cooling, mirrored from Lil Bucks */
.cm-wrap{margin-bottom:22px}
.cm-header{margin-bottom:14px}
.cm-eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.18em;color:var(--brand-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.cm-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;line-height:1.05;color:var(--ink);margin:0 0 5px}
.cm-sub{font-family:'Fraunces',Georgia,serif;font-size:12.5px;line-height:1.5;color:var(--ink-soft);font-style:italic;max-width:660px}

.cm-item-title{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;color:var(--ink);margin-bottom:5px}

/* Error Boundary surface */

/* Pillar section */
/* MAAZAH PANEL — per-brief synthetic pre-test (inside Brief Modal) */
.mzp-section{background:linear-gradient(135deg,rgba(111,175,77,0.06) 0%,rgba(214,122,90,0.07) 100%);border:1.5px solid var(--brand-light);border-radius:14px;padding:20px 22px;margin-top:6px}
.mzp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:14px}
.mzp-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;color:var(--brand-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.mzp-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:21px;letter-spacing:0.005em;color:var(--ink);line-height:1.05}
.mzp-avg{display:flex;align-items:baseline;gap:4px;padding:8px 14px;border-radius:99px;font-weight:700;flex-shrink:0;font-family:'Bagel Fat One',serif}
.mzp-avg span:first-child{font-size:22px;line-height:1;letter-spacing:0.01em}
.mzp-avg span:last-child{font-size:11px;letter-spacing:0.04em;font-family:'JetBrains Mono',monospace;font-weight:600}
.mzp-avg-high{background:#E7F0DD;color:#3B6B2D;border:1.5px solid #B9D89A}
.mzp-avg-mid{background:#FAEED1;color:#8B6F1F;border:1.5px solid #E8C547}
.mzp-avg-low{background:#F8DCD7;color:#9E3F31;border:1.5px solid #E8B89E}
.mzp-headline{font-family:'Fraunces';font-size:14.5px;line-height:1.55;color:var(--ink);font-weight:500;font-style:italic;padding:12px 16px;background:#fff;border-left:3px solid var(--brand-primary);border-radius:0 8px 8px 0;margin-bottom:14px;letter-spacing:-0.005em}
.mzp-error{background:rgba(232,134,66,0.18);color:#9E3F31;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;font-family:'JetBrains Mono',monospace}
.mzp-run-btn{background:var(--brand-accent);color:#fff;border:0;padding:9px 18px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;cursor:pointer;transition:background 0.15s,transform 0.1s,box-shadow 0.15s;box-shadow:0 3px 0 var(--brand-accent-deep,#9E3F31);flex-shrink:0}
.mzp-run-btn:hover:not(:disabled){background:var(--brand-accent-deep,#9E3F31);transform:translateY(-1px);box-shadow:0 4px 0 #7E2E20}
.mzp-run-btn:disabled{opacity:0.45;cursor:not-allowed}
.mzp-running-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;color:var(--brand-accent);font-weight:700;text-transform:uppercase;animation:mzp-pulse-loading 1.4s ease-in-out infinite}
@keyframes mzp-pulse-loading{0%,100%{opacity:0.5}50%{opacity:1}}
.mzp-prerun{display:flex;align-items:flex-start;gap:14px;padding:12px 16px;background:var(--butter-light);border:1.5px dashed var(--brand-light);border-radius:10px}
.mzp-prerun-icon{font-size:24px;line-height:1;flex-shrink:0}
.mzp-prerun-title{font-family:'Fraunces';font-size:13.5px;line-height:1.4;color:var(--ink);font-weight:600;letter-spacing:-0.005em;margin-bottom:4px}
.mzp-prerun-sub{font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.55;color:var(--ink-soft);font-weight:500}
.mzp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:680px){.mzp-grid{grid-template-columns:1fr}}
.mzp-card{background:#fff;border:1.5px solid var(--brand-light);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.mzp-card-head{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center}
.mzp-card-emoji{font-size:24px;line-height:1;flex-shrink:0}
.mzp-card-id{min-width:0}
.mzp-card-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:15px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.mzp-card-age{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:var(--ink-soft);letter-spacing:0.04em}
.mzp-card-role{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase;margin-top:3px;line-height:1.35}
.mzp-score{display:flex;align-items:baseline;gap:1px;padding:5px 10px;border-radius:99px;font-weight:800;flex-shrink:0}
.mzp-score-num{font-family:'Bagel Fat One',serif;font-size:18px;font-weight:400;letter-spacing:0.01em;line-height:1}
.mzp-score-denom{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.04em;opacity:0.7}
.mzp-score-high{background:#E7F0DD;color:#3B6B2D}
.mzp-score-mid{background:#FAEED1;color:#8B6F1F}
.mzp-score-low{background:#F8DCD7;color:#9E3F31}
.mzp-score-loading{background:rgba(214,122,90,0.12);color:var(--brand-accent);font-family:'JetBrains Mono',monospace;letter-spacing:0.1em;animation:mzp-pulse-loading 1.4s ease-in-out infinite}
.mzp-card-quote{font-family:'Fraunces';font-size:13.5px;line-height:1.5;color:var(--ink);font-style:italic;font-weight:500;letter-spacing:-0.005em}
.mzp-card-edit{display:flex;gap:8px;align-items:flex-start;padding-top:8px;border-top:1px dashed var(--brand-light);font-size:11.5px;line-height:1.45}
.mzp-card-edit-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.12em;color:var(--brand-deep);font-weight:800;text-transform:uppercase;flex-shrink:0;padding-top:1px}
.mzp-card-edit-text{color:var(--ink-soft);font-style:italic}
.mzp-card-pulse{height:32px;background:linear-gradient(90deg,rgba(111,175,77,0.06) 25%,rgba(111,175,77,0.16) 50%,rgba(111,175,77,0.06) 75%);background-size:200% 100%;border-radius:6px;animation:mzp-shimmer 1.4s ease-in-out infinite}
@keyframes mzp-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* MEET THE PANEL — synthetic-reader roster (bottom of Briefs page) */
.panel-roster{margin-top:32px;padding:24px 26px 22px;background:linear-gradient(135deg,#F4FAEC 0%,#FDF1EB 100%);border:1.5px solid var(--brand-light);border-radius:16px}
.panel-roster-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;margin-bottom:18px}
@media(max-width:920px){.panel-roster-head{grid-template-columns:1fr}}
.panel-roster-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--brand-deep);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.panel-roster-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:24px;letter-spacing:0.005em;line-height:1.05;color:var(--ink);margin:0 0 8px}
.panel-roster-sub{font-family:'Fraunces',Georgia,serif;font-size:13.5px;line-height:1.55;color:var(--ink-soft);font-style:italic;max-width:660px;margin:0}
.panel-roster-sub strong{color:var(--ink);font-weight:700;font-style:normal}
.panel-roster-math{background:#fff;border:1px solid var(--brand-light);border-radius:10px;padding:11px 14px;max-width:300px}
.prm-eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--brand-deep);font-weight:800;text-transform:uppercase;margin-bottom:5px}
.prm-formula{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:var(--ink);font-weight:500}
.prm-formula strong{font-family:'Bagel Fat One',serif;font-weight:400;color:var(--brand-deep);font-size:13px}
.panel-roster-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:1100px){.panel-roster-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.panel-roster-grid{grid-template-columns:1fr}}
.panel-persona{background:#fff;border:1.5px solid var(--brand-light);border-radius:12px;padding:14px 15px 13px;display:flex;flex-direction:column;gap:9px}
.panel-persona-head{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start}
.panel-persona-emoji{font-size:30px;line-height:1;flex-shrink:0;grid-row:1/3}
.panel-persona-id{min-width:0}
.panel-persona-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:18px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.panel-persona-age{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:0.04em}
.panel-persona-city{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--ink-soft);letter-spacing:0.06em;margin-top:3px;text-transform:uppercase}
.panel-persona-label{grid-column:1/3;display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:99px;width:fit-content;margin-top:2px}
.panel-persona-label-layla{background:#C8E6AB;color:#2E5B22}
.panel-persona-label-brenna{background:#F2D5C2;color:#9E3F31}
.panel-persona-label-marcus{background:#F4C0B5;color:#7E2E20}
.panel-persona-label-priya{background:#F4E4A8;color:#8B6F1F}
.panel-persona-role{font-family:'Fraunces',Georgia,serif;font-size:12.5px;line-height:1.4;color:var(--ink);font-style:italic;padding:8px 10px;background:var(--butter-light);border-radius:8px}
.panel-persona-row{display:flex;flex-direction:column;gap:4px;font-size:11.5px;line-height:1.45;color:var(--ink-soft)}
.panel-persona-row-tag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;width:fit-content;padding:2px 6px;border-radius:4px}
.panel-persona-row-tag-up{background:rgba(111,175,77,0.18);color:#3B6B2D}
.panel-persona-row-tag-down{background:rgba(232,134,66,0.18);color:#9E3F31}
.panel-persona-row-body{color:var(--ink)}
.panel-roster-foot{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--brand-light);font-family:'Fraunces',Georgia,serif;font-size:12.5px;line-height:1.55;color:var(--ink-soft);font-style:italic}
.prf-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-primary);flex-shrink:0;margin-top:6px}

.pillar-section{margin-bottom:28px}
.pillar-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.pillar-swatch{width:14px;height:14px;border-radius:3px}
.pillar-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:19px;letter-spacing:0.01em;color:var(--ink)}
.pillar-meta{margin-left:auto;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;font-weight:600}

/* Brief card */
.brief-card{background:var(--paper);border:1.5px solid var(--green);border-radius:14px;padding:18px;cursor:pointer;transition:transform 0.12s,box-shadow 0.12s;position:relative;box-shadow:0 2px 0 var(--green)}
.brief-card:hover{box-shadow:0 4px 0 var(--green),0 6px 18px rgba(42,31,18,0.1);transform:translateY(-1px)}
.brief-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.brief-priority{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;font-weight:800;padding:4px 10px;border-radius:99px}
.priority-big{background:#FFE7AB;color:#8A5D0E}
.priority-high{background:#FBDAD2;color:#A85F4F}
.priority-standard{background:#F2EBD3;color:var(--ink-soft)}
.brief-platform{font-size:10.5px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:0.08em}
.brief-sku{font-size:10.5px;font-weight:700;background:var(--green-light);color:var(--green-deep);padding:3px 9px;border-radius:99px;border:1px solid rgba(111,175,77,0.35)}
.brief-concept{font-family:'Fraunces';font-size:14.5px;line-height:1.35;font-weight:500;letter-spacing:-0.005em;color:var(--ink);margin:7px 0 12px}
.brief-chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:11px;border-top:1px solid var(--border)}

.brief-chip-sku{border:1px solid transparent}
.brief-chip-sku-rrp-dip,.brief-chip-sku-lentil-dip{background:#F2D5C2;color:#9E3F31;border-color:#E0B8A0}
.brief-chip-sku-lemon-aioli{background:#F4E4A8;color:#8B6F1F;border-color:#E0CC78}
.brief-chip-sku-mango-chutney{background:#F3D1A8;color:#8B5A2B;border-color:#E0B888}
.brief-chip-sku-cilantro-chutney{background:#C8E6AB;color:#2E5B22;border-color:#A9D386}
.brief-chip-sku-chili-aioli{background:#F4C0B5;color:#7E2E20;border-color:#E09E8E}
.brief-chip-sku-brand{background:#C8E6AB;color:#2E5B22;border-color:#A9D386}
.brief-chip-sku-multi-sku{background:#F0E5C8;color:#5A4A2F;border-color:#DCC998}
.brief-id{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--green-deep)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(42,31,18,0.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:40px 16px;z-index:100}
.modal{background:var(--cream);border-radius:16px;max-width:880px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--border);box-shadow:var(--shadow-lg)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 30px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--cream);z-index:2}
.modal-head h2{font-family:'Bagel Fat One',serif;font-weight:400;font-size:30px;letter-spacing:0.005em;line-height:1.1;max-width:80%;color:var(--ink)}
.modal-close{font-size:24px;color:var(--ink-soft);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.modal-close:hover{background:var(--paper);color:var(--ink)}
.modal-body{padding:24px 30px 30px}

function getConviction(briefId) {
  const c = CONVICTION_INPUTS[briefId];
  if (!c) return null;
  const base = Math.round((c.voice + c.panel + c.pulse) / 3);
  const score = base + c.recency;
  const band = score >= 85 ? "HIGH" : score >= 70 ? "MEDIUM" : "WATCH";
  return { ...c, base, score, band, rideNow: c.recency >= 12 };
}

function ConvictionChip({ conv }) {
  const bandClass = "conv-band-" + conv.band.toLowerCase();
  return (
    <span className={"brief-conviction " + bandClass}>
      <span className="brief-conviction-label">{conv.band}</span>
      <span className="brief-conviction-num">{conv.score}</span>
      <div className="brief-conviction-tt">
        <div className="bct-head">
          <span className="bct-head-band">{conv.band} CONVICTION</span>
          <span className="bct-head-num">{conv.score}</span>
        </div>
        <div className="bct-rows">
          <div className="bct-row"><span className="bct-row-label">Voice Compass</span><div className="bct-row-bar"><div className="bct-row-fill" style={{width:conv.voice+"%"}}></div></div><span className="bct-row-num">{conv.voice}</span></div>

        </div>
        <div className="bct-math">
          <span>({conv.voice} + {conv.panel} + {conv.pulse}) ÷ 3 = <strong>{conv.base}</strong></span>
          <span>+ Recency bonus: <strong>+{conv.recency}</strong></span>
          <span className="bct-math-total">= <strong>{conv.score}</strong></span>
        </div>
        <div className="bct-foot">
          {conv.band === "HIGH" ? "Ship this first." : conv.band === "MEDIUM" ? "Solid — slot in normally." : "Watch — needs sharpening or skip."}
        </div>
      </div>
    </span>
  );
}

function MaazahApp() {
  const [page, setPage] = useState("intel");
  const [intelTab, setIntelTab] = useState("pulse");
  const [briefOpen, setBriefOpen] = useState(null);

  const [diagOpen, setDiagOpen] = useState(false);

  const [studioOpen, setStudioOpen] = useState(false);

  const briefById = (id) => BRIEFS.find(b => b.id === id);
  const openStudioWith = (seed) => {
    setStudioSeed(seed);
    setStudioOpen(true);
  };

  return (
    <div className="app">
      {/* SIDEBAR */}
      <aside className="sb">
        <div className="sb-brand">
          <MaazahArch className="sb-logo" />
          <div>
            <div className="sb-brand-name">MAAZAH</div>

        <button className={`sb-item ${page==="intel"?"active":""}`} onClick={() => setPage("intel")}>
          <span className="sb-item-icon">⌘</span> Intelligence Brief

        <button className={`sb-item ${page==="wholesale"?"active":""}`} onClick={() => setPage("wholesale")}>
          <span className="sb-item-icon">👁</span> Wholesale Lens
        </button>
        <button className={`sb-item ${page==="decisions"?"active":""}`} onClick={() => setPage("decisions")}>
          <span className="sb-item-icon">▶</span> Decisions Log <span className="sb-item-soon">{DECISIONS.length}</span>
        </button>
        <button className="sb-item" onClick={() => { setStudioSeed(null); setStudioOpen(true); }}>
          <span className="sb-item-icon">✦</span> Studio
        </button>
        <button className={`sb-item ${page==="calendar"?"active":""}`} onClick={() => setPage("calendar")}>
          <span className="sb-item-icon">▢</span> Calendar <span className="sb-item-soon">WIP</span>
        </button>
        <button className={`sb-item ${page==="performance"?"active":""}`} onClick={() => setPage("performance")}>
          <span className="sb-item-icon">↗</span> Performance <span className="sb-item-soon">WIP</span>
        </button>

        <button className="sb-diag-btn" onClick={() => setDiagOpen(true)}>
          <span style={{fontSize:16,lineHeight:1}}>💭</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.02em",lineHeight:1.2}}>Diagnostic Inbox</div>

          </div>
        </button>

        <div className="sb-footer">
          <strong>Built for Yasameen + Sheilla</strong>
          <button className="sb-howit" onClick={() => setPage("howit")}>{page === "howit" ? "◉" : "◌"} how it works</button>
        </div>
      </aside>

      {/* MAIN */}
      <main className="main">
        {page === "intel" && <IntelPage tab={intelTab} setTab={setIntelTab} openMemo={() => setMemoOpen(true)} openStudioWith={openStudioWith} />}
        {page === "briefs" && <BriefsPage onOpen={setBriefOpen} />}
        {page === "wholesale" && <WholesaleLensPage />}
        {page === "decisions" && <DecisionsPage />}
        {page === "howit" && <HowItWorksTab />}
        {page === "calendar" && <CalendarPreview />}
        {page === "performance" && <PerformancePreview />}

        <MainFooter />

        {briefOpen && <BriefModal brief={briefById(briefOpen)} onClose={() => setBriefOpen(null)} onDrop={() => {
          const b = briefById(briefOpen);
          const hook = b.hooks?.find(h => h.tag)?.text || b.hooks?.[0]?.text || b.concept;
          openStudioWith(`I want to sharpen brief ${b.id}: "${b.concept}".\n\nRecommended hook: "${hook}"\nPlatform: ${b.platform} · Pillar: ${b.pillarLabel} · SKU: ${b.sku}\n\nWhere can this land harder?`);
          setBriefOpen(null);
        }} />}
        {memoOpen && <MondayMemoModal onClose={() => setMemoOpen(false)} onShipIt={() => { setMemoOpen(false); setPage("intel"); }} />}
        {diagOpen && <DiagnosticInboxModal onClose={() => setDiagOpen(false)} />}
        {studioOpen && <StudioModal onClose={() => { setStudioOpen(false); setStudioSeed(null); }} initialSeed={studioSeed} />}
      </main>
    </div>
  );
}

/* ============================================================

    <div className="mmm-bg" onClick={onClose}>

        <button className="mmm-close" onClick={onClose} aria-label="close">×</button>

          <div className="mmm-hero-sig">— The Strategist</div>

          {/* THE READ */}
          <div className="mmm-section">

              <div className="mmm-read-sub-eye">What's happening</div>
              <p className="mmm-read">{WELCOME_THESIS.happening}</p>
            </div>
            <div className="mmm-read-block">
              <div className="mmm-read-sub-eye">Maazah's edge</div>
              <p className="mmm-read">{WELCOME_THESIS.edge}</p>
            </div>
            <div className="mmm-read-block">
              <div className="mmm-read-sub-eye">What we'd recommend</div>
              <p className="mmm-read" style={{whiteSpace:"pre-line"}}>{WELCOME_THESIS.job}</p>
            </div>
          </div>

          {/* 5 SIGNALS */}
          <div className="mmm-section">
            <div className="mmm-section-eye">// 5 SIGNALS DRIVING THE WEEK</div>

              {WELCOME_HIGHLIGHTS.map((h, i) => (
                <div key={i} className="mmm-signal">

              {WELCOME_MOVES.map((m, i) => (

                    <div className="mmm-move-verb">{m.verb}</div>

function PhoneShotList({ brief }) {
  const [activeFrame, setActiveFrame] = React.useState(0);
  if (!brief.scenes?.length) return null;
  const scenes = brief.scenes;
  const pillarTheme = brief.pillar || "magic";
  const isHookFrame = (i) => i === 1 && scenes.length >= 3;
  const isEndFrame = (i) => i === scenes.length - 1;
  return (
    <div className="psl-wrap">
      <div className="psl-header">
        <div>
          <div className="psl-eyebrow">// SHOT LIST · {brief.duration || "video"}</div>

          </div>
        )}
      </div>
      <div className="psl-carousel">
        {scenes.map((s, k) => {
          const active = activeFrame === k;
          const hook = isHookFrame(k);
          const end = isEndFrame(k);
          return (
            <button
              key={k}
              className={`psl-phone ${active ? "psl-phone-active" : "psl-phone-dim"} psl-theme-${pillarTheme}`}
              onClick={() => setActiveFrame(k)}
            >
              <div className="psl-phone-notch"></div>
              <div className="psl-phone-scene">{s.num ? `Frame ${s.num}` : `Frame ${k+1}`}</div>
              <div className="psl-phone-body">

              <div className="psl-phone-bottom">

function MaazahPanel({ brief }) {
  const [loading, setLoading] = React.useState(false);
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [requested, setRequested] = React.useState(false);

  React.useEffect(() => {
    setData(null);
    setError(null);
    setRequested(false);
  }, [brief.id]);

  function runPanel() {
    setRequested(true);
    setLoading(true);
    setData(null);
    setError(null);
    fetch('/api/panel', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ brief })
    })
      .then(r => r.json())
      .then(d => {
        if (d.reactions) setData(d);
        else setError(d.detail || d.error || 'panel failed');
        setLoading(false);
      })
      .catch(e => {
        setError(String(e));
        setLoading(false);
      });
  }

  const scoreColor = (s) => s >= 8 ? 'high' : s >= 5 ? 'mid' : 'low';
  const avg = data ? Math.round((data.reactions.reduce((a, r) => a + r.score, 0) / data.reactions.length) * 10) / 10 : null;

  return (
    <div className="mzp-section">
      <div className="mzp-head">
        <div>
          <div className="mzp-eyebrow">// THE PANEL READS THIS</div>
          <div className="mzp-title">4 synthetic customers · brief pre-test</div>
        </div>
        {avg != null ? (
          <div className={"mzp-avg mzp-avg-" + scoreColor(avg)}>
            <span>{avg}</span>
            <span>/10 avg</span>
          </div>
        ) : !requested ? (
          <button className="mzp-run-btn" onClick={runPanel} disabled={loading}>
            {loading ? "Running…" : "▷ Run pre-test"}
          </button>
        ) : loading ? (
          <span className="mzp-running-tag">running…</span>
        ) : null}
      </div>

      {data?.headline_insight && (
        <div className="mzp-headline">{data.headline_insight}</div>
      )}

      {!requested && !error && (
        <div className="mzp-prerun">
          <span className="mzp-prerun-icon">👥</span>
          <div>
            <div className="mzp-prerun-title">Pressure-test this brief against 4 simulated Maazah customers</div>
            <div className="mzp-prerun-sub">Layla (Afghan-American heritage · Twin Cities) · Brenna (Costco-mom · Naperville IL) · Marcus (category-curious foodie · Brooklyn) · Priya (working mom of 2 · Eden Prairie MN). Each scores it 1-10 with a reaction and an edit suggestion. ~3-5 seconds.</div>
          </div>
        </div>
      )}

      {error && <div className="mzp-error">⚠ {error}</div>}

      {(requested || data) && (
        <div className="mzp-grid">
          {MAAZAH_PANEL.map(p => {
            const reaction = data?.reactions?.find(r => r.persona === p.name);
            return (
              <div key={p.id} className="mzp-card">
                <div className="mzp-card-head">
                  <div className="mzp-card-emoji">{p.emoji}</div>
                  <div className="mzp-card-id">
                    <div className="mzp-card-name">{p.name} <span className="mzp-card-age">· {p.age}</span></div>
                    <div className="mzp-card-role">{p.label.toLowerCase().replace(/-/g, " ")} · {p.city}</div>
                  </div>
                  {reaction ? (
                    <div className={"mzp-score mzp-score-" + scoreColor(reaction.score)}>
                      <span className="mzp-score-num">{reaction.score}</span>
                      <span className="mzp-score-denom">/10</span>
                    </div>
                  ) : loading ? (
                    <div className="mzp-score mzp-score-loading"><span>·</span><span>·</span><span>·</span></div>
                  ) : null}
                </div>
                {reaction ? (
                  <>
                    <div className="mzp-card-quote">"{reaction.reaction}"</div>
                    {reaction.suggested_edit && reaction.suggested_edit !== "null" && reaction.suggested_edit !== null && (
                      <div className="mzp-card-edit">
                        <span className="mzp-card-edit-tag">+ edit</span>
                        <span className="mzp-card-edit-text">{reaction.suggested_edit}</span>
                      </div>
                    )}
                  </>
                ) : loading ? (
                  <div className="mzp-card-pulse"></div>
                ) : null}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function DiagnosticInboxModal({ onClose }) {
  const [answers, setAnswers] = useState({});
  const [drafts, setDrafts] = useState({});
  const [freeForm, setFreeForm] = useState("");
  const [freeFormLocked, setFreeFormLocked] = useState(false);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const selectOption = (qid, opt) => {
    setDrafts(d => ({ ...d, [qid]: { value: opt.value, label: opt.label, note: d[qid]?.note || "" } }));
  };
  const setDraftNote = (qid, note) => {
    setDrafts(d => ({ ...d, [qid]: { ...d[qid], note } }));
  };
  const lockAnswer = (qid) => {
    const draft = drafts[qid];
    if (!draft) return;
    setAnswers(a => ({ ...a, [qid]: { ...draft, locked: true } }));
  };
  const lockAnswerNoNote = (qid) => {
    const draft = drafts[qid];
    if (!draft) return;
    setAnswers(a => ({ ...a, [qid]: { ...draft, note: "", locked: true } }));
  };
  const changeAnswer = (qid) => {
    setAnswers(a => { const c = {...a}; delete c[qid]; return c; });
    setDrafts(d => { const c = {...d}; delete c[qid]; return c; });
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal diag-modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Diagnostic Inbox</h2>
          <button className="modal-close" onClick={onClose}>×</button>

          <div className="diag-q-list">
            {DIAG_QUESTIONS.map(q => {
              const locked = answers[q.id];
              const draft = drafts[q.id];
              return (
                <div key={q.id} className={`diag-q ${q.railClass}`}>
                  <div className="diag-q-head">
                    <span className="diag-q-glyph">{q.glyph}</span>
                    <div className="diag-q-body">
                      <div className="diag-q-eye">// {q.eye}</div>
                      <div className="diag-q-text">{q.text}</div>
                    </div>
                  </div>
                  {!locked && (
                    <>
                      <div className="diag-q-opts">
                        {q.opts.map(opt => (
                          <button key={opt.value} className={`diag-q-opt ${draft?.value === opt.value ? "selected" : ""}`} onClick={() => selectOption(q.id, opt)}>
                            {opt.label}
                          </button>
                        ))}
                      </div>
                      {draft && q.needsDetail && draft.value !== "none" && (
                        <div className="diag-q-detail">
                          <textarea
                            value={draft.note || ""}
                            onChange={(e) => setDraftNote(q.id, e.target.value)}
                            placeholder={q.detailPlaceholder}
                          />
                          <div className="diag-q-actions">
                            <button className="diag-q-lock" onClick={() => lockAnswer(q.id)}>Lock it in →</button>
                            <button className="diag-q-skip" onClick={() => lockAnswerNoNote(q.id)}>Skip note</button>
                          </div>
                        </div>
                      )}
                      {draft && (!q.needsDetail || draft.value === "none") && (
                        <div className="diag-q-detail">
                          <div className="diag-q-actions">
                            <button className="diag-q-lock" onClick={() => lockAnswer(q.id)}>Lock it in →</button>
                          </div>
                        </div>
                      )}
                    </>
                  )}
                  {locked && (
                    <div className="diag-q-locked">
                      <span className="diag-q-locked-pill">✓ LOCKED IN</span>
                      <div className="diag-q-locked-value">{locked.label}</div>
                      {locked.note && <div className="diag-q-locked-note">{locked.note}</div>}
                      <button className="diag-q-change" onClick={() => changeAnswer(q.id)}>↺ change my answer</button>
                    </div>
                  )}
                </div>
              );

            {/* Free-form catch-all */}
            <div className="diag-q diag-q-free">
              <div className="diag-q-head">
                <span className="diag-q-glyph">💭</span>
                <div className="diag-q-body">
                  <div className="diag-q-eye">// ANYTHING ELSE</div>

              {!freeFormLocked && (
                <div className="diag-q-detail">
                  <textarea
