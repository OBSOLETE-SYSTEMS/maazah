<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAAZAH — Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Bagel+Fat+One&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
:root{
  /* ============================================================
     Maazah brand palette — sampled from @maazahmagic + packaging.
     Token structure mirrors the OBSOLETE engine pattern
     (brand-primary / brand-accent / butter / ink / pillar-* / sku-*)
     so structural components port cleanly across engines.
     ============================================================ */

  /* Brand — primary green (Maazah kelly) */
  --brand-primary:#6FAF4D;        /* dominant — sidebar, header rules, primary CTAs */
  --brand-deep:#3F7B28;           /* deeper green for hover + ink-on-green */
  --brand-light:#C6E29F;          /* soft lime — accent surface */
  --brand-light-soft:#E8F2D5;     /* lightest green — subtle bg */

  /* Accent — Maazah's "magenta-equivalent" CTA color (chili coral) */
  --brand-accent:#D67A5A;         /* drop buttons, "ride this" callouts, hot chips */
  --brand-accent-deep:#B5563B;    /* deeper coral hover */

  /* Ink + paper (cream-on-warm-dark) */
  --ink:#2A1F12;                  /* warm dark ink — body text + headlines */
  --ink-soft:#5C4E3E;             /* softened ink */
  --butter:#F7F3E5;               /* cream paper — body bg */
  --butter-deep:#EDE5C8;          /* elevated cream surface */
  --butter-light:#FDFAF0;         /* lightest cream — card bg */
  --border:#D8CFB0;               /* warm cream-edge border */

  /* Pillar palette — one per Maazah content pillar */
  --pillar-magic:#6FAF4D;         /* MAGIC IS REAL — kelly green */
  --pillar-multiply:#D67A5A;      /* PUT IT ON EVERYTHING — chili coral */
  --pillar-mom:#E08642;           /* MOM'S TABLE — turmeric orange */
  --pillar-squad:#E8C547;         /* SAUCY SQUAD — lemon yellow */

  /* SKU chip palette */
  --sku-basil:#87B26F;            /* Basil Jalapeño dip */
  --sku-lemon:#E8C547;            /* Classic Lemon dip + Lemon Aioli */
  --sku-coral:#D67A5A;            /* Roasted Red Pepper dip */
  --sku-turmeric:#E08642;         /* Turmeric Ginger dip */
  --sku-cilantro:#7FB069;         /* Cilantro Chutney sauce */
  --sku-mango:#E8A66F;            /* Mango Chutney sauce */
  --sku-chili:#C84A38;            /* Chili Aioli sauce (NEW) */

  /* Shadows */
  --shadow:0 2px 10px rgba(42,31,18,0.08);
  --shadow-lg:0 10px 40px rgba(42,31,18,0.14);

  /* ============================================================
     Legacy V2 aliases — keep so existing CSS keeps working
     while new ported components reference abstract token names.
     ============================================================ */
  --green:#6FAF4D;                /* alias → --brand-primary */
  --green-deep:#3F7B28;           /* alias → --brand-deep */
  --green-soft:#C6E29F;           /* alias → --brand-light */
  --green-light:#E8F2D5;          /* alias → --brand-light-soft */
  --cream:#F7F3E5;                /* alias → --butter */
  --cream-deep:#EDE5C8;           /* alias → --butter-deep */
  --paper:#FDFAF0;                /* alias → --butter-light */
  --basil:#87B26F;
  --lemon:#E8C547;
  --coral:#D67A5A;
  --turmeric:#E08642;
  --cilantro:#7FB069;
  --mango:#E8A66F;
  --chili:#C84A38;
}
.display{font-family:'Bagel Fat One','Cooper Std',Georgia,serif;font-weight:400;letter-spacing:0.005em}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.mono{font-family:'JetBrains Mono','Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--butter);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:var(--sb-width,180px) minmax(0,1fr);min-height:100vh}
.sb-wrap{position:sticky;top:0;height:100vh;display:flex}
.sb-resize{flex-shrink:0;width:6px;cursor:col-resize;background:transparent;position:relative;transition:background 0.15s;user-select:none}
.sb-resize::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:32px;background:rgba(255,255,255,0.18);border-radius:99px;transition:background 0.15s}
.sb-resize:hover,.sb-resize.dragging{background:rgba(63,123,40,0.4)}
.sb-resize:hover::after,.sb-resize.dragging::after{background:rgba(255,255,255,0.6)}

/* Sidebar */
.sb{background:var(--green);color:#fff;border-right:1px solid var(--green-deep);padding:18px 11px;display:flex;flex-direction:column;gap:4px;flex:1;height:100vh;overflow-y:auto;overflow-x:hidden;min-width:0}
.sb-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:1px solid rgba(255,255,255,0.22);margin-bottom:10px}
.sb-logo{width:34px;height:38px;flex-shrink:0;color:var(--ink)}
.sb-brand-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:21px;letter-spacing:0.005em;color:var(--ink);line-height:0.95}
.sb-brand-sub{font-size:9px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(255,255,255,0.85);margin-top:3px;font-weight:600}
.sb-section-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.16em;color:rgba(255,255,255,0.75);padding:12px 9px 5px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-weight:500;font-size:12.5px;color:rgba(255,255,255,0.92);position:relative;text-align:left;width:100%}
.sb-item:hover{background:rgba(255,255,255,0.14)}
.sb-item.active{background:var(--ink);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(42,31,18,0.35)}
.sb-item-icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
.sb-item-soon{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;background:rgba(255,255,255,0.20);color:rgba(255,255,255,0.92);padding:2px 6px;border-radius:3px;margin-left:auto;font-weight:600}
.sb-item.active .sb-item-soon{background:rgba(255,255,255,0.28);color:#fff}
.sb-footer{margin-top:8px;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,0.18);font-size:11px;color:rgba(255,255,255,0.85);line-height:1.55}
.sb-footer strong{color:#fff;font-weight:700;display:block;margin-bottom:2px}
.sb-howit{margin-top:10px;width:100%;text-align:left;font-size:11.5px;color:#fff;background:rgba(255,255,255,0.16);padding:9px 12px;border-radius:8px;font-weight:500;letter-spacing:0.01em}
.sb-howit:hover{background:rgba(255,255,255,0.24)}
.sb-settings{margin-top:6px;width:100%;text-align:left;font-size:11.5px;color:#fff;background:rgba(255,255,255,0.10);padding:9px 12px;border-radius:8px;font-weight:500;letter-spacing:0.01em;display:flex;align-items:center;gap:8px;border:0;cursor:pointer}
.sb-settings:hover{background:rgba(255,255,255,0.20)}

/* AUTH GATE */
.auth-gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand-primary) 50%,var(--brand-accent-deep) 130%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px}
.auth-card{background:var(--paper);border-radius:20px;padding:36px 38px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.32);text-align:center;display:flex;flex-direction:column;align-items:center}
.auth-logo{width:64px;height:74px;color:var(--ink);margin-bottom:22px}
.auth-card form{width:100%}
.auth-eye{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;font-weight:700;color:var(--brand-accent-deep);text-transform:uppercase;margin-bottom:6px}
.auth-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:26px;letter-spacing:0.005em;line-height:1.1;color:var(--ink);margin-bottom:8px}
.auth-sub{font-family:'Fraunces',Georgia,serif;font-size:13.5px;line-height:1.5;color:var(--ink-soft);font-style:italic;margin-bottom:20px}
.auth-input{width:100%;padding:13px 15px;font-family:'JetBrains Mono',monospace;font-size:13px;border:1.5px solid var(--brand-light);border-radius:10px;background:#fff;color:var(--ink);letter-spacing:0.04em;margin-bottom:10px;outline:none;transition:border-color 0.15s,box-shadow 0.15s}
.auth-input:focus{border-color:var(--brand-primary);box-shadow:0 0 0 3px rgba(111,175,77,0.18)}
.auth-error{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#9E3F31;text-transform:uppercase;margin-bottom:10px;font-weight:700}
.auth-btn{width:100%;padding:13px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;font-weight:800;text-transform:uppercase;background:var(--brand-primary);color:#fff;border:0;border-radius:99px;cursor:pointer;box-shadow:0 4px 0 var(--brand-deep);transition:transform 0.1s,box-shadow 0.15s}
.auth-btn:hover{background:var(--brand-deep);transform:translateY(-1px);box-shadow:0 5px 0 var(--brand-deep)}
.auth-foot{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--ink-soft);text-transform:uppercase;font-weight:600;text-align:center;opacity:0.7}

/* SETTINGS MODAL */
.settings-bg{position:fixed;inset:0;background:rgba(42,31,18,0.55);display:flex;align-items:center;justify-content:center;z-index:9000;padding:24px}
.settings-card{background:var(--paper);border-radius:18px;padding:28px 32px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.settings-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}
.settings-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:24px;letter-spacing:0.005em;color:var(--ink);line-height:1.05}
.settings-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.settings-close{background:transparent;border:0;font-size:24px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:4px 8px}
.settings-section{margin-bottom:18px}
.settings-section:last-child{margin-bottom:0}
.settings-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;color:var(--ink-soft);font-weight:800;text-transform:uppercase;margin-bottom:10px}
.settings-options{display:flex;gap:6px}
.settings-opt{flex:1;padding:11px 14px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;font-weight:700;text-transform:uppercase;background:#fff;border:1.5px solid var(--brand-light);border-radius:8px;cursor:pointer;color:var(--ink);transition:background 0.12s,border-color 0.12s}
.settings-opt:hover{background:var(--butter-light)}
.settings-opt.active{background:var(--brand-primary);color:#fff;border-color:var(--brand-deep);box-shadow:0 2px 0 var(--brand-deep)}

/* THEME — DARK */
body.theme-dark{background:#1a1611;color:#F0E5D0}
body.theme-dark{--butter:#1f1a14;--butter-deep:#28221a;--butter-light:#251f18;--ink:#F0E5D0;--ink-soft:#B8A98E;--border:#3a3128;--paper:#241e17;--cream-deep:#2e271e;--cream:#1f1a14}
body.theme-dark .ticker{background:#0d0a07}
body.theme-dark .modal{background:#241e17;color:#F0E5D0}
body.theme-dark .modal-bg{background:rgba(10,7,4,0.85)}
body.theme-dark .wl-hero{background:#0d0a07}
body.theme-dark .hiw-hero{background:linear-gradient(135deg,#1a3d0e 0%,#3F7B28 50%,#7e2e20 130%)}
body.theme-dark .wip-banner{background:#28221a}
body.theme-dark .brief-card,body.theme-dark .card,body.theme-dark .intel-card,body.theme-dark .wl-card,body.theme-dark .panel-persona,body.theme-dark .mzp-card,body.theme-dark .etf-card,body.theme-dark .hiw-step{background:#241e17;color:#F0E5D0}
body.theme-dark .hiw-step:last-child{color:#fff}

/* FONT SIZE */
body.fs-sm .main{zoom:0.92}
body.fs-md .main{zoom:1}
body.fs-lg .main{zoom:1.12}

/* Diagnostic Inbox button — coral gradient pill, bottom of sidebar (Phase 1) */
.sb-diag-btn{margin-top:auto;margin-bottom:10px;display:flex;align-items:center;gap:10px;width:100%;background:linear-gradient(135deg,var(--brand-accent) 0%,var(--brand-accent-deep) 100%);color:#fff;border:1px solid rgba(255,255,255,0.18);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;box-shadow:0 4px 12px rgba(181,86,59,0.32);transition:transform 0.12s,box-shadow 0.12s;position:relative}
.sb-diag-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(181,86,59,0.42)}

/* Main footer — JetBrains Mono attribution line at bottom of every page */
.main-footer{margin-top:48px;padding:18px 0 6px;border-top:1px solid rgba(111,175,77,0.22);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--ink-soft);font-weight:600;text-transform:uppercase}
.main-footer strong{color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:0.12em}
.main-footer .footer-dot{width:5px;height:5px;border-radius:50%;background:var(--brand-primary);box-shadow:0 0 5px rgba(111,175,77,0.6)}

/* ============================================================
   How It Works tab — engine in motion
   ============================================================ */
.hiw-hero{background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand-primary) 50%,var(--brand-accent-deep) 130%);color:#fff;border-radius:18px;padding:36px 40px 32px;margin-bottom:28px;position:relative;overflow:hidden}
.hiw-hero-eye{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;font-weight:700;text-transform:uppercase;opacity:0.9;margin-bottom:12px}
.hiw-hero-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:32px;line-height:1.05;letter-spacing:0.005em;white-space:nowrap}
@media(max-width:880px){.hiw-hero-title{white-space:normal;font-size:28px;max-width:680px}}

.hiw-flow-band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:32px}
.hiw-step{background:var(--butter-light);border:1.5px solid var(--brand-primary);border-radius:14px;padding:18px 18px 20px;position:relative;display:flex;flex-direction:column;min-width:0;box-shadow:0 2px 0 var(--brand-primary)}
.hiw-step:last-child{background:linear-gradient(160deg,var(--brand-accent) 0%,var(--brand-accent-deep) 100%);color:#fff;border-color:var(--brand-accent-deep);box-shadow:0 2px 0 var(--brand-accent-deep)}
.hiw-step-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-width:0}
.hiw-step-icon{width:36px;height:36px;border-radius:9px;background:var(--brand-light-soft);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--brand-light)}
.hiw-step:last-child .hiw-step-icon{background:rgba(255,255,255,0.2);color:#fff;border-color:rgba(255,255,255,0.32)}
.hiw-step-num{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;font-weight:700;color:var(--ink-soft);text-transform:uppercase;min-width:0;flex:1}
.hiw-step:last-child .hiw-step-num{color:rgba(255,255,255,0.85)}
.hiw-step-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:24px;letter-spacing:0.005em;line-height:1.05;color:var(--ink);margin-bottom:8px;word-wrap:normal}
.hiw-step:last-child .hiw-step-name{color:#fff}
.hiw-step-body{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.5;color:var(--ink-soft);font-weight:500;letter-spacing:-0.005em;word-wrap:normal;overflow-wrap:normal;min-width:0}
.hiw-step:last-child .hiw-step-body{color:rgba(255,255,255,0.92)}
.hiw-step-arrow{position:absolute;right:-18px;top:30px;width:22px;height:22px;border-radius:50%;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2;box-shadow:0 2px 8px rgba(63,123,40,0.32)}
.hiw-step:last-child .hiw-step-arrow{display:none}
@media(max-width:980px){.hiw-flow-band{grid-template-columns:1fr 1fr}.hiw-step-arrow{display:none}}
@media(max-width:560px){.hiw-flow-band{grid-template-columns:1fr}}
.hiw-step:last-child .hiw-step-body{color:rgba(255,255,255,0.92)}
.hiw-step-arrow{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:2}
.hiw-step:last-child .hiw-step-arrow{display:none}

/* Engine Thinking Flow — 7 nodes + per-step card */
/* SOURCES + BRAND DNA section (above ETF) — coral theme to pop */
.src-section{margin-bottom:28px;background:linear-gradient(135deg,#FDF1EB 0%,#FCE7DC 100%);border:1.5px solid var(--brand-accent);border-left:6px solid var(--brand-accent-deep);border-radius:18px;padding:22px 26px;box-shadow:0 4px 16px rgba(214,122,90,0.14)}
.src-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed rgba(158,63,49,0.22)}
.src-eye{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:800;text-transform:uppercase;margin-bottom:5px}
.src-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:24px;letter-spacing:0.005em;line-height:1.05;color:var(--ink)}
.src-total{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;color:#fff;background:var(--brand-accent);padding:6px 14px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 0 var(--brand-accent-deep)}
.src-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media(max-width:780px){.src-stats{grid-template-columns:1fr 1fr}}
.src-stat{background:#fff;border:1.5px solid #F0C5B0;border-radius:12px;padding:14px 14px;text-align:center;box-shadow:0 2px 0 #F0C5B0}
.src-stat-num{font-family:'Bagel Fat One',serif;font-size:34px;color:var(--brand-accent-deep);line-height:1}
.src-stat-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-top:6px}
.src-lanes{display:flex;flex-direction:column;gap:5px}
.src-lane{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:rgba(255,255,255,0.55);border:1px solid rgba(158,63,49,0.12);border-radius:8px;font-size:12.5px;color:var(--ink);transition:background 0.12s}
.src-lane:hover{background:#fff}
.src-lane-label{font-weight:500}
.src-lane-count{font-family:'JetBrains Mono',monospace;font-weight:800;color:var(--brand-accent-deep);letter-spacing:0.04em;font-size:11.5px;white-space:nowrap}

.etf-section{margin-bottom:28px;background:var(--butter-light);border:1.5px solid var(--brand-primary);border-radius:18px;padding:20px 24px}
.etf-head{margin-bottom:30px}
.etf-eye{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.etf-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;line-height:1.05;color:var(--ink);margin-bottom:5px}
.etf-sub{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.45;color:var(--ink-soft);font-style:italic;max-width:760px}

.etf-pipeline{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:18px;padding:0 12px}
.etf-rail{position:absolute;top:50%;left:32px;right:32px;height:3px;background:var(--brand-light);transform:translateY(-50%);z-index:1;border-radius:99px}
.etf-rail-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--brand-primary) 0%,var(--brand-accent) 100%);border-radius:99px;transition:width 0.4s cubic-bezier(0.4,0,0.2,1)}
.etf-node{width:46px;height:46px;border-radius:50%;background:#fff;border:2.5px solid var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative;z-index:2;transition:transform 0.2s,box-shadow 0.2s,background 0.2s,border-color 0.2s}
.etf-node:hover{transform:scale(1.06)}
.etf-node.done{background:var(--brand-primary);border-color:var(--brand-deep);color:#fff}
.etf-node.active{background:var(--brand-accent);border-color:var(--brand-accent-deep);color:#fff;transform:scale(1.15);box-shadow:0 0 0 6px rgba(214,122,90,0.22),0 4px 14px rgba(214,122,90,0.4);animation:etf-pulse 2.2s ease-in-out infinite}
@keyframes etf-pulse{0%,100%{box-shadow:0 0 0 6px rgba(214,122,90,0.22),0 4px 14px rgba(214,122,90,0.4)}50%{box-shadow:0 0 0 10px rgba(214,122,90,0.12),0 4px 18px rgba(214,122,90,0.5)}}
.etf-node-num{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:700;white-space:nowrap}

.etf-card{background:#fff;border:1.5px solid var(--brand-primary);border-radius:14px;padding:18px 22px 16px;box-shadow:0 4px 16px rgba(63,123,40,0.1)}
.etf-card-row1{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--brand-light)}
.etf-card-icon{width:42px;height:42px;border-radius:10px;background:var(--brand-light-soft);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1.5px solid var(--brand-light)}
.etf-card-agent{flex:1;min-width:0}
.etf-card-agent-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:18px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.etf-card-agent-focus{font-size:11px;color:var(--ink-soft);margin-top:2px;font-family:'JetBrains Mono',monospace;letter-spacing:0.04em}
.etf-card-step-counter{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--brand-accent-deep);background:rgba(214,122,90,0.14);padding:4px 10px;border-radius:99px;font-weight:700;text-transform:uppercase;border:1px solid rgba(214,122,90,0.32);white-space:nowrap}
.etf-card-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr);gap:18px;align-items:start}
@media(max-width:960px){.etf-card-grid{grid-template-columns:1fr}}
.etf-card-col-left{display:flex;flex-direction:column;gap:10px;padding-right:18px;border-right:1px dashed var(--border)}
@media(max-width:960px){.etf-card-col-left{padding-right:0;border-right:0;padding-bottom:14px;border-bottom:1px dashed var(--border)}}
.etf-card-col-right{display:flex;flex-direction:column;gap:10px;min-width:0}
.etf-card-incoming{display:inline-flex;align-items:center;gap:6px;background:var(--brand-light-soft);color:var(--brand-deep);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.1em;font-weight:700;padding:4px 10px;border-radius:99px;text-transform:uppercase;border:1px dashed rgba(111,175,77,0.4);width:fit-content}
.etf-card-role{padding:11px 13px;background:linear-gradient(135deg,rgba(214,122,90,0.07) 0%,rgba(111,175,77,0.05) 100%);border:1px solid var(--brand-light);border-radius:10px}
.etf-card-role-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;font-weight:800;color:var(--brand-accent-deep);text-transform:uppercase;margin-bottom:5px}
.etf-card-role-body{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.5;color:var(--ink);font-weight:500;letter-spacing:-0.005em}
.etf-card-watch-block{}
.etf-card-block-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.etf-card-example-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.18em;color:var(--brand-deep);font-weight:800;text-transform:uppercase;display:inline-block;background:var(--butter-light);padding:3px 10px;border-radius:99px;border:1px solid var(--brand-light);width:fit-content;margin-bottom:2px}
.etf-card-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border)}
.etf-card-handoff{display:flex;align-items:center;gap:10px}
.etf-card-handoff-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--brand-accent-deep);font-weight:800;text-transform:uppercase;flex-shrink:0}
.etf-card-handoff-target{font-family:'Bagel Fat One',serif;font-weight:400;font-size:15px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.etf-card-watches{display:flex;flex-wrap:wrap;gap:6px}
.etf-card-watch-chip{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--brand-light-soft);color:var(--brand-deep);padding:3px 9px;border-radius:99px;letter-spacing:0.04em;font-weight:600;border:1px solid rgba(111,175,77,0.32)}
.etf-card-title{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:700;letter-spacing:-0.01em;color:var(--ink);margin-top:2px;margin-bottom:4px}
.etf-card-what{font-size:12.5px;line-height:1.5;color:var(--ink)}
.etf-card-filters{padding-top:10px;border-top:1px dashed var(--border)}
.etf-card-filters-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.etf-card-filter{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;color:var(--ink-soft);margin-bottom:3px}
.etf-card-filter::before{content:"·";color:var(--brand-primary);font-weight:800;flex-shrink:0}
.etf-card-verdict{background:linear-gradient(135deg,rgba(111,175,77,0.18) 0%,rgba(111,175,77,0.08) 100%);border-left:3px solid var(--brand-primary);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.45;color:var(--brand-deep);font-weight:600;letter-spacing:-0.005em;margin-top:6px}
.etf-card-verdict::before{content:"✓ ";color:var(--brand-primary);font-weight:800;font-family:'Bagel Fat One',serif}

/* Pipeline Status panel (Phase C) — live engine state */
.ps-section{background:var(--ink);color:#fff;border-radius:18px;padding:24px 28px;margin-bottom:32px;position:relative;overflow:hidden}
.ps-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed rgba(255,255,255,0.18)}
.ps-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;font-weight:700;color:var(--brand-light);text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.ps-eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--brand-primary);box-shadow:0 0 6px rgba(111,175,77,0.9);animation:ps-pulse 2.4s ease-in-out infinite}
@keyframes ps-pulse{0%,100%{opacity:0.5;box-shadow:0 0 4px rgba(111,175,77,0.6)}50%{opacity:1;box-shadow:0 0 10px rgba(111,175,77,1)}}
.ps-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;line-height:1.05;color:#fff}
.ps-meta{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:rgba(255,255,255,0.65);text-align:right;line-height:1.5;text-transform:uppercase}
.ps-meta strong{color:#fff;font-weight:700;display:block}
.ps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:820px){.ps-grid{grid-template-columns:1fr 1fr}}
.ps-stat{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:10px;padding:14px 16px}
.ps-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:32px;line-height:1;letter-spacing:0.005em;color:var(--brand-light);margin-bottom:4px}
.ps-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#fff;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.ps-detail{font-size:11px;color:rgba(255,255,255,0.72);line-height:1.45}
.ps-workers-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.18em;color:var(--brand-light);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.ps-workers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:680px){.ps-workers{grid-template-columns:1fr}}
.ps-worker{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:6px;padding:8px 11px;display:flex;align-items:flex-start;gap:8px;font-size:11px}
.ps-worker-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ps-worker-dot-active{background:#7FB069;box-shadow:0 0 4px rgba(127,176,105,0.6)}
.ps-worker-dot-ready{background:#E8C547}
.ps-worker-dot-deploying{background:#D67A5A}
.ps-worker-dot-auth-pending{background:#E08642}
.ps-worker-dot-platform-block{background:#9E3F31}
.ps-worker-body{flex:1;min-width:0}
.ps-worker-name{font-family:'JetBrains Mono',monospace;font-weight:700;color:#fff;letter-spacing:0.06em;text-transform:uppercase;font-size:10.5px;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ps-worker-count{font-family:'Bagel Fat One',serif;font-weight:400;font-size:13px;color:var(--brand-light);letter-spacing:0.02em}
.ps-worker-note{font-size:10.5px;color:rgba(255,255,255,0.6);line-height:1.4}
.ps-foot{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:rgba(255,255,255,0.45);text-transform:uppercase;font-weight:600;margin-top:18px;padding-top:14px;border-top:1px dashed rgba(255,255,255,0.14);text-align:center}

/* ETF nav buttons */
.etf-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:18px;border-top:1px dashed var(--border)}
.etf-nav-btn{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:9px 16px;border-radius:99px;cursor:pointer;background:transparent;border:1.5px solid var(--brand-primary);color:var(--brand-deep);transition:background 0.15s,color 0.15s}
.etf-nav-btn:hover:not(:disabled){background:var(--brand-primary);color:#fff}
.etf-nav-btn:disabled{opacity:0.4;cursor:not-allowed}
.etf-nav-progress{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:600;text-transform:uppercase}

/* HIW accordions — Decisions · Receipts · Brand Fence · Sources */
.howit-acc{background:var(--butter-light);border:1.5px solid var(--brand-primary);border-radius:14px;margin-bottom:14px;overflow:hidden}
.howit-acc summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.howit-acc summary::-webkit-details-marker{display:none}
.howit-acc[open] .howit-acc-chevron{transform:rotate(180deg)}
.howit-acc-chevron{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--brand-primary);font-weight:700;transition:transform 0.2s}
.howit-acc-titles{flex:1;min-width:0}
.howit-acc-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.howit-acc-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:20px;letter-spacing:0.005em;line-height:1;color:var(--ink)}
.howit-acc-count{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--ink);background:var(--brand-light-soft);padding:5px 11px;border-radius:99px;font-weight:700;text-transform:uppercase;border:1px solid rgba(111,175,77,0.32);white-space:nowrap}
.howit-acc-body{padding:0 22px 22px;border-top:1px solid var(--border)}
.howit-acc-body-padded{padding-top:14px}

/* ============================================================
   Diagnostic Inbox — operating tool, not pitch artifact
   ============================================================ */
.diag-modal{max-width:780px}
.diag-intro{font-family:'Fraunces',Georgia,serif;font-size:14px;line-height:1.55;color:var(--ink-soft);font-style:italic;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.diag-q-list{display:flex;flex-direction:column;gap:14px}
.diag-q{background:#fff;border:1.5px solid var(--brand-light);border-radius:12px;padding:0;overflow:hidden;position:relative}
.diag-q-onground{border-left:5px solid #6FAF4D}
.diag-q-orbit{border-left:5px solid #E8C547}
.diag-q-mood{border-left:5px solid #D67A5A}
.diag-q-free{border-left:5px solid #5E5A8A}
.diag-q-head{padding:14px 18px 10px;display:flex;align-items:flex-start;gap:12px}
.diag-q-glyph{font-size:24px;line-height:1;flex-shrink:0;margin-top:2px}
.diag-q-body{flex:1}
.diag-q-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:4px}
.diag-q-text{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:600;line-height:1.4;color:var(--ink);letter-spacing:-0.005em}
.diag-q-opts{padding:6px 18px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.diag-q-opts{grid-template-columns:1fr}}
.diag-q-opt{background:var(--butter-light);border:1.5px solid var(--border);color:var(--ink);font-size:12.5px;line-height:1.4;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;transition:all 0.12s;font-weight:500}
.diag-q-opt:hover{border-color:var(--brand-primary);transform:translateY(-1px)}
.diag-q-opt.selected{background:var(--brand-accent);color:#fff;border-color:var(--brand-accent-deep);font-weight:600}
.diag-q-detail{padding:0 18px 14px;animation:diag-fade 0.18s ease-out}
@keyframes diag-fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.diag-q-detail textarea{width:100%;min-height:60px;padding:10px 12px;border:1.5px solid var(--brand-light);border-radius:8px;background:var(--butter-light);font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;color:var(--ink);resize:vertical;outline:none;transition:border-color 0.15s}
.diag-q-detail textarea:focus{border-color:var(--brand-accent)}
.diag-q-actions{display:flex;gap:8px;margin-top:10px}
.diag-q-lock{background:var(--brand-accent);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:9px 16px;border-radius:99px;cursor:pointer;border:0;transition:background 0.15s,transform 0.1s}
.diag-q-lock:hover{background:var(--brand-accent-deep);transform:translateY(-1px)}
.diag-q-skip{background:transparent;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:9px 16px;border-radius:99px;cursor:pointer;border:1.5px solid var(--border)}
.diag-q-skip:hover{background:var(--butter-light)}
.diag-q-locked{padding:14px 18px;background:var(--brand-light-soft);border-top:1px dashed var(--brand-light)}
.diag-q-locked-pill{display:inline-flex;align-items:center;gap:6px;background:#DAEDC8;color:#3B6B2D;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;padding:5px 11px;border-radius:99px;margin-bottom:8px}
.diag-q-locked-value{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:4px}
.diag-q-locked-note{font-size:12.5px;line-height:1.5;color:var(--ink-soft);background:#fff;padding:9px 12px;border-radius:6px;border:1px solid var(--border);margin-bottom:8px;white-space:pre-line}
.diag-q-change{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;font-weight:700;color:var(--brand-deep);background:transparent;border:0;cursor:pointer;text-transform:uppercase}
.diag-q-change:hover{color:var(--brand-primary)}

/* ============================================================
   Studio Modal — The Strategist chat surface
   Backed by Gemini 2.5 Flash via /api/studio (thinkingBudget:0).
   ============================================================ */
.studio-bg{position:fixed;inset:0;background:rgba(42,31,18,0.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:400}
.studio-card{background:var(--butter);border-radius:18px;width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,0.4),0 0 0 1.5px var(--brand-primary);overflow:hidden}
.studio-head{display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand-primary) 100%);color:#fff;border-bottom:2px solid var(--brand-deep)}
.studio-head-glyph{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid rgba(255,255,255,0.28)}
.studio-head-titles{flex:1;min-width:0}
.studio-head-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:20px;letter-spacing:0.005em;line-height:1.05}
.studio-head-sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;opacity:0.88;margin-top:3px;text-transform:uppercase}
.studio-mode-toggle{display:flex;background:rgba(255,255,255,0.14);border-radius:99px;padding:3px;gap:2px}
.studio-mode-btn{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;font-weight:700;text-transform:uppercase;padding:6px 12px;border-radius:99px;color:rgba(255,255,255,0.78);cursor:pointer;background:transparent;border:0}
.studio-mode-btn.active{background:var(--brand-accent);color:#fff;box-shadow:0 2px 6px rgba(214,122,90,0.4)}
.studio-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.16);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;line-height:1;flex-shrink:0}
.studio-close:hover{background:rgba(255,255,255,0.3)}

.studio-body{flex:1;overflow-y:auto;padding:20px 24px}
.studio-welcome-eye{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.studio-welcome-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:26px;letter-spacing:0.005em;line-height:1.1;color:var(--ink);margin-bottom:6px}
.studio-welcome-sub{font-family:'Fraunces',Georgia,serif;font-size:13.5px;line-height:1.55;color:var(--ink-soft);font-style:italic;margin-bottom:18px;max-width:580px}
.studio-starters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:680px){.studio-starters{grid-template-columns:1fr}}
.studio-starter{background:#fff;border:1.5px solid var(--brand-light);border-radius:12px;padding:13px 15px;cursor:pointer;text-align:left;display:flex;gap:11px;align-items:flex-start;transition:transform 0.12s,border-color 0.12s,box-shadow 0.12s}
.studio-starter:hover{transform:translateY(-1px);border-color:var(--brand-primary);box-shadow:0 4px 12px rgba(63,123,40,0.15)}
.studio-starter-glyph{font-size:20px;line-height:1;flex-shrink:0;margin-top:1px}
.studio-starter-body{flex:1;min-width:0}
.studio-starter-text{font-size:13px;line-height:1.4;color:var(--ink);font-weight:500}
.studio-starter-arrow{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--brand-primary);font-weight:700;flex-shrink:0}

.studio-messages{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.studio-msg{display:flex;gap:10px;align-items:flex-end}
.studio-msg-user{justify-content:flex-end}
.studio-msg-bubble{padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;max-width:78%;white-space:pre-wrap}
.studio-msg-user .studio-msg-bubble{background:var(--brand-accent);color:#fff;border-radius:14px 14px 4px 14px}
.studio-msg-assistant .studio-msg-bubble{background:#fff;color:var(--ink);border:1px solid var(--brand-light);border-radius:14px 14px 14px 4px}

.studio-input-section{padding:14px 20px 18px;border-top:1.5px solid var(--brand-light);background:var(--butter-light)}
.studio-hint{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--ink-soft);text-transform:uppercase;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.studio-hint-dot{width:6px;height:6px;border-radius:50%;background:var(--brand-accent);animation:hint-pulse 2.4s ease-in-out infinite}
@keyframes hint-pulse{0%,100%{opacity:0.4}50%{opacity:1}}
.studio-input-row{display:flex;gap:8px;align-items:flex-end}
.studio-textarea{flex:1;min-height:46px;max-height:150px;font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.5;padding:12px 14px;border:1.5px solid var(--brand-light);border-radius:12px;background:#fff;color:var(--ink);resize:vertical;outline:none;transition:border-color 0.15s}
.studio-textarea:focus{border-color:var(--brand-primary);box-shadow:0 0 0 3px rgba(111,175,77,0.15)}
.studio-mic{width:46px;height:46px;border-radius:50%;background:#fff;border:1.5px solid var(--brand-light);color:var(--brand-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s,transform 0.1s}
.studio-mic:hover{background:var(--brand-light-soft);transform:translateY(-1px)}
.studio-mic.listening{background:var(--brand-accent);color:#fff;border-color:var(--brand-accent-deep);animation:hint-pulse 1.2s ease-in-out infinite}
.studio-send{background:var(--ink);color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:13px 20px;border-radius:99px;cursor:pointer;border:0;flex-shrink:0;transition:background 0.15s,transform 0.1s}
.studio-send:hover:not(:disabled){background:var(--brand-deep);transform:translateY(-1px)}
.studio-send:disabled{opacity:0.5;cursor:not-allowed}
.studio-shell-notice{background:rgba(214,122,90,0.12);border:1px dashed var(--brand-accent);color:var(--brand-accent-deep);padding:8px 12px;border-radius:8px;font-size:11.5px;line-height:1.45;margin-top:10px;font-family:'JetBrains Mono',monospace}

/* ============================================================
   Phone Shot List — swipeable phone-mockup carousel
   ============================================================ */
.psl-wrap{margin-bottom:20px;padding:18px 20px;background:linear-gradient(135deg,var(--butter-light) 0%,#FFF7C9 100%);border:1.5px solid var(--brand-light);border-radius:14px}
.psl-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px;flex-wrap:wrap}
.psl-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--brand-deep);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.psl-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:20px;letter-spacing:0.005em;color:var(--ink);line-height:1.1}
.psl-audio{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--brand-light);border-radius:10px;padding:10px 14px;max-width:380px;min-width:240px}
.psl-audio-icon{font-size:18px;color:var(--brand-accent-deep);line-height:1.2}
.psl-audio-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.psl-audio-text{font-size:12px;color:var(--ink);line-height:1.4;font-weight:500}
.psl-carousel{display:flex;gap:12px;overflow-x:auto;padding:6px 6px 12px;margin:0 -6px;scrollbar-width:thin;scrollbar-color:var(--brand-light) transparent}
.psl-carousel::-webkit-scrollbar{height:8px}
.psl-carousel::-webkit-scrollbar-thumb{background:var(--brand-light);border-radius:99px}
.psl-phone{flex-shrink:0;width:170px;border-radius:22px;padding:8px 0;display:flex;flex-direction:column;cursor:pointer;border:0;background:#1a1a1a;transition:all 0.18s;aspect-ratio:9/16;position:relative;overflow:hidden;color:#fff;text-align:left}
.psl-phone-dim{opacity:0.55;background:#3a3326}
.psl-phone-dim:hover{opacity:0.85}
.psl-phone-active{box-shadow:0 8px 24px rgba(42,31,18,0.22);padding:5px 0}
.psl-theme-magic.psl-phone-active{background:linear-gradient(160deg,var(--brand-primary) 0%,var(--brand-deep) 100%)}
.psl-theme-multiply.psl-phone-active{background:linear-gradient(160deg,var(--pillar-multiply) 0%,#B5563B 100%)}
.psl-theme-mom.psl-phone-active{background:linear-gradient(160deg,var(--pillar-mom) 0%,#B5612D 100%)}
.psl-theme-squad.psl-phone-active{background:linear-gradient(160deg,var(--pillar-squad) 0%,#C9A930 100%)}
.psl-phone-notch{width:46px;height:14px;background:#000;border-radius:99px;margin:0 auto 8px;flex-shrink:0}
.psl-phone-scene{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:rgba(255,255,255,0.85);font-weight:700;text-transform:uppercase;padding:0 14px;margin-bottom:8px}
.psl-phone-body{flex:1;padding:6px 14px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.psl-phone-text{font-family:'Fraunces',Georgia,serif;font-size:13.5px;line-height:1.35;font-weight:500;color:#fff;letter-spacing:-0.005em;overflow:hidden;text-wrap:pretty}
.psl-phone-text-hook{font-family:'Bagel Fat One',serif;font-size:17px;font-weight:400;line-height:1.1;letter-spacing:0.005em}
.psl-phone-text-endcard{font-family:'Bagel Fat One',serif;font-size:15px;font-weight:400;line-height:1.15;letter-spacing:0.005em;text-align:center}
.psl-phone-bottom{padding:10px 14px 14px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:rgba(255,255,255,0.78);letter-spacing:0.04em;font-weight:700}

/* ============================================================
   Footage Inspo — 4-lane grid (shoot · found · meme · archive)
   ============================================================ */
/* FOOTAGE INSPO accordion — yellow rail + circular chevron button */
.footage-acc{background:#FFFCEC;border:1.5px solid #EBD879;border-left:5px solid #E8C547;border-radius:12px;margin-bottom:20px;overflow:hidden;transition:box-shadow 0.15s}
.footage-acc[open]{box-shadow:0 4px 14px rgba(232,197,71,0.18)}
.footage-acc summary{list-style:none;cursor:pointer;padding:13px 14px 13px 16px;display:flex;align-items:center;gap:14px;outline:none}
.footage-acc summary::-webkit-details-marker{display:none}
.footage-acc summary:hover{background:rgba(232,197,71,0.08)}
.footage-acc-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;color:#8B6F1F;font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:6px;flex-shrink:0}
.footage-acc-title{font-family:'Fraunces',Georgia,serif;font-size:14px;line-height:1.4;color:var(--ink);font-weight:600;letter-spacing:-0.005em;flex:1;min-width:0;font-style:italic}
.footage-acc-chev{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#E8C547;color:#3F320A;font-size:12px;font-weight:900;flex-shrink:0;transition:transform 0.2s;box-shadow:0 1.5px 4px rgba(143,113,28,0.25)}
.footage-acc[open] .footage-acc-chev{transform:rotate(180deg)}
.footage-acc-body{padding:16px 18px 18px;border-top:1px solid #EBD879;background:#FFFEF5}
.footage-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:720px){.footage-grid{grid-template-columns:1fr}}
.footage-cat{padding:12px 14px;background:#fff;border:1px solid #EBD879;border-radius:8px}
.footage-cat-head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.footage-cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.footage-cat-shoot .footage-cat-dot{background:var(--brand-primary)}
.footage-cat-found .footage-cat-dot{background:var(--brand-accent)}
.footage-cat-memes .footage-cat-dot{background:#5E5A8A}
.footage-cat-archive .footage-cat-dot{background:#8A6E4D}
.footage-cat-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.15em;font-weight:800;text-transform:uppercase;color:var(--ink)}
.footage-cat-list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.footage-cat-list li{font-size:12px;line-height:1.45;color:var(--ink);padding-left:12px;position:relative}
.footage-cat-list li::before{content:"·";position:absolute;left:2px;top:0;color:#C7A623;font-weight:800}

/* ============================================================
   Amplify — collapsible paid-media-plan card
   Outer: details accordion with header bar
   Inner: thesis + 4 stat tiles + placements
   ============================================================ */
/* AMPLIFY accordion — coral rail + circular chevron button */
.amp-acc{background:#FDF1EB;border:1.5px solid #E8B89E;border-left:5px solid #D67A5A;border-radius:12px;margin-bottom:20px;overflow:hidden;transition:box-shadow 0.15s}
.amp-acc[open]{box-shadow:0 4px 14px rgba(214,122,90,0.18)}
.amp-acc summary{list-style:none;cursor:pointer;padding:13px 14px 13px 16px;display:flex;align-items:center;gap:14px;outline:none}
.amp-acc summary::-webkit-details-marker{display:none}
.amp-acc summary:hover{background:rgba(214,122,90,0.08)}
.amp-acc-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;color:#9E3F31;font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:6px;flex-shrink:0}
.amp-acc-title{font-family:'Fraunces',Georgia,serif;font-size:14px;line-height:1.4;color:var(--ink);font-weight:600;letter-spacing:-0.005em;flex:1;min-width:0;font-style:italic}
.amp-acc-chev{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#D67A5A;color:#fff;font-size:12px;font-weight:900;flex-shrink:0;transition:transform 0.2s;box-shadow:0 1.5px 4px rgba(158,63,49,0.28)}
.amp-acc[open] .amp-acc-chev{transform:rotate(180deg)}
.amp-acc-body{padding:18px;border-top:1px solid #E8B89E;background:#FFF8F3}
.amp-card-inner{background:#fff;border:1px solid var(--brand-light);border-radius:10px;padding:18px 20px}
.amp-thesis{padding:0 0 14px 14px;border-left:3px solid var(--brand-accent);margin-bottom:16px}
.amp-thesis-headline{font-family:'Fraunces',Georgia,serif;font-size:15.5px;line-height:1.4;color:var(--ink);font-weight:700;margin-bottom:8px;letter-spacing:-0.005em}
.amp-thesis-why{font-size:12.5px;line-height:1.55;color:var(--ink-soft);font-style:italic}
.amp-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--brand-light);border:1px solid var(--brand-light);border-radius:10px;overflow:hidden;margin-bottom:18px}
@media(max-width:720px){.amp-stats{grid-template-columns:1fr 1fr}}
.amp-stat{background:#fff;padding:11px 14px;min-width:0}
.amp-stat-label{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.amp-stat-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:20px;color:var(--ink);line-height:1.05;letter-spacing:0.005em}
.amp-stat-text{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.3;font-weight:500}
.amp-stat-guard{background:#FEF2F2}
.amp-stat-guard .amp-stat-label{color:#DC2626}
.amp-stat-guard .amp-stat-num{color:#991B1B;font-size:12px;font-family:'Fraunces',Georgia,serif;font-weight:500}
.amp-placements-head{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.12em;color:var(--ink-soft);font-weight:600;text-transform:uppercase;margin-bottom:10px}
.amp-placements{display:flex;flex-direction:column;gap:9px}
.amp-placement{padding:12px 14px;background:#fff;border:1px solid var(--brand-light);border-radius:10px}
.amp-placement-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.amp-placement-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.amp-placement-dot-meta{background:#1877F2}
.amp-placement-dot-tiktok{background:#FF0050}
.amp-placement-dot-pinterest{background:#E60023}
.amp-placement-dot-default{background:var(--brand-primary)}
.amp-placement-platform{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;font-weight:800;color:var(--ink)}
.amp-placement-format{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.06em;color:var(--ink-soft);font-weight:600}
.amp-placement-budget{font-family:'Bagel Fat One',serif;font-size:14px;color:var(--brand-deep);margin-left:auto;letter-spacing:0.005em}
.amp-placement-reach{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-soft);font-weight:600}
.amp-placement-audience{font-size:11.5px;line-height:1.5;color:var(--ink);margin-bottom:5px}
.amp-placement-lookalike{font-size:11px;line-height:1.5;color:var(--ink-soft);margin-bottom:5px}
.amp-placement-lookalike strong{color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;font-size:9.5px;font-family:'JetBrains Mono',monospace}
.amp-placement-note{font-size:11px;line-height:1.5;color:var(--ink-soft);font-style:italic;padding-top:6px;border-top:1px dashed var(--border);margin-top:6px}

/* WIP under-construction banner — used by Calendar + Performance + Diagnostic Inbox modal */
.wip-banner{background:var(--butter-light);border:2px dashed var(--brand-accent);border-radius:12px;padding:18px 22px;margin-bottom:24px;display:flex;align-items:flex-start;gap:14px}
.wip-banner-icon{font-size:24px;line-height:1;flex-shrink:0;margin-top:2px}
.wip-banner-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;font-weight:700;color:var(--brand-accent-deep);text-transform:uppercase;margin-bottom:4px}
.wip-banner-body{font-size:13px;line-height:1.5;color:var(--ink-soft)}
.wip-banner-body strong{color:var(--ink);font-weight:700}

/* Main */
.main{padding:20px 26px 60px;max-width:1400px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:12px;border-bottom:2px solid var(--green);margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-family:'Bagel Fat One',serif;font-weight:400;font-size:30px;letter-spacing:0.005em;line-height:0.95;color:var(--ink)}
.page-head .eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:0.18em;color:var(--green-deep);margin-bottom:5px;font-weight:700}
.page-head .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.date-pill{background:var(--green);color:#fff;font-weight:700;padding:6px 13px;border-radius:99px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase}
.refresh-pill{font-size:11px;color:var(--ink);display:flex;align-items:center;gap:6px;font-weight:500}
.refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(111,175,77,0.7)}

/* Ticker — slowed + label no longer competes with scroll */
.ticker{background:var(--ink);color:#fff;padding:10px 0 10px 18px;border-radius:10px;margin-bottom:24px;display:flex;align-items:center;gap:0;overflow:hidden;font-size:12px;position:relative}
.ticker-label{font-family:'Bagel Fat One',serif;color:var(--brand-light);font-size:13px;letter-spacing:0.01em;white-space:nowrap;flex-shrink:0;background:var(--ink);padding:4px 22px 4px 0;position:relative;z-index:5;box-shadow:14px 0 14px -10px var(--ink)}
.ticker-track{display:flex;gap:36px;flex:1;white-space:nowrap;animation:tickerScroll 160s linear infinite;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,0.92);letter-spacing:0.02em;padding-right:24px}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track strong{color:var(--brand-light);margin-right:6px}
.ticker-item{display:inline-flex;align-items:center;gap:8px}
.ticker-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 4px currentColor}
.ticker-dot-signal{background:#6FAF4D;color:#6FAF4D}
.ticker-dot-pulse{background:#D67A5A;color:#D67A5A}
.ticker-dot-decision{background:#E8C547;color:#E8C547}
.ticker-dot-win{background:#7FB069;color:#7FB069}
.ticker-dot-warning{background:#E08642;color:#E08642}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* Sub tabs */
.subtabs{display:flex;gap:4px;margin:0 0 24px;border-bottom:1px solid var(--border);padding-bottom:0}
.subtab{padding:10px 16px 13px;font-weight:600;font-size:13px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.subtab:hover{color:var(--ink)}
.subtab.active{color:var(--ink);border-bottom-color:var(--green)}
.subtab-count{background:rgba(111,175,77,0.16);color:var(--green-deep);padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;letter-spacing:0.02em}
.subtab.active .subtab-count{background:var(--green);color:#fff}

/* Editorial lede */
.lede{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--paper);border:1.5px solid var(--green);border-radius:12px;padding:0;margin-bottom:18px;overflow:hidden;box-shadow:0 2px 0 var(--green)}
.lede-col{padding:12px 16px;border-right:1px solid var(--border);min-width:0}
.lede-col:last-child{border-right:0}
.lede-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.16em;color:var(--green-deep);margin-bottom:5px;font-weight:700}
.lede-text{font-family:'Fraunces';font-size:12.5px;line-height:1.45;font-weight:500;color:var(--ink);letter-spacing:-0.005em}
@media(max-width:1180px){.lede{grid-template-columns:1fr 1fr}.lede-col:nth-child(2){border-right:0}.lede-col:nth-child(3){grid-column:1/-1;border-top:1px solid var(--border)}}
@media(max-width:680px){.lede{grid-template-columns:1fr}.lede-col{border-right:0;border-bottom:1px solid var(--border)}.lede-col:last-child{border-bottom:0}}

/* Cards grid */
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1180px){.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* Generic card */
.card{background:var(--paper);border:1.5px solid var(--green);border-radius:12px;padding:15px;position:relative;transition:transform 0.12s,box-shadow 0.12s;box-shadow:0 2px 0 var(--green)}
.card:hover{box-shadow:0 4px 0 var(--green),0 6px 18px rgba(42,31,18,0.1);transform:translateY(-1px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.card-type{font-size:9.5px;text-transform:uppercase;letter-spacing:0.14em;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--green);color:#fff}
.card-velocity{font-size:9.5px;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink);display:flex;align-items:center;gap:5px;font-weight:600}
.velocity-dot{width:6px;height:6px;border-radius:50%}
.velocity-high{background:#D34A4A}
.velocity-medium{background:#E0A53C}
.velocity-low{background:#7FB069}
.card-hook{font-family:'Fraunces';font-size:16px;line-height:1.25;font-weight:600;letter-spacing:-0.015em;margin-bottom:8px;color:var(--ink)}
.card-detail{font-size:12px;line-height:1.5;color:var(--ink-soft);margin-bottom:10px}
.card-play{background:var(--green-light);border-left:3px solid var(--green);padding:11px 13px;border-radius:0 6px 6px 0;font-size:13px;line-height:1.5;margin-bottom:12px;color:var(--ink)}
.card-play-label{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;font-weight:700;color:var(--green-deep);display:block;margin-bottom:4px}
.card-meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.card-meta-chip{font-size:11px;background:var(--cream-deep);padding:4px 10px;border-radius:99px;color:var(--ink);font-weight:600;border:1px solid var(--border)}
.card-dna-chip{font-size:10.5px;background:var(--ink);color:#fff;padding:4px 10px;border-radius:99px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase}
.card-sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:10px;border-top:1px solid var(--border)}
.source-chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;background:var(--green-light);color:var(--green-deep);padding:3px 8px;border-radius:99px;letter-spacing:0;font-weight:600;border:1px solid rgba(111,175,77,0.4)}
.source-chip:hover{background:var(--green);color:#fff;border-color:var(--green)}
.card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.card-actions-right{justify-content:flex-end}
.brief-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(111,175,77,0.08);border:1px solid var(--brand-light);border-radius:8px;padding:9px 11px;margin:8px 0 0;cursor:pointer;transition:background 0.12s,border-color 0.12s;font-family:'Inter',sans-serif}
button.brief-link{font:inherit;font-family:'Inter',sans-serif}
.brief-link:hover{background:rgba(111,175,77,0.14);border-color:var(--brand-primary)}
.brief-link-later{cursor:default;background:rgba(232,134,66,0.06);border-color:rgba(232,134,66,0.28)}
.brief-link-later:hover{background:rgba(232,134,66,0.06);border-color:rgba(232,134,66,0.28)}
.brief-link-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;color:var(--brand-deep);flex-shrink:0;white-space:nowrap}

/* ============================================================

   ============================================================ */
.brief-conviction{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.1em;font-weight:800;text-transform:uppercase;cursor:help;position:relative;border:1.5px solid currentColor}

.brief-conviction-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:13px;line-height:1;letter-spacing:0;padding:3px 7px 2px;color:#fff;border-radius:99px;min-width:24px;text-align:center}
.conv-band-high .brief-conviction-num{background:#6FAF4D}

.bct-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:9px;border-bottom:1px dashed var(--brand-light);margin-bottom:9px}

.bct-head-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.bct-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.bct-row{display:flex;align-items:center;gap:8px;font-size:11px}
.bct-row-label{flex:0 0 120px;font-family:'Inter',sans-serif;color:var(--ink-soft);font-weight:600;font-size:10.5px}
.bct-row-bar{flex:1;height:5px;background:var(--brand-light-soft);border-radius:99px;overflow:hidden}
.bct-row-fill{height:100%;background:linear-gradient(90deg,var(--brand-primary) 0%,var(--brand-accent) 100%);border-radius:99px}
.bct-row-num{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;color:var(--ink);min-width:24px;text-align:right}
.bct-math{display:flex;flex-direction:column;gap:3px;padding:8px 10px;background:var(--butter-light);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink);margin-bottom:8px}

/* ============================================================

   ============================================================ */
.ride-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand-primary) 55%,var(--brand-accent-deep) 130%);color:#fff;border-radius:14px;padding:20px 28px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(63,123,40,0.28)}

.ride-hero-left{display:flex;align-items:center;gap:20px;position:relative;z-index:2}

.feedback-export-btn{margin-top:10px;background:rgba(255,255,255,0.95);color:var(--green-deep);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;font-weight:800;padding:8px 14px;border-radius:99px;border:1.5px solid rgba(255,255,255,0.6);transition:transform 0.1s,background 0.15s}

@media(max-width:740px){.ride-hero{flex-direction:column;align-items:flex-start;gap:14px}.ride-hero-right{align-self:flex-start;text-align:left}}

.pulse-fit{display:flex;flex-direction:column;gap:3px;margin:10px 0 0;padding:8px 10px;background:rgba(111,175,77,0.08);border:1px solid rgba(111,175,77,0.28);border-radius:8px}

.nfg-banner-icon{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.nfg-banner-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:15px;color:var(--ink);line-height:1.1;margin-bottom:3px}

.mmm-section-sub{font-size:12.5px;line-height:1.5;color:var(--ink-soft);font-style:italic;margin:-2px 0 12px}

.mmm-shoot-horizon{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.1em;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:rgba(42,31,18,0.07);color:var(--ink-soft)}

.mmm-shoot-label{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.12em;font-weight:800;text-transform:uppercase;color:var(--brand-deep);margin-right:5px}
.mmm-shoot-bet{font-size:13px;line-height:1.5;color:var(--ink);font-weight:600;margin-bottom:5px}

.mmm-shoot-action-label{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.12em;font-weight:800;text-transform:uppercase;color:var(--green-deep);margin-right:6px}
.promise-banner{display:flex;align-items:center;gap:16px;margin:0 0 16px;padding:14px 20px;background:linear-gradient(100deg,var(--green) 0%,#7FB85A 100%);border-radius:14px;color:#fff;box-shadow:0 2px 0 var(--green-deep)}

/* ============================================================

   Native <details> accordion · collapsed shows 1-line · expanded shows full
   ============================================================ */
.cs-section{margin-top:8px}

.cs-section-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.cs-section-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:26px;letter-spacing:0.005em;line-height:1;color:var(--ink)}
.cs-section-sub{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.5;color:var(--ink-soft);font-style:italic;max-width:520px;margin-top:6px}
.cs-section-count{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--ink);background:var(--brand-light-soft);padding:5px 11px;border-radius:99px;font-weight:700;text-transform:uppercase;border:1px solid rgba(111,175,77,0.32);white-space:nowrap}

.cs-log{display:flex;flex-direction:column;gap:12px}

.cs-entry[open] .cs-entry-chev{transform:rotate(180deg)}
.cs-entry-chev{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--brand-primary);font-weight:700;transition:transform 0.2s;display:inline-block;margin-left:8px}
.cs-entry-trigger{min-width:0}
.cs-entry-stamp{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}

.cs-entry-detail-compact{font-size:12.5px;line-height:1.45;color:var(--ink-soft);max-width:640px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cs-entry-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.cs-entry-time{font-family:'Bagel Fat One',serif;font-size:26px;font-weight:400;color:var(--brand-accent);letter-spacing:0.005em;line-height:1}
.cs-entry-resp{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:0.04em;text-transform:uppercase}
.cs-entry-status{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:800;padding:4px 11px;border-radius:99px;margin-top:4px}
.cs-status-shipped{background:#DAEDC8;color:#3B6B2D}
.cs-status-ready{background:#FAEED1;color:#8B6F1F}
.cs-status-tracking{background:#E5E0F2;color:#4F4885}
.cs-entry-expanded{padding:14px 18px 18px;border-top:1px solid var(--brand-light);background:#fff}
.cs-entry-expanded-full{font-size:13.5px;line-height:1.55;color:var(--ink);margin-bottom:12px}
.cs-entry-source{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--brand-deep);font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
.cs-entry-drafts{margin-top:12px;padding-top:12px;border-top:1px dashed var(--brand-light);font-size:12px;color:var(--ink-soft);line-height:1.5}
.cs-entry-drafts strong{color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:10.5px;display:block;margin-bottom:4px;font-family:'JetBrains Mono',monospace}

/* Culture Momentum — popping/cooling, mirrored from Lil Bucks */
.cm-wrap{margin-bottom:22px}
.cm-header{margin-bottom:14px}

.cm-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;line-height:1.05;color:var(--ink);margin:0 0 5px}

.cm-col-cooling .cm-int{background:#F2C9B6;color:#7E2E20;border:1px solid #E0AA92}
