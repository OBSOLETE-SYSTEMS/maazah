.cm-item-body{font-size:12.5px;line-height:1.5;color:var(--ink-soft);font-style:italic}

/* Pillar pips */
.trend-pillars{display:flex;gap:4px;flex-wrap:wrap}
.pillar-pip{font-size:9.5px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;padding:2px 7px;border-radius:3px;color:#fff}
.pip-magic{background:var(--green)}
.pip-multiply{background:var(--coral)}
.pip-mom{background:var(--turmeric)}
.pip-squad{background:var(--lemon);color:var(--ink)}

/* Pulse type colors */
/* Error Boundary surface */
.eb-wrap{padding:40px 32px;max-width:680px;margin:0 auto}
.eb-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.eb-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:30px;color:var(--ink);margin-bottom:10px;line-height:1.05;letter-spacing:0.005em}
.eb-body{font-family:'Fraunces',Georgia,serif;font-size:14.5px;line-height:1.55;color:var(--ink-soft);margin-bottom:18px}
.eb-details{margin-bottom:18px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--ink-soft);opacity:0.85}
.eb-details summary{cursor:pointer;margin-bottom:6px}
.eb-details pre{background:var(--butter-light);padding:12px;border-radius:6px;border:1px solid var(--border);white-space:pre-wrap;font-size:10px;max-height:180px;overflow:auto}
.eb-btn{padding:10px 18px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;cursor:pointer;margin-right:8px}
.eb-btn-primary{background:var(--brand-accent);color:#fff;border:0}
.eb-btn-secondary{background:transparent;color:var(--brand-deep);border:1.5px solid var(--brand-primary)}

/* Cultural Pulse card type colors (dynamic via type-${p.type}) */
.card-type-competitor{background:#8A6E4D;color:#fff}
.type-meme{background:#F4DAE2;color:#A85575}
.type-recipe{background:#E6F0DC;color:#5D7E47}
.type-archetype{background:#FBE0CE;color:#A05E2D}
.type-news{background:#E8E6F0;color:#5E5A8A}
.type-cultural{background:#FDE8C4;color:#A07526}
.type-entertainment{background:#F5DCEF;color:#854577}

/* Competitor extras */
.comp-direction{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em}
.dir-up{color:#A85959}
.dir-down{color:#5D8054}
.dir-flat{color:var(--ink-soft)}

/* Ambassador */
.amb-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center}
.amb-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--lemon));display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:'Bagel Fat One',serif;font-weight:400;font-size:16px;flex-shrink:0;letter-spacing:0.01em}
.amb-handle{font-weight:700;font-size:14px}
.amb-handle-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.amb-stats{font-size:11px;color:var(--ink-soft);margin-top:5px;display:flex;gap:9px}
.amb-status{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;padding:3px 8px;border-radius:4px}
.status-active{background:#E0F0D0;color:#5D7E47}
.status-watch{background:#F4ECD0;color:#8A752B}
.status-cold{background:#F0E5DA;color:#8A6E4D}

/* Pillar section */
/* MAAZAH PANEL — per-brief synthetic pre-test (inside Brief Modal) */
.mzp-section{background:linear-gradient(135deg,rgba(111,175,77,0.06) 0%,rgba(214,122,90,0.07) 100%);border:1.5px solid var(--brand-light);border-radius:14px;padding:20px 22px;margin-top:6px}
.mzp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:14px}
.mzp-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;color:var(--brand-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.mzp-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:21px;letter-spacing:0.005em;color:var(--ink);line-height:1.05}
.mzp-avg{display:flex;align-items:baseline;gap:4px;padding:8px 14px;border-radius:99px;font-weight:700;flex-shrink:0;font-family:'Bagel Fat One',serif}
.mzp-avg span:first-child{font-size:22px;line-height:1;letter-spacing:0.01em}
.mzp-avg span:last-child{font-size:11px;letter-spacing:0.04em;font-family:'JetBrains Mono',monospace;font-weight:600}
.mzp-avg-high{background:#E7F0DD;color:#3B6B2D;border:1.5px solid #B9D89A}
.mzp-avg-mid{background:#FAEED1;color:#8B6F1F;border:1.5px solid #E8C547}
.mzp-avg-low{background:#F8DCD7;color:#9E3F31;border:1.5px solid #E8B89E}
.mzp-headline{font-family:'Fraunces';font-size:14.5px;line-height:1.55;color:var(--ink);font-weight:500;font-style:italic;padding:12px 16px;background:#fff;border-left:3px solid var(--brand-primary);border-radius:0 8px 8px 0;margin-bottom:14px;letter-spacing:-0.005em}
.mzp-error{background:rgba(232,134,66,0.18);color:#9E3F31;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;font-family:'JetBrains Mono',monospace}
.mzp-run-btn{background:var(--brand-accent);color:#fff;border:0;padding:9px 18px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;cursor:pointer;transition:background 0.15s,transform 0.1s,box-shadow 0.15s;box-shadow:0 3px 0 var(--brand-accent-deep,#9E3F31);flex-shrink:0}
.mzp-run-btn:hover:not(:disabled){background:var(--brand-accent-deep,#9E3F31);transform:translateY(-1px);box-shadow:0 4px 0 #7E2E20}
.mzp-run-btn:disabled{opacity:0.45;cursor:not-allowed}
.mzp-running-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;color:var(--brand-accent);font-weight:700;text-transform:uppercase;animation:mzp-pulse-loading 1.4s ease-in-out infinite}
@keyframes mzp-pulse-loading{0%,100%{opacity:0.5}50%{opacity:1}}
.mzp-prerun{display:flex;align-items:flex-start;gap:14px;padding:12px 16px;background:var(--butter-light);border:1.5px dashed var(--brand-light);border-radius:10px}
.mzp-prerun-icon{font-size:24px;line-height:1;flex-shrink:0}
.mzp-prerun-title{font-family:'Fraunces';font-size:13.5px;line-height:1.4;color:var(--ink);font-weight:600;letter-spacing:-0.005em;margin-bottom:4px}
.mzp-prerun-sub{font-family:'Inter',sans-serif;font-size:11.5px;line-height:1.55;color:var(--ink-soft);font-weight:500}
.mzp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:680px){.mzp-grid{grid-template-columns:1fr}}
.mzp-card{background:#fff;border:1.5px solid var(--brand-light);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.mzp-card-head{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center}
.mzp-card-emoji{font-size:24px;line-height:1;flex-shrink:0}
.mzp-card-id{min-width:0}
.mzp-card-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:15px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.mzp-card-age{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:var(--ink-soft);letter-spacing:0.04em}
.mzp-card-role{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase;margin-top:3px;line-height:1.35}
.mzp-score{display:flex;align-items:baseline;gap:1px;padding:5px 10px;border-radius:99px;font-weight:800;flex-shrink:0}
.mzp-score-num{font-family:'Bagel Fat One',serif;font-size:18px;font-weight:400;letter-spacing:0.01em;line-height:1}
.mzp-score-denom{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.04em;opacity:0.7}
.mzp-score-high{background:#E7F0DD;color:#3B6B2D}
.mzp-score-mid{background:#FAEED1;color:#8B6F1F}
.mzp-score-low{background:#F8DCD7;color:#9E3F31}
.mzp-score-loading{background:rgba(214,122,90,0.12);color:var(--brand-accent);font-family:'JetBrains Mono',monospace;letter-spacing:0.1em;animation:mzp-pulse-loading 1.4s ease-in-out infinite}
.mzp-card-quote{font-family:'Fraunces';font-size:13.5px;line-height:1.5;color:var(--ink);font-style:italic;font-weight:500;letter-spacing:-0.005em}
.mzp-card-edit{display:flex;gap:8px;align-items:flex-start;padding-top:8px;border-top:1px dashed var(--brand-light);font-size:11.5px;line-height:1.45}
.mzp-card-edit-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.12em;color:var(--brand-deep);font-weight:800;text-transform:uppercase;flex-shrink:0;padding-top:1px}
.mzp-card-edit-text{color:var(--ink-soft);font-style:italic}
.mzp-card-pulse{height:32px;background:linear-gradient(90deg,rgba(111,175,77,0.06) 25%,rgba(111,175,77,0.16) 50%,rgba(111,175,77,0.06) 75%);background-size:200% 100%;border-radius:6px;animation:mzp-shimmer 1.4s ease-in-out infinite}
@keyframes mzp-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* MEET THE PANEL — synthetic-reader roster (bottom of Briefs page) */
.panel-roster{margin-top:32px;padding:24px 26px 22px;background:linear-gradient(135deg,#F4FAEC 0%,#FDF1EB 100%);border:1.5px solid var(--brand-light);border-radius:16px}
.panel-roster-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;margin-bottom:18px}
@media(max-width:920px){.panel-roster-head{grid-template-columns:1fr}}
.panel-roster-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--brand-deep);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.panel-roster-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:24px;letter-spacing:0.005em;line-height:1.05;color:var(--ink);margin:0 0 8px}
.panel-roster-sub{font-family:'Fraunces',Georgia,serif;font-size:13.5px;line-height:1.55;color:var(--ink-soft);font-style:italic;max-width:660px;margin:0}
.panel-roster-sub strong{color:var(--ink);font-weight:700;font-style:normal}
.panel-roster-math{background:#fff;border:1px solid var(--brand-light);border-radius:10px;padding:11px 14px;max-width:300px}
.prm-eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--brand-deep);font-weight:800;text-transform:uppercase;margin-bottom:5px}
.prm-formula{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:var(--ink);font-weight:500}
.prm-formula strong{font-family:'Bagel Fat One',serif;font-weight:400;color:var(--brand-deep);font-size:13px}
.panel-roster-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:1100px){.panel-roster-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.panel-roster-grid{grid-template-columns:1fr}}
.panel-persona{background:#fff;border:1.5px solid var(--brand-light);border-radius:12px;padding:14px 15px 13px;display:flex;flex-direction:column;gap:9px}
.panel-persona-head{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start}
.panel-persona-emoji{font-size:30px;line-height:1;flex-shrink:0;grid-row:1/3}
.panel-persona-id{min-width:0}
.panel-persona-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:18px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.panel-persona-age{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:0.04em}
.panel-persona-city{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--ink-soft);letter-spacing:0.06em;margin-top:3px;text-transform:uppercase}
.panel-persona-label{grid-column:1/3;display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:99px;width:fit-content;margin-top:2px}
.panel-persona-label-layla{background:#C8E6AB;color:#2E5B22}
.panel-persona-label-brenna{background:#F2D5C2;color:#9E3F31}
.panel-persona-label-marcus{background:#F4C0B5;color:#7E2E20}
.panel-persona-label-priya{background:#F4E4A8;color:#8B6F1F}
.panel-persona-label-maya{background:#D9E7F2;color:#2F5A7E}
.panel-persona-tier{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.12em;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-top:6px;width:fit-content}
.panel-persona-tier-core{background:rgba(111,175,77,0.16);color:#3B6B2D}
.panel-persona-tier-expansion{background:rgba(47,90,126,0.14);color:#2F5A7E}
.panel-persona-values{margin-top:8px;font-size:10.5px;line-height:1.5;color:var(--ink-soft);background:rgba(111,175,77,0.07);border:1px dashed rgba(111,175,77,0.3);border-radius:7px;padding:7px 9px}
.panel-persona-values strong{color:var(--ink);font-weight:700}
.panel-roster-valuesbar{margin:0 0 18px;padding:11px 14px;background:rgba(111,175,77,0.08);border:1px solid rgba(111,175,77,0.28);border-radius:10px;font-size:12px;line-height:1.55;color:var(--ink)}
.panel-roster-valuesbar strong{color:var(--brand-deep)}
.panel-persona-role{font-family:'Fraunces',Georgia,serif;font-size:12.5px;line-height:1.4;color:var(--ink);font-style:italic;padding:8px 10px;background:var(--butter-light);border-radius:8px}
.panel-persona-row{display:flex;flex-direction:column;gap:4px;font-size:11.5px;line-height:1.45;color:var(--ink-soft)}
.panel-persona-row-tag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;width:fit-content;padding:2px 6px;border-radius:4px}
.panel-persona-row-tag-up{background:rgba(111,175,77,0.18);color:#3B6B2D}
.panel-persona-row-tag-down{background:rgba(232,134,66,0.18);color:#9E3F31}
.panel-persona-row-body{color:var(--ink)}
.panel-roster-foot{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--brand-light);font-family:'Fraunces',Georgia,serif;font-size:12.5px;line-height:1.55;color:var(--ink-soft);font-style:italic}
.prf-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-primary);flex-shrink:0;margin-top:6px}

.pillar-section{margin-bottom:28px}
.pillar-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.pillar-swatch{width:14px;height:14px;border-radius:3px}
.pillar-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:19px;letter-spacing:0.01em;color:var(--ink)}
.pillar-meta{margin-left:auto;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;font-weight:600}

/* Brief card */
.brief-card{background:var(--paper);border:1.5px solid var(--green);border-radius:14px;padding:18px;cursor:pointer;transition:transform 0.12s,box-shadow 0.12s;position:relative;box-shadow:0 2px 0 var(--green)}
.brief-card:hover{box-shadow:0 4px 0 var(--green),0 6px 18px rgba(42,31,18,0.1);transform:translateY(-1px)}
.brief-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.brief-priority{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;font-weight:800;padding:4px 10px;border-radius:99px}
.priority-big{background:#FFE7AB;color:#8A5D0E}
.priority-high{background:#FBDAD2;color:#A85F4F}
.priority-standard{background:#F2EBD3;color:var(--ink-soft)}
.brief-platform{font-size:10.5px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:0.08em}
.brief-sku{font-size:10.5px;font-weight:700;background:var(--green-light);color:var(--green-deep);padding:3px 9px;border-radius:99px;border:1px solid rgba(111,175,77,0.35)}
.brief-concept{font-family:'Fraunces';font-size:14.5px;line-height:1.35;font-weight:500;letter-spacing:-0.005em;color:var(--ink);margin:7px 0 12px}
.brief-chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:11px;border-top:1px solid var(--border)}
.brief-chip{display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.12em;font-weight:800;text-transform:uppercase;padding:4px 9px;border-radius:99px;line-height:1}
.brief-chip-dna{background:#F0EAD8;color:#5A4A2F;border:1px solid #DCD0A8}
.brief-chip-sku{border:1px solid transparent}
.brief-chip-sku-rrp-dip,.brief-chip-sku-lentil-dip{background:#F2D5C2;color:#9E3F31;border-color:#E0B8A0}
.brief-chip-sku-lemon-aioli{background:#F4E4A8;color:#8B6F1F;border-color:#E0CC78}
.brief-chip-sku-mango-chutney{background:#F3D1A8;color:#8B5A2B;border-color:#E0B888}
.brief-chip-sku-cilantro-chutney{background:#C8E6AB;color:#2E5B22;border-color:#A9D386}
.brief-chip-sku-chili-aioli{background:#F4C0B5;color:#7E2E20;border-color:#E09E8E}
.brief-chip-sku-brand{background:#C8E6AB;color:#2E5B22;border-color:#A9D386}
.brief-chip-sku-multi-sku{background:#F0E5C8;color:#5A4A2F;border-color:#DCC998}
.brief-id{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--green-deep)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(42,31,18,0.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:40px 16px;z-index:100}
.modal{background:var(--cream);border-radius:16px;max-width:880px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--border);box-shadow:var(--shadow-lg)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 30px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--cream);z-index:2}
.modal-head h2{font-family:'Bagel Fat One',serif;font-weight:400;font-size:30px;letter-spacing:0.005em;line-height:1.1;max-width:80%;color:var(--ink)}
.modal-close{font-size:24px;color:var(--ink-soft);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.modal-close:hover{background:var(--paper);color:var(--ink)}
.modal-body{padding:24px 30px 30px}
.modal-section{margin-bottom:24px}
.modal-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.16em;color:var(--ink-soft);font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.modal-section-label::before{content:"";display:block;width:14px;height:1.5px;background:var(--ink-soft)}
.modal-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.modal-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;line-height:1.5}
.modal-row:last-child{border-bottom:0}
.modal-row-label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);font-weight:600;margin-bottom:3px}

.caption-box{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;line-height:1.55;white-space:pre-line}
.caption-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.caption-label-text{font-family:'Fraunces';font-weight:700;font-size:14px;letter-spacing:-0.01em}
.caption-label-sub{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink-soft);font-weight:600}

.scene-row{display:grid;grid-template-columns:80px 60px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
.scene-row:last-child{border-bottom:0}
.scene-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em}
.scene-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--turmeric);font-weight:600}

.intel-row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:flex-start}
.intel-row:last-child{border-bottom:0}

   Calibrated honestly per brief — voice + panel + pulse averaged,
   plus recency bonus. Bands: HIGH >=85 · MEDIUM 70-84 · WATCH <70.
   ============================================================ */

  "MULT0622-GLOBALGRILL-P03":  { voice:82, panel:77, pulse:78, recency:10 },  // Global-flavor grill — expansion bet, primes July-4 cookout run
  "MULT0622-PROTEINDIP-P04":   { voice:85, panel:82, pulse:87, recency:11 },  // Protein/fiber dip — fibermaxxing at cultural peak, GLP-1 tailwind
  "MULT0622-AIOLI-P05":        { voice:80, panel:74, pulse:71, recency:8  },  // Aioli with a story — counters a design-led entry, everyday-utility evergreen
  "MOM0622-ONIONDAY-T01":      { voice:89, panel:78, pulse:81, recency:12 },  // National Onion Day — onion is the foundation of Afghan cooking, verified peg
  "MOM0622-AFGHANLANE-T02":    { voice:91, panel:80, pulse:82, recency:9  },  // Afghan-food lane — heritage specificity peak, lived not researched
  "SQUAD0622-WORLDCUP-UGC-S01":{ voice:83, panel:79, pulse:88, recency:13 },  // Tournament-long UGC into the knockouts — owned content into paid
  "SQUAD0622-SNACKPLATE-S02":  { voice:86, panel:78, pulse:82, recency:7  },  // Sisters' real weeknight snack plate — sister-fronted (best-performing lane) + most dip-native trend
  "SQUAD0622-COSTCO-S03":      { voice:83, panel:80, pulse:85, recency:12 }   // Costco-find UGC — ~week 7, buyer review at week 8 (urgency up)
};
function getConviction(briefId) {
  const c = CONVICTION_INPUTS[briefId];
  if (!c) return null;
  const base = Math.round((c.voice + c.panel + c.pulse) / 3);
  const score = base + c.recency;
  const band = score >= 85 ? "HIGH" : score >= 70 ? "MEDIUM" : "WATCH";
  return { ...c, base, score, band, rideNow: c.recency >= 12 };
}

function ConvictionChip({ conv }) {
  const bandClass = "conv-band-" + conv.band.toLowerCase();
  return (
    <span className={"brief-conviction " + bandClass}>
      <span className="brief-conviction-label">{conv.band}</span>
      <span className="brief-conviction-num">{conv.score}</span>
      <div className="brief-conviction-tt">
        <div className="bct-head">
          <span className="bct-head-band">{conv.band} CONVICTION</span>
          <span className="bct-head-num">{conv.score}</span>
        </div>
        <div className="bct-rows">
          <div className="bct-row"><span className="bct-row-label">Voice Compass</span><div className="bct-row-bar"><div className="bct-row-fill" style={{width:conv.voice+"%"}}></div></div><span className="bct-row-num">{conv.voice}</span></div>
          <div className="bct-row"><span className="bct-row-label">Synthetic Panel</span><div className="bct-row-bar"><div className="bct-row-fill" style={{width:conv.panel+"%"}}></div></div><span className="bct-row-num">{conv.panel}</span></div>
          <div className="bct-row"><span className="bct-row-label">Pulse fit</span><div className="bct-row-bar"><div className="bct-row-fill" style={{width:conv.pulse+"%"}}></div></div><span className="bct-row-num">{conv.pulse}</span></div>
        </div>
        <div className="bct-math">
          <span>({conv.voice} + {conv.panel} + {conv.pulse}) ÷ 3 = <strong>{conv.base}</strong></span>
          <span>+ Recency bonus: <strong>+{conv.recency}</strong></span>
          <span className="bct-math-total">= <strong>{conv.score}</strong></span>
        </div>
        <div className="bct-foot">
          {conv.band === "HIGH" ? "Ship this first." : conv.band === "MEDIUM" ? "Solid — slot in normally." : "Watch — needs sharpening or skip."}
        </div>
      </div>
    </span>
  );
}

/* ============================================================
   AUTH GATE — soft password screen, sessionStorage-backed
   ============================================================ */
function AuthGate({ onUnlock }) {
  const [pw, setPw] = React.useState("");
  const [err, setErr] = React.useState(false);
  const onSubmit = (e) => {
    e.preventDefault();
    if (pw.trim().toLowerCase() === "maazahmagic") {
      setErr(false);
      onUnlock();
    } else {
      setErr(true);
    }
  };
  return (
    <div className="auth-gate">
      <div className="auth-card">
        <MaazahArch className="auth-logo" />
        <form onSubmit={onSubmit}>
          <input
            className="auth-input"
            type="password"
            placeholder="password"
            value={pw}
            onChange={(e) => { setPw(e.target.value); if (err) setErr(false); }}
            autoFocus
          />
          {err && <div className="auth-error">⚠ password didn't match</div>}
          <button className="auth-btn" type="submit">↗ Unlock</button>
        </form>
      </div>
    </div>
  );
}

    try { return sessionStorage.getItem("mz-auth") === "1"; } catch { return false; }
  });

  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("mz-theme") || "light"; } catch { return "light"; }
  });
  const [fontSize, setFontSize] = useState(() => {
    try { return localStorage.getItem("mz-fs") || "md"; } catch { return "md"; }
  });
  const [sbWidth, setSbWidth] = useState(() => {
    try { return parseInt(localStorage.getItem("mz-sb-w")) || 200; } catch { return 200; }
  });
  const [resizing, setResizing] = useState(false);

  // Apply theme + fs to body
  React.useEffect(() => {
    document.body.className = `theme-${theme} fs-${fontSize}`;
    try { localStorage.setItem("mz-theme", theme); localStorage.setItem("mz-fs", fontSize); } catch {}
  }, [theme, fontSize]);

  // Persist sidebar width
  React.useEffect(() => {
    try { localStorage.setItem("mz-sb-w", String(sbWidth)); } catch {}
  }, [sbWidth]);

  // Drag-resize handlers
  React.useEffect(() => {
    if (!resizing) return;
    const onMove = (e) => {
      const w = Math.max(160, Math.min(360, e.clientX));
      setSbWidth(w);
    };
    const onUp = () => setResizing(false);
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
    return () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);

function csvCell(v) {
  const s = (v == null ? "" : String(v)).replace(/\r?\n/g, " ").trim();
  return /[",]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function buildFeedbackCSV() {
  const headers = [
    "Brief ID", "Publish Window", "Pillar", "Platform", "Primary SKU", "DNA Format",
    "Conviction", "Band", "Concept", "Recommended Hook", "IG Caption", "TikTok Caption",
    "Would you activate? (yes / no / needs work)", "Sounds like us? (1-5)",
    "Needs more humor? (y/n)", "Notes / edits"
  ];
  const rows = BRIEFS.map(b => {
    const conv = getConviction(b.id);
    const recHook = (b.hooks?.find(h => h.tag)?.text) || b.hooks?.[0]?.text || "";
    return [
      b.id, b.publishWindow, b.pillarLabel, b.platform, b.sku, b.dnaPattern,
      conv?.score ?? "", conv?.band ?? "", b.concept, recHook,
      b.captions?.ig || "", b.captions?.tiktok || "",
      "", "", "", ""
    ].map(csvCell).join(",");
  });
  return [headers.map(csvCell).join(","), ...rows].join("\r\n");
}

function downloadFeedbackCSV() {
  const csv = buildFeedbackCSV();
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const slug = WEEK_LABEL.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  a.href = url;
  a.download = `maazah-briefs-feedback_${slug}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function MaazahPanel({ brief }) {
  const [loading, setLoading] = React.useState(false);
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [requested, setRequested] = React.useState(false);

  React.useEffect(() => {
    setData(null);
    setError(null);
    setRequested(false);
  }, [brief.id]);

  function runPanel() {
    setRequested(true);
    setLoading(true);
    setData(null);
    setError(null);
    fetch('/api/panel', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ brief })
    })
      .then(r => r.json())
      .then(d => {
        if (d.reactions) setData(d);
        else setError(d.detail || d.error || 'panel failed');
        setLoading(false);
      })
      .catch(e => {
        setError(String(e));
        setLoading(false);
      });
  }

  const scoreColor = (s) => s >= 8 ? 'high' : s >= 5 ? 'mid' : 'low';
  const avg = data ? Math.round((data.reactions.reduce((a, r) => a + r.score, 0) / data.reactions.length) * 10) / 10 : null;

  return (
    <div className="mzp-section">
      <div className="mzp-head">
        <div>
          <div className="mzp-eyebrow">// THE PANEL READS THIS</div>
          <div className="mzp-title">5 synthetic customers · brief pre-test</div>
        </div>
        {avg != null ? (
          <div className={"mzp-avg mzp-avg-" + scoreColor(avg)}>
            <span>{avg}</span>
            <span>/10 avg</span>
          </div>
        ) : !requested ? (
          <button className="mzp-run-btn" onClick={runPanel} disabled={loading}>
            {loading ? "Running…" : "▷ Run pre-test"}
          </button>
        ) : loading ? (
          <span className="mzp-running-tag">running…</span>
        ) : null}
      </div>

      {data?.headline_insight && (
        <div className="mzp-headline">{data.headline_insight}</div>
      )}

      {!requested && !error && (
        <div className="mzp-prerun">
          <span className="mzp-prerun-icon">👥</span>
          <div>
            <div className="mzp-prerun-title">Pressure-test this brief against 5 simulated Maazah customers</div>
            <div className="mzp-prerun-sub">Layla (Afghan-American heritage · Twin Cities) · Brenna (Costco-mom · Naperville IL) · Marcus (category-curious foodie · Brooklyn) · Priya (working mom of 2 · Eden Prairie MN) · Maya (mainstream/Target shopper · Columbus OH — the expansion audience). Each scores it 1-10 with a reaction and an edit suggestion. ~3-5 seconds.</div>
          </div>
        </div>
      )}

      {error && <div className="mzp-error">⚠ {error}</div>}

      {(requested || data) && (
        <div className="mzp-grid">
          {MAAZAH_PANEL.map(p => {
            const reaction = data?.reactions?.find(r => r.persona === p.name);
            return (
              <div key={p.id} className="mzp-card">
                <div className="mzp-card-head">
                  <div className="mzp-card-emoji">{p.emoji}</div>
                  <div className="mzp-card-id">
                    <div className="mzp-card-name">{p.name} <span className="mzp-card-age">· {p.age}</span></div>
                    <div className="mzp-card-role">{p.label.toLowerCase().replace(/-/g, " ")} · {p.city}</div>
                  </div>
                  {reaction ? (
                    <div className={"mzp-score mzp-score-" + scoreColor(reaction.score)}>
                      <span className="mzp-score-num">{reaction.score}</span>
                      <span className="mzp-score-denom">/10</span>
                    </div>
                  ) : loading ? (
                    <div className="mzp-score mzp-score-loading"><span>·</span><span>·</span><span>·</span></div>
                  ) : null}
                </div>
                {reaction ? (
                  <>
                    <div className="mzp-card-quote">"{reaction.reaction}"</div>
                    {reaction.suggested_edit && reaction.suggested_edit !== "null" && reaction.suggested_edit !== null && (
                      <div className="mzp-card-edit">
                        <span className="mzp-card-edit-tag">+ edit</span>
                        <span className="mzp-card-edit-text">{reaction.suggested_edit}</span>
                      </div>
                    )}
                  </>
                ) : loading ? (
                  <div className="mzp-card-pulse"></div>
                ) : null}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function DiagnosticInboxModal({ onClose }) {

  const [freeFormLocked, setFreeFormLocked] = useState(false);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const selectOption = (qid, opt) => {
    setDrafts(d => ({ ...d, [qid]: { value: opt.value, label: opt.label, note: d[qid]?.note || "" } }));
  };
  const setDraftNote = (qid, note) => {
    setDrafts(d => ({ ...d, [qid]: { ...d[qid], note } }));
  };
  const lockAnswer = (qid) => {
    const draft = drafts[qid];
    if (!draft) return;
    setAnswers(a => ({ ...a, [qid]: { ...draft, locked: true } }));
  };
  const lockAnswerNoNote = (qid) => {
    const draft = drafts[qid];
    if (!draft) return;
    setAnswers(a => ({ ...a, [qid]: { ...draft, note: "", locked: true } }));
  };
  const changeAnswer = (qid) => {
    setAnswers(a => { const c = {...a}; delete c[qid]; return c; });
    setDrafts(d => { const c = {...d}; delete c[qid]; return c; });
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal diag-modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Diagnostic Inbox</h2>
          <button className="modal-close" onClick={onClose}>×</button>

              const draft = drafts[q.id];
              return (
                <div key={q.id} className={`diag-q ${q.railClass}`}>
                  <div className="diag-q-head">
                    <span className="diag-q-glyph">{q.glyph}</span>
                    <div className="diag-q-body">
                      <div className="diag-q-eye">// {q.eye}</div>
                      <div className="diag-q-text">{q.text}</div>

                  </div>
                  {!locked && (
                    <>
                      <div className="diag-q-opts">
                        {q.opts.map(opt => (
                          <button key={opt.value} className={`diag-q-opt ${draft?.value === opt.value ? "selected" : ""}`} onClick={() => selectOption(q.id, opt)}>
                            {opt.label}
                          </button>
                        ))}
                      </div>
                      {draft && q.needsDetail && draft.value !== "none" && (
                        <div className="diag-q-detail">
                          <textarea
                            value={draft.note || ""}
                            onChange={(e) => setDraftNote(q.id, e.target.value)}
                            placeholder={q.detailPlaceholder}

                          <div className="diag-q-actions">
                            <button className="diag-q-lock" onClick={() => lockAnswer(q.id)}>Lock it in →</button>
                            <button className="diag-q-skip" onClick={() => lockAnswerNoNote(q.id)}>Skip note</button>
                          </div>

                        <div className="diag-q-detail">
                          <div className="diag-q-actions">
                            <button className="diag-q-lock" onClick={() => lockAnswer(q.id)}>Lock it in →</button>

                      )}
                    </>
                  )}
                  {locked && (
                    <div className="diag-q-locked">
                      <span className="diag-q-locked-pill">✓ LOCKED IN</span>

/* ============================================================
   STUDIO MODAL — The Strategist chat
   Backed by Gemini 2.5 Flash via /api/studio (thinkingBudget:0).
   Voice mic uses Web Speech API · smart seed via initialSeed prop.
   ============================================================ */
const STUDIO_STARTERS = [
  { glyph: "✨", text: "What's the sharpest hook for this week's Costco-cart Reel?" },
  { glyph: "🌶️", text: "How do we frame Roasted Red Pepper without sounding wellness-coded?" },
  { glyph: "💚", text: "Give me 3 caption variants for Mom's Bolani — Direct, Warm, Punchy." },
  { glyph: "🤝", text: "Which collab brand should we DM this week to extend the snackle-box format?" }
];

function StudioModal({ onClose, initialSeed }) {
  const [mode, setMode] = useState("chat");
  const [text, setText] = useState(initialSeed || "");
  const [messages, setMessages] = useState([]);
  const [listening, setListening] = useState(false);
  const recognitionRef = React.useRef(null);
  const seedFiredRef = React.useRef(false);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  // Voice mic — uses Web Speech API (Chrome/Edge/Safari). Live-transcribes into textarea.
  const toggleVoice = () => {
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Rec) {
      alert("Voice input requires Chrome, Edge, or Safari. Your browser doesn't support it.");
      return;
    }
    if (listening && recognitionRef.current) {
      recognitionRef.current.stop();
      setListening(false);
      return;
    }
    const rec = new Rec();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = "en-US";
    let buffer = "";
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) buffer += e.results[i][0].transcript + " ";
        else interim += e.results[i][0].transcript;
      }
      setText((buffer + interim).trim());
    };
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recognitionRef.current = rec;
    rec.start();
    setListening(true);
  };

  const [sending, setSending] = React.useState(false);

  const handleSend = async (override) => {
    const content = (override ?? text).trim();
    if (!content || sending) return;
    const newUserMsg = { role: "user", content };
    setMessages(m => [...m, newUserMsg]);
    setText("");
    setSending(true);

    // Build full history for API (only last 8 turns to keep payload sane)
    const fullHistory = [...messages, newUserMsg]
      .slice(-8)
      .map(m => ({ role: m.role, content: m.content || m.text }));

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 55000);

    try {
      const res = await fetch("/api/studio", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: fullHistory }),
        signal: controller.signal
      });
      clearTimeout(timer);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const errText = data?.error === "missing_env_var"
          ? "📡 *Studio API key not yet set on this Vercel project.*\n\nDrop **GEMINI_API_KEY** in maazah.vercel.app env vars and redeploy — Studio responds live in your voice with full engine context loaded (~2-5s via Gemini 2.5 Flash)."
          : `Studio API error (${res.status}): ${data?.detail || data?.error || "unknown"}. Try again or refresh.`;
        setMessages(m => [...m, { role: "assistant", content: errText }]);
      } else {
        setMessages(m => [...m, { role: "assistant", content: data?.message?.content || "(empty response)" }]);
      }
    } catch (e) {
      clearTimeout(timer);
      const errText = e.name === "AbortError"
        ? "Studio request timed out at 55s. The model may be cold-starting — try again."
        : `Studio request failed: ${e.message || "network error"}. Check the connection and try again.`;
      setMessages(m => [...m, { role: "assistant", content: errText }]);
    } finally {
      setSending(false);
    }
  };

  // Smart-seed auto-fire — only once per modal open
  useEffect(() => {
    if (initialSeed && !seedFiredRef.current) {
      seedFiredRef.current = true;
      // pre-fill but DON'T auto-send — let user review the seed first
      setText(initialSeed);
    }
  }, [initialSeed]);

  return (
    <div className="studio-bg" onClick={onClose}>
      <div className="studio-card" onClick={(e) => e.stopPropagation()}>
        <div className="studio-head">
          <span className="studio-head-glyph">🧠</span>
          <div className="studio-head-titles">
            <div className="studio-head-title">The Strategist</div>
            <div className="studio-head-sub">{mode === "chat" ? "Live · full Maazah engine context loaded" : "Voice Compass · score caption fit"}</div>
          </div>
          <div className="studio-mode-toggle">
            <button className={`studio-mode-btn ${mode==="chat"?"active":""}`} onClick={() => setMode("chat")}>Chat</button>
            <button className={`studio-mode-btn ${mode==="voice"?"active":""}`} onClick={() => setMode("voice")}>Voice Compass</button>
          </div>
          <button className="studio-close" onClick={onClose} aria-label="close">×</button>
        </div>

        <div className="studio-body">
          {mode === "chat" && messages.length === 0 && (
            <>
              <div className="studio-welcome-eye">// ASK ME ANYTHING ABOUT MAAZAH</div>
              <div className="studio-welcome-title">What do you want to sharpen?</div>
              <div className="studio-welcome-sub">Drop a signal, a caption, a hook — or ask anything. I have your voice compass, every brief, every signal lane, every anti-pattern loaded. Try a starter below or just type.</div>
              <div className="studio-starters">
                {STUDIO_STARTERS.map((s, i) => (
                  <button key={i} className="studio-starter" onClick={() => setText(s.text)}>
                    <span className="studio-starter-glyph">{s.glyph}</span>
                    <div className="studio-starter-body">
                      <div className="studio-starter-text">{s.text}</div>
                    </div>
                    <span className="studio-starter-arrow">→</span>
                  </button>
                ))}
              </div>
            </>
          )}
          {mode === "chat" && messages.length > 0 && (
            <div className="studio-messages">
              {messages.map((m, i) => (
                <div key={i} className={"studio-msg studio-msg-" + m.role}>
                  <div className="studio-msg-bubble">{m.content || m.text}</div>
                </div>
              ))}
              {sending && (
                <div className="studio-msg studio-msg-assistant">
                  <div className="studio-msg-bubble" style={{fontStyle:"italic",opacity:0.7,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>
                    The Strategist is thinking...
                  </div>
                </div>
              )}
            </div>
          )}
          {mode === "voice" && (
            <>
              <div className="studio-welcome-eye">// VOICE COMPASS</div>
              <div className="studio-welcome-title">Score a caption against Maazah's voice.</div>
              <div className="studio-welcome-sub">Paste a caption below. The engine scores it against your 8 tonal territories + anti-patterns + platform fit. Returns a score, verdict, and suggested rewrites.</div>
              <div className="studio-shell-notice">📡 Voice Compass scores caption fit against Maazah's voice fingerprint — needs ANTHROPIC_API_KEY env var to activate. Until then: try the chat mode and ask "score this caption for me" — Studio Chat (Gemini) is live and can do a strong first-pass.</div>
            </>
          )}
        </div>

        <div className="studio-input-section">
          <div className="studio-hint">
            <span className="studio-hint-dot"></span>
            <span>{listening ? "Listening — tap mic again to stop" : "Tap mic for voice · ⌘+Enter to send"}</span>
          </div>
          <div className="studio-input-row">
            <textarea
              className="studio-textarea"
              value={text}
              onChange={(e) => setText(e.target.value)}
              onKeyDown={(e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); handleSend(); } }}
              placeholder={mode === "chat" ? "Ask the strategist anything..." : "Paste a caption to score..."}
              rows={2}
            />
            <button className={`studio-mic ${listening?"listening":""}`} onClick={toggleVoice} title={listening ? "Stop listening" : "Voice input"}>🎙️</button>
            <button className="studio-send" onClick={() => handleSend()} disabled={!text.trim() || sending}>{sending ? "..." : "Send"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ERROR BOUNDARY — catches render-time exceptions in any subtree
   and shows a recoverable fallback in Maazah's voice.
   ============================================================ */
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { error:null, info:null }; }
  static getDerivedStateFromError(error){ return { error }; }
  componentDidCatch(error, info){
    console.error("ErrorBoundary caught:", error, info);
    this.setState({ info });
  }
  reset(){ this.setState({ error:null, info:null }); }
  render(){
    if (this.state.error) {
      return (
        <div className="eb-wrap">
          <div className="eb-eye">// ENGINE HICCUP</div>
          <h2 className="eb-title">something glitched. the engine's still running.</h2>
          <p className="eb-body">a component threw during render. click reload to recover — your week's intel and briefs are still cached server-side.</p>
          <details className="eb-details">
            <summary>technical details</summary>
            <pre>{String(this.state.error?.stack || this.state.error)}</pre>
          </details>
          <button onClick={()=>window.location.reload()} className="eb-btn eb-btn-primary">↻ RELOAD</button>
          <button onClick={()=>this.reset()} className="eb-btn eb-btn-secondary">try again</button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============================================================
   MOUNT
   ============================================================ */
const ROOT = ReactDOM.createRoot(document.getElementById("root"));
ROOT.render(<ErrorBoundary><MaazahApp /></ErrorBoundary>);
</script>
</body>
</html>
