<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAAZAH — Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Bagel+Fat+One&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  /* ============================================================
     Maazah brand palette — sampled from @maazahmagic + packaging.
     Token structure mirrors the OBSOLETE engine pattern
     (brand-primary / brand-accent / butter / ink / pillar-* / sku-*)
     so structural components port cleanly across engines.
     ============================================================ */

  /* Brand — primary green (Maazah kelly) */
  --brand-primary:#6FAF4D;        /* dominant — sidebar, header rules, primary CTAs */
  --brand-deep:#3F7B28;           /* deeper green for hover + ink-on-green */
  --brand-light:#C6E29F;          /* soft lime — accent surface */
  --brand-light-soft:#E8F2D5;     /* lightest green — subtle bg */

  /* Accent — Maazah's "magenta-equivalent" CTA color (chili coral) */
  --brand-accent:#D67A5A;         /* drop buttons, "ride this" callouts, hot chips */
  --brand-accent-deep:#B5563B;    /* deeper coral hover */

  /* Ink + paper (cream-on-warm-dark) */
  --ink:#2A1F12;                  /* warm dark ink — body text + headlines */
  --ink-soft:#5C4E3E;             /* softened ink */
  --butter:#F7F3E5;               /* cream paper — body bg */
  --butter-deep:#EDE5C8;          /* elevated cream surface */
  --butter-light:#FDFAF0;         /* lightest cream — card bg */
  --border:#D8CFB0;               /* warm cream-edge border */

  /* Pillar palette — one per Maazah content pillar */
  --pillar-magic:#6FAF4D;         /* MAGIC IS REAL — kelly green */
  --pillar-multiply:#D67A5A;      /* PUT IT ON EVERYTHING — chili coral */
  --pillar-mom:#E08642;           /* MOM'S TABLE — turmeric orange */
  --pillar-squad:#E8C547;         /* SAUCY SQUAD — lemon yellow */

  /* SKU chip palette */
  --sku-basil:#87B26F;            /* Basil Jalapeño dip */
  --sku-lemon:#E8C547;            /* Classic Lemon dip + Lemon Aioli */
  --sku-coral:#D67A5A;            /* Roasted Red Pepper dip */
  --sku-turmeric:#E08642;         /* Turmeric Ginger dip */
  --sku-cilantro:#7FB069;         /* Cilantro Chutney sauce */
  --sku-mango:#E8A66F;            /* Mango Chutney sauce */
  --sku-chili:#C84A38;            /* Chili Aioli sauce (NEW) */

  /* Shadows */
  --shadow:0 2px 10px rgba(42,31,18,0.08);
  --shadow-lg:0 10px 40px rgba(42,31,18,0.14);

  /* ============================================================
     Legacy V2 aliases — keep so existing CSS keeps working
     while new ported components reference abstract token names.
     ============================================================ */
  --green:#6FAF4D;                /* alias → --brand-primary */
  --green-deep:#3F7B28;           /* alias → --brand-deep */
  --green-soft:#C6E29F;           /* alias → --brand-light */
  --green-light:#E8F2D5;          /* alias → --brand-light-soft */
  --cream:#F7F3E5;                /* alias → --butter */
  --cream-deep:#EDE5C8;           /* alias → --butter-deep */
  --paper:#FDFAF0;                /* alias → --butter-light */
  --basil:#87B26F;
  --lemon:#E8C547;
  --coral:#D67A5A;
  --turmeric:#E08642;
  --cilantro:#7FB069;
  --mango:#E8A66F;
  --chili:#C84A38;
}
.display{font-family:'Bagel Fat One','Cooper Std',Georgia,serif;font-weight:400;letter-spacing:0.005em}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.mono{font-family:'JetBrains Mono','Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

/* Sidebar */
.sb{background:var(--green);color:#fff;border-right:1px solid var(--green-deep);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,0.22);margin-bottom:14px}
.sb-logo{width:42px;height:48px;flex-shrink:0;color:var(--ink)}
.sb-brand-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:26px;letter-spacing:0.005em;color:var(--ink);line-height:0.95}
.sb-brand-sub{font-size:9.5px;text-transform:uppercase;letter-spacing:0.16em;color:rgba(255,255,255,0.85);margin-top:4px;font-weight:600}
.sb-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.16em;color:rgba(255,255,255,0.75);padding:14px 10px 6px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-weight:500;font-size:13.5px;color:rgba(255,255,255,0.92);position:relative;text-align:left;width:100%}
.sb-item:hover{background:rgba(255,255,255,0.14)}
.sb-item.active{background:var(--ink);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(42,31,18,0.35)}
.sb-item-icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
.sb-item-soon{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;background:rgba(255,255,255,0.20);color:rgba(255,255,255,0.92);padding:2px 6px;border-radius:3px;margin-left:auto;font-weight:600}
.sb-item.active .sb-item-soon{background:rgba(255,255,255,0.28);color:#fff}
.sb-footer{margin-top:8px;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,0.18);font-size:11px;color:rgba(255,255,255,0.85);line-height:1.55}
.sb-footer strong{color:#fff;font-weight:700;display:block;margin-bottom:2px}
.sb-howit{margin-top:10px;width:100%;text-align:left;font-size:11.5px;color:#fff;background:rgba(255,255,255,0.16);padding:9px 12px;border-radius:8px;font-weight:500;letter-spacing:0.01em}
.sb-howit:hover{background:rgba(255,255,255,0.24)}

/* Diagnostic Inbox button — coral gradient pill, bottom of sidebar (Phase 1) */
.sb-diag-btn{margin-top:auto;margin-bottom:10px;display:flex;align-items:center;gap:10px;width:100%;background:linear-gradient(135deg,var(--brand-accent) 0%,var(--brand-accent-deep) 100%);color:#fff;border:1px solid rgba(255,255,255,0.18);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;box-shadow:0 4px 12px rgba(181,86,59,0.32);transition:transform 0.12s,box-shadow 0.12s;position:relative}
.sb-diag-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(181,86,59,0.42)}

/* Main footer — JetBrains Mono attribution line at bottom of every page (Phase 1 stub, Phase 10 polishes) */
.main-footer{margin-top:48px;padding:18px 0 6px;border-top:1px solid rgba(111,175,77,0.22);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--ink-soft);font-weight:600;text-transform:uppercase}
.main-footer strong{color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:0.12em}
.main-footer .footer-dot{width:5px;height:5px;border-radius:50%;background:var(--brand-primary);box-shadow:0 0 5px rgba(111,175,77,0.6)}

/* ============================================================
   Diagnostic Inbox (Phase 7) — operating tool, not pitch artifact
   ============================================================ */
.diag-modal{max-width:780px}
.diag-intro{font-family:'Fraunces',Georgia,serif;font-size:14px;line-height:1.55;color:var(--ink-soft);font-style:italic;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.diag-q-list{display:flex;flex-direction:column;gap:14px}
.diag-q{background:#fff;border:1.5px solid var(--brand-light);border-radius:12px;padding:0;overflow:hidden;position:relative}
.diag-q-onground{border-left:5px solid #6FAF4D}
.diag-q-orbit{border-left:5px solid #E8C547}
.diag-q-mood{border-left:5px solid #D67A5A}
.diag-q-free{border-left:5px solid #5E5A8A}
.diag-q-head{padding:14px 18px 10px;display:flex;align-items:flex-start;gap:12px}
.diag-q-glyph{font-size:24px;line-height:1;flex-shrink:0;margin-top:2px}
.diag-q-body{flex:1}
.diag-q-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:4px}
.diag-q-text{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:600;line-height:1.4;color:var(--ink);letter-spacing:-0.005em}
.diag-q-opts{padding:6px 18px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.diag-q-opts{grid-template-columns:1fr}}
.diag-q-opt{background:var(--butter-light);border:1.5px solid var(--border);color:var(--ink);font-size:12.5px;line-height:1.4;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;transition:all 0.12s;font-weight:500}
.diag-q-opt:hover{border-color:var(--brand-primary);transform:translateY(-1px)}
.diag-q-opt.selected{background:var(--brand-accent);color:#fff;border-color:var(--brand-accent-deep);font-weight:600}
.diag-q-detail{padding:0 18px 14px;animation:diag-fade 0.18s ease-out}
@keyframes diag-fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.diag-q-detail textarea{width:100%;min-height:60px;padding:10px 12px;border:1.5px solid var(--brand-light);border-radius:8px;background:var(--butter-light);font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;color:var(--ink);resize:vertical;outline:none;transition:border-color 0.15s}
.diag-q-detail textarea:focus{border-color:var(--brand-accent)}
.diag-q-actions{display:flex;gap:8px;margin-top:10px}
.diag-q-lock{background:var(--brand-accent);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:9px 16px;border-radius:99px;cursor:pointer;border:0;transition:background 0.15s,transform 0.1s}
.diag-q-lock:hover{background:var(--brand-accent-deep);transform:translateY(-1px)}
.diag-q-skip{background:transparent;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:9px 16px;border-radius:99px;cursor:pointer;border:1.5px solid var(--border)}
.diag-q-skip:hover{background:var(--butter-light)}
.diag-q-locked{padding:14px 18px;background:var(--brand-light-soft);border-top:1px dashed var(--brand-light)}
.diag-q-locked-pill{display:inline-flex;align-items:center;gap:6px;background:#DAEDC8;color:#3B6B2D;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;padding:5px 11px;border-radius:99px;margin-bottom:8px}
.diag-q-locked-value{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:4px}
.diag-q-locked-note{font-size:12.5px;line-height:1.5;color:var(--ink-soft);background:#fff;padding:9px 12px;border-radius:6px;border:1px solid var(--border);margin-bottom:8px;white-space:pre-line}
.diag-q-change{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;font-weight:700;color:var(--brand-deep);background:transparent;border:0;cursor:pointer;text-transform:uppercase}
.diag-q-change:hover{color:var(--brand-primary)}

/* ============================================================
   Studio Modal (Phase 6) — shell UI for The Strategist chat
   API wires Wednesday once GEMINI_API_KEY is added to maazah Vercel env.
   ============================================================ */
.studio-bg{position:fixed;inset:0;background:rgba(42,31,18,0.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:400}
.studio-card{background:var(--butter);border-radius:18px;width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,0.4),0 0 0 1.5px var(--brand-primary);overflow:hidden}
.studio-head{display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand-primary) 100%);color:#fff;border-bottom:2px solid var(--brand-deep)}
.studio-head-glyph{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid rgba(255,255,255,0.28)}
.studio-head-titles{flex:1;min-width:0}
.studio-head-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:20px;letter-spacing:0.005em;line-height:1.05}
.studio-head-sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;opacity:0.88;margin-top:3px;text-transform:uppercase}
.studio-mode-toggle{display:flex;background:rgba(255,255,255,0.14);border-radius:99px;padding:3px;gap:2px}
.studio-mode-btn{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;font-weight:700;text-transform:uppercase;padding:6px 12px;border-radius:99px;color:rgba(255,255,255,0.78);cursor:pointer;background:transparent;border:0}
.studio-mode-btn.active{background:var(--brand-accent);color:#fff;box-shadow:0 2px 6px rgba(214,122,90,0.4)}
.studio-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.16);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;line-height:1;flex-shrink:0}
.studio-close:hover{background:rgba(255,255,255,0.3)}

.studio-body{flex:1;overflow-y:auto;padding:20px 24px}
.studio-welcome-eye{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.studio-welcome-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:26px;letter-spacing:0.005em;line-height:1.1;color:var(--ink);margin-bottom:6px}
.studio-welcome-sub{font-family:'Fraunces',Georgia,serif;font-size:13.5px;line-height:1.55;color:var(--ink-soft);font-style:italic;margin-bottom:18px;max-width:580px}
.studio-starters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:680px){.studio-starters{grid-template-columns:1fr}}
.studio-starter{background:#fff;border:1.5px solid var(--brand-light);border-radius:12px;padding:13px 15px;cursor:pointer;text-align:left;display:flex;gap:11px;align-items:flex-start;transition:transform 0.12s,border-color 0.12s,box-shadow 0.12s}
.studio-starter:hover{transform:translateY(-1px);border-color:var(--brand-primary);box-shadow:0 4px 12px rgba(63,123,40,0.15)}
.studio-starter-glyph{font-size:20px;line-height:1;flex-shrink:0;margin-top:1px}
.studio-starter-body{flex:1;min-width:0}
.studio-starter-text{font-size:13px;line-height:1.4;color:var(--ink);font-weight:500}
.studio-starter-arrow{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--brand-primary);font-weight:700;flex-shrink:0}

.studio-messages{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.studio-msg{display:flex;gap:10px;align-items:flex-end}
.studio-msg-user{justify-content:flex-end}
.studio-msg-bubble{padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;max-width:78%;white-space:pre-wrap}
.studio-msg-user .studio-msg-bubble{background:var(--brand-accent);color:#fff;border-radius:14px 14px 4px 14px}
.studio-msg-assistant .studio-msg-bubble{background:#fff;color:var(--ink);border:1px solid var(--brand-light);border-radius:14px 14px 14px 4px}

.studio-input-section{padding:14px 20px 18px;border-top:1.5px solid var(--brand-light);background:var(--butter-light)}
.studio-hint{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--ink-soft);text-transform:uppercase;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.studio-hint-dot{width:6px;height:6px;border-radius:50%;background:var(--brand-accent);animation:hint-pulse 2.4s ease-in-out infinite}
@keyframes hint-pulse{0%,100%{opacity:0.4}50%{opacity:1}}
.studio-input-row{display:flex;gap:8px;align-items:flex-end}
.studio-textarea{flex:1;min-height:46px;max-height:150px;font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.5;padding:12px 14px;border:1.5px solid var(--brand-light);border-radius:12px;background:#fff;color:var(--ink);resize:vertical;outline:none;transition:border-color 0.15s}
.studio-textarea:focus{border-color:var(--brand-primary);box-shadow:0 0 0 3px rgba(111,175,77,0.15)}
.studio-mic{width:46px;height:46px;border-radius:50%;background:#fff;border:1.5px solid var(--brand-light);color:var(--brand-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s,transform 0.1s}
.studio-mic:hover{background:var(--brand-light-soft);transform:translateY(-1px)}
.studio-mic.listening{background:var(--brand-accent);color:#fff;border-color:var(--brand-accent-deep);animation:hint-pulse 1.2s ease-in-out infinite}
.studio-send{background:var(--ink);color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:13px 20px;border-radius:99px;cursor:pointer;border:0;flex-shrink:0;transition:background 0.15s,transform 0.1s}
.studio-send:hover:not(:disabled){background:var(--brand-deep);transform:translateY(-1px)}
.studio-send:disabled{opacity:0.5;cursor:not-allowed}
.studio-shell-notice{background:rgba(214,122,90,0.12);border:1px dashed var(--brand-accent);color:var(--brand-accent-deep);padding:8px 12px;border-radius:8px;font-size:11.5px;line-height:1.45;margin-top:10px;font-family:'JetBrains Mono',monospace}

/* WIP under-construction banner (Phase 1 stub for Calendar + Performance, Phase 9 polishes) */
.wip-banner{background:var(--butter-light);border:2px dashed var(--brand-accent);border-radius:12px;padding:18px 22px;margin-bottom:24px;display:flex;align-items:flex-start;gap:14px}
.wip-banner-icon{font-size:24px;line-height:1;flex-shrink:0;margin-top:2px}
.wip-banner-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;font-weight:700;color:var(--brand-accent-deep);text-transform:uppercase;margin-bottom:4px}
.wip-banner-body{font-size:13px;line-height:1.5;color:var(--ink-soft)}
.wip-banner-body strong{color:var(--ink);font-weight:700}

/* Main */
.main{padding:34px 44px 80px;max-width:1400px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:18px;border-bottom:2px solid var(--green);margin-bottom:28px}
.page-head h1{font-family:'Bagel Fat One',serif;font-weight:400;font-size:48px;letter-spacing:0.005em;line-height:0.95;color:var(--ink)}
.page-head .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:0.18em;color:var(--green-deep);margin-bottom:8px;font-weight:700}
.page-head .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.date-pill{background:var(--green);color:#fff;font-weight:700;padding:6px 13px;border-radius:99px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase}
.refresh-pill{font-size:11px;color:var(--ink);display:flex;align-items:center;gap:6px;font-weight:500}
.refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(111,175,77,0.7)}

/* Ticker */
.ticker{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;margin-bottom:24px;display:flex;align-items:center;gap:18px;overflow:hidden;font-size:12px}
.ticker-label{font-family:'Bagel Fat One',serif;color:var(--green-soft);font-size:14px;letter-spacing:0.01em;white-space:nowrap;flex-shrink:0}
.ticker-track{display:flex;gap:36px;flex:1;white-space:nowrap;animation:tickerScroll 38s linear infinite;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(255,255,255,0.92);letter-spacing:0.02em}
.ticker-track strong{color:var(--green-soft);margin-right:6px}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* Sub tabs */
.subtabs{display:flex;gap:4px;margin:0 0 24px;border-bottom:1px solid var(--border);padding-bottom:0}
.subtab{padding:10px 16px 13px;font-weight:600;font-size:13px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.subtab:hover{color:var(--ink)}
.subtab.active{color:var(--ink);border-bottom-color:var(--green)}
.subtab-count{background:rgba(111,175,77,0.16);color:var(--green-deep);padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;letter-spacing:0.02em}
.subtab.active .subtab-count{background:var(--green);color:#fff}

/* Editorial lede */
.lede{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:var(--paper);border:1.5px solid var(--green);border-radius:14px;padding:0;margin-bottom:24px;overflow:hidden;box-shadow:0 2px 0 var(--green)}
.lede-col{padding:18px 22px;border-right:1px solid var(--border)}
.lede-col:last-child{border-right:0}
.lede-label{font-size:10px;text-transform:uppercase;letter-spacing:0.16em;color:var(--green-deep);margin-bottom:6px;font-weight:700}
.lede-text{font-family:'Fraunces';font-size:15.5px;line-height:1.4;font-weight:500;color:var(--ink);letter-spacing:-0.005em}

/* Cards grid */
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.grid-3{grid-template-columns:1fr 1fr}}

/* Generic card */
.card{background:var(--paper);border:1.5px solid var(--green);border-radius:14px;padding:20px;position:relative;transition:transform 0.12s,box-shadow 0.12s;box-shadow:0 2px 0 var(--green)}
.card:hover{box-shadow:0 4px 0 var(--green),0 6px 18px rgba(42,31,18,0.1);transform:translateY(-1px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.card-type{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--green);color:#fff}
.card-velocity{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink);display:flex;align-items:center;gap:5px;font-weight:600}
.velocity-dot{width:6px;height:6px;border-radius:50%}
.velocity-high{background:#D34A4A}
.velocity-medium{background:#E0A53C}
.velocity-low{background:#7FB069}
.card-hook{font-family:'Fraunces';font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-0.015em;margin-bottom:10px;color:var(--ink)}
.card-detail{font-size:13px;line-height:1.55;color:var(--ink-soft);margin-bottom:12px}
.card-play{background:var(--green-light);border-left:3px solid var(--green);padding:11px 13px;border-radius:0 6px 6px 0;font-size:13px;line-height:1.5;margin-bottom:12px;color:var(--ink)}
.card-play-label{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;font-weight:700;color:var(--green-deep);display:block;margin-bottom:4px}
.card-meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.card-meta-chip{font-size:11px;background:var(--cream-deep);padding:4px 10px;border-radius:99px;color:var(--ink);font-weight:600;border:1px solid var(--border)}
.card-dna-chip{font-size:10.5px;background:var(--ink);color:#fff;padding:4px 10px;border-radius:99px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase}
.card-sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:10px;border-top:1px solid var(--border)}
.source-chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;background:var(--green-light);color:var(--green-deep);padding:3px 8px;border-radius:99px;letter-spacing:0;font-weight:600;border:1px solid rgba(111,175,77,0.4)}
.source-chip:hover{background:var(--green);color:#fff;border-color:var(--green)}
.card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.drop-btn{background:var(--green);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;padding:7px 13px;border-radius:99px;display:flex;align-items:center;gap:6px;transition:background 0.15s,transform 0.1s}
.drop-btn:hover{background:var(--green-deep);transform:translateY(-1px)}

/* ============================================================
   Conviction Chip + tooltip (Phase 4)
   ============================================================ */
.brief-conviction{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.1em;font-weight:800;text-transform:uppercase;cursor:help;position:relative;border:1.5px solid currentColor}
.conv-band-high{color:#3B6B2D}
.conv-band-medium{color:#8B6F1F}
.conv-band-watch{color:#9E3F31}
.brief-conviction-label{letter-spacing:0.12em}
.brief-conviction-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:13px;line-height:1;letter-spacing:0;padding:2px 6px 1px;background:currentColor;color:#fff !important;border-radius:99px;min-width:24px;text-align:center}
.brief-conviction-tt{position:absolute;top:calc(100% + 8px);left:0;z-index:60;width:320px;background:#fff;border:1.5px solid var(--brand-primary);border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px rgba(42,31,18,0.18);opacity:0;transform:translateY(-4px);transition:opacity 0.15s,transform 0.15s;pointer-events:none;text-transform:none;letter-spacing:0;font-weight:normal;font-family:'Inter',sans-serif}
.brief-conviction:hover .brief-conviction-tt{opacity:1;transform:translateY(0);pointer-events:auto}
.brief-conviction-tt::before{content:"";position:absolute;top:-7px;left:18px;width:12px;height:12px;background:#fff;border-left:1.5px solid var(--brand-primary);border-top:1.5px solid var(--brand-primary);transform:rotate(45deg)}
.bct-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:9px;border-bottom:1px dashed var(--brand-light);margin-bottom:9px}
.bct-head-band{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;font-weight:800;color:var(--ink);text-transform:uppercase}
.bct-head-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;color:var(--ink);line-height:1}
.bct-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.bct-row{display:flex;align-items:center;gap:8px;font-size:11px}
.bct-row-label{flex:0 0 120px;font-family:'Inter',sans-serif;color:var(--ink-soft);font-weight:600;font-size:10.5px}
.bct-row-bar{flex:1;height:5px;background:var(--brand-light-soft);border-radius:99px;overflow:hidden}
.bct-row-fill{height:100%;background:linear-gradient(90deg,var(--brand-primary) 0%,var(--brand-accent) 100%);border-radius:99px}
.bct-row-num{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;color:var(--ink);min-width:24px;text-align:right}
.bct-math{display:flex;flex-direction:column;gap:3px;padding:8px 10px;background:var(--butter-light);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink);margin-bottom:8px}
.bct-math strong{color:var(--brand-accent-deep);font-weight:800}
.bct-math-total{padding-top:3px;border-top:1px dashed rgba(111,175,77,0.32);margin-top:2px}
.bct-foot{font-family:'Fraunces',Georgia,serif;font-size:11.5px;line-height:1.45;color:var(--ink);font-style:italic;font-weight:500}

/* ============================================================
   Ride-now hero (Phase 4) — sits at top of Content Briefs page
   ============================================================ */
.ride-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand-primary) 55%,var(--brand-accent-deep) 130%);color:#fff;border-radius:14px;padding:20px 28px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(63,123,40,0.28)}
.ride-hero::before{content:"";position:absolute;top:-40px;right:-30px;width:240px;height:240px;background:radial-gradient(circle,rgba(214,122,90,0.42) 0%,transparent 65%);pointer-events:none}
.ride-hero-left{display:flex;align-items:center;gap:20px;position:relative;z-index:2}
.ride-hero-pill{display:flex;align-items:center;gap:10px;background:var(--brand-accent);padding:11px 20px;border-radius:99px;box-shadow:0 4px 14px rgba(214,122,90,0.5)}
.ride-hero-icon{font-size:22px;line-height:1}
.ride-hero-num{font-family:'Bagel Fat One',serif;font-weight:400;font-size:38px;color:#fff;letter-spacing:0.005em;line-height:1}
.ride-hero-body{display:flex;flex-direction:column;gap:4px}
.ride-hero-label{font-family:'Bagel Fat One',serif;font-weight:400;font-size:20px;letter-spacing:0.005em;line-height:1.1;color:#fff}
.ride-hero-sub{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.4;color:rgba(255,255,255,0.92);font-weight:500;font-style:italic;letter-spacing:-0.005em}
.ride-hero-right{position:relative;z-index:2;flex-shrink:0;text-align:right}
.ride-hero-mini{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;color:rgba(255,255,255,0.85);font-weight:600;text-transform:uppercase}
@media(max-width:740px){.ride-hero{flex-direction:column;align-items:flex-start;gap:14px}.ride-hero-right{align-self:flex-start;text-align:left}}

/* Brief card — pillar rail color via inline style on intel-card wrapper */

/* ============================================================
   Intel card upgrades (Phase 3) — 5px rail + 32px glyph + drop button
   ============================================================ */
.intel-card{border-left-width:5px}
.intel-glyph{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1;flex-shrink:0;border:1px solid currentColor}
.icard-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.icard-head-meta{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Memo trigger button — sits at top of Intel page, opens MondayMemoModal */
.memo-trigger{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;background:linear-gradient(135deg,var(--brand-primary) 0%,var(--brand-deep) 100%);color:#fff;border-radius:12px;padding:14px 18px;margin-bottom:18px;cursor:pointer;border:0;text-align:left;transition:transform 0.12s,box-shadow 0.15s;box-shadow:0 4px 14px rgba(63,123,40,0.32)}
.memo-trigger:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(63,123,40,0.42)}
.memo-trigger-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;font-weight:700;opacity:0.85;text-transform:uppercase}
.memo-trigger-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:17px;letter-spacing:0.005em;line-height:1.15;margin-top:3px}
.memo-trigger-sub{background:var(--brand-accent);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;padding:8px 13px;border-radius:99px;flex-shrink:0;box-shadow:0 2px 8px rgba(214,122,90,0.4)}

/* Competitor direction badge — chunky pill (replaces inline arrow text) */
.comp-dir-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;font-weight:800;text-transform:uppercase;flex-shrink:0;border:1.5px solid currentColor;background:transparent}
.comp-dir-badge-up{color:#A85959;background:rgba(168,89,89,0.08)}
.comp-dir-badge-down{color:#5D8054;background:rgba(93,128,84,0.08)}
.comp-dir-badge-flat{color:#7C7C7C;background:rgba(124,124,124,0.06)}
.comp-dir-badge-arrow{font-family:'Bagel Fat One',serif;font-size:13px;line-height:1}

/* ============================================================
   Counter-Strike Log (Phase 3 — new subtab)
   Native <details> accordion · collapsed shows 1-line · expanded shows full
   ============================================================ */
.cs-section{margin-top:8px}
.cs-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.cs-section-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.cs-section-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:26px;letter-spacing:0.005em;line-height:1;color:var(--ink)}
.cs-section-sub{font-family:'Fraunces',Georgia,serif;font-size:13px;line-height:1.5;color:var(--ink-soft);font-style:italic;max-width:520px;margin-top:6px}
.cs-section-count{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--ink);background:var(--brand-light-soft);padding:5px 11px;border-radius:99px;font-weight:700;text-transform:uppercase;border:1px solid rgba(111,175,77,0.32);white-space:nowrap}

.cs-log{display:flex;flex-direction:column;gap:12px}
.cs-entry{background:var(--butter-light);border:1.5px solid var(--brand-primary);border-radius:14px;box-shadow:0 2px 0 var(--brand-primary);overflow:hidden}
.cs-entry summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.cs-entry summary::-webkit-details-marker{display:none}
.cs-entry[open] .cs-entry-chev{transform:rotate(180deg)}
.cs-entry-chev{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--brand-primary);font-weight:700;transition:transform 0.2s;display:inline-block;margin-left:8px}
.cs-entry-trigger{min-width:0}
.cs-entry-stamp{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--brand-accent-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.cs-entry-comp{font-family:'Bagel Fat One',serif;font-weight:400;font-size:18px;letter-spacing:0.005em;color:var(--ink);line-height:1.1;margin-bottom:5px}
.cs-entry-detail-compact{font-size:12.5px;line-height:1.45;color:var(--ink-soft);max-width:640px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cs-entry-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.cs-entry-time{font-family:'Bagel Fat One',serif;font-size:26px;font-weight:400;color:var(--brand-accent);letter-spacing:0.005em;line-height:1}
.cs-entry-resp{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:0.04em;text-transform:uppercase}
.cs-entry-status{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:800;padding:4px 11px;border-radius:99px;margin-top:4px}
.cs-status-shipped{background:#DAEDC8;color:#3B6B2D}
.cs-status-ready{background:#FAEED1;color:#8B6F1F}
.cs-status-tracking{background:#E5E0F2;color:#4F4885}
.cs-entry-expanded{padding:14px 18px 18px;border-top:1px solid var(--brand-light);background:#fff}
.cs-entry-expanded-full{font-size:13.5px;line-height:1.55;color:var(--ink);margin-bottom:12px}
.cs-entry-source{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--brand-deep);font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
.cs-entry-drafts{margin-top:12px;padding-top:12px;border-top:1px dashed var(--brand-light);font-size:12px;color:var(--ink-soft);line-height:1.5}
.cs-entry-drafts strong{color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:10.5px;display:block;margin-bottom:4px;font-family:'JetBrains Mono',monospace}

/* Culture Momentum view (Phase 3 — top of Pulse subtab) */
.cm-wrap{margin-bottom:20px;background:var(--butter-light);border:1.5px solid var(--brand-light);border-radius:14px;padding:18px 22px 20px}
.cm-header{margin-bottom:16px}
.cm-eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.18em;color:var(--brand-deep);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.cm-title{font-family:'Bagel Fat One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;line-height:1.05;color:var(--ink);margin:0 0 5px}
.cm-sub{font-family:'Fraunces',Georgia,serif;font-size:12.5px;line-height:1.5;color:var(--ink-soft);font-style:italic;max-width:660px}
.cm-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:740px){.cm-cols{grid-template-columns:1fr}}
.cm-col{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.cm-col-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;font-weight:700;text-transform:uppercase;margin-bottom:10px;display:inline-block;padding:3px 8px;border-radius:99px}
.cm-col-popping .cm-col-eye{color:#3B6B2D;background:rgba(111,175,77,0.18);border:1px solid rgba(111,175,77,0.35)}
.cm-col-cooling .cm-col-eye{color:#8B6F1F;background:rgba(232,134,66,0.16);border:1px solid rgba(232,134,66,0.3)}
.cm-item{padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;line-height:1.45;color:var(--ink)}
.cm-item:last-child{border-bottom:0}
.cm-item-label{font-weight:700;color:var(--ink);margin-bottom:2px}
.cm-item-note{font-size:11.5px;color:var(--ink-soft);line-height:1.4}

/* Pillar pips */
.trend-pillars{display:flex;gap:4px;flex-wrap:wrap}
.pillar-pip{font-size:9.5px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;padding:2px 7px;border-radius:3px;color:#fff}
.pip-magic{background:var(--green)}
.pip-multiply{background:var(--coral)}
.pip-mom{background:var(--turmeric)}
.pip-squad{background:var(--lemon);color:var(--ink)}

/* Pulse type colors */
.type-meme{background:#F4DAE2;color:#A85575}
.type-recipe{background:#E6F0DC;color:#5D7E47}
.type-archetype{background:#FBE0CE;color:#A05E2D}
.type-news{background:#E8E6F0;color:#5E5A8A}
.type-cultural{background:#FDE8C4;color:#A07526}
.type-entertainment{background:#F5DCEF;color:#854577}

/* Competitor extras */
.comp-direction{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em}
.dir-up{color:#A85959}
.dir-down{color:#5D8054}
.dir-flat{color:var(--ink-soft)}

/* Ambassador */
.amb-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center}
.amb-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--lemon));display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:'Bagel Fat One',serif;font-weight:400;font-size:16px;flex-shrink:0;letter-spacing:0.01em}
.amb-handle{font-weight:700;font-size:14px}
.amb-handle-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.amb-stats{font-size:11px;color:var(--ink-soft);margin-top:5px;display:flex;gap:9px}
.amb-status{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;padding:3px 8px;border-radius:4px}
.status-active{background:#E0F0D0;color:#5D7E47}
.status-watch{background:#F4ECD0;color:#8A752B}
.status-cold{background:#F0E5DA;color:#8A6E4D}

/* Pillar section */
.pillar-section{margin-bottom:36px}
.pillar-header{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.pillar-swatch{width:18px;height:18px;border-radius:4px}
.pillar-name{font-family:'Bagel Fat One',serif;font-weight:400;font-size:24px;letter-spacing:0.01em;color:var(--ink)}
.pillar-meta{margin-left:auto;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;font-weight:600}

/* Brief card */
.brief-card{background:var(--paper);border:1.5px solid var(--green);border-radius:14px;padding:18px;cursor:pointer;transition:transform 0.12s,box-shadow 0.12s;position:relative;box-shadow:0 2px 0 var(--green)}
.brief-card:hover{box-shadow:0 4px 0 var(--green),0 6px 18px rgba(42,31,18,0.1);transform:translateY(-1px)}
.brief-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.brief-priority{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;font-weight:800;padding:4px 10px;border-radius:99px}
.priority-big{background:#FFE7AB;color:#8A5D0E}
.priority-high{background:#FBDAD2;color:#A85F4F}
.priority-standard{background:#F2EBD3;color:var(--ink-soft)}
.brief-platform{font-size:10.5px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:0.08em}
.brief-sku{font-size:10.5px;font-weight:700;background:var(--green-light);color:var(--green-deep);padding:3px 9px;border-radius:99px;border:1px solid rgba(111,175,77,0.35)}
.brief-concept{font-family:'Fraunces';font-size:17px;line-height:1.3;font-weight:500;letter-spacing:-0.005em;color:var(--ink);margin:8px 0 11px}
.brief-bottom{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-soft);padding-top:10px;border-top:1px solid var(--border)}
.brief-time{font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink)}
.brief-id{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--green-deep)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(42,31,18,0.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:40px 16px;z-index:100}
.modal{background:var(--cream);border-radius:16px;max-width:880px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--border);box-shadow:var(--shadow-lg)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 30px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--cream);z-index:2}

    <circle cx="27" cy="32" r="0.7" fill="currentColor"/>

/* ============================================================
   DATA — one populated week, May 25-31, 2026
   ============================================================ */

const WEEK_LABEL = "MAY 25 – 31, 2026";
const TODAY = "2026-05-25";

/* ============================================================
   Conviction Score system (Phase 4)
   Calibrated honestly per brief — voice + panel + pulse averaged,
   plus recency bonus. Bands: HIGH >=85 · MEDIUM 70-84 · WATCH <70.
   Don't make them all HIGH or it loses meaning.

function getConviction(briefId) {
  const c = CONVICTION_INPUTS[briefId];
  if (!c) return null;
  const base = Math.round((c.voice + c.panel + c.pulse) / 3);
  const score = base + c.recency;
  const band = score >= 85 ? "HIGH" : score >= 70 ? "MEDIUM" : "WATCH";
  return { ...c, base, score, band, rideNow: c.recency >= 12 };
}

function MaazahApp() {
  const [page, setPage] = useState("intel");
  const [intelTab, setIntelTab] = useState("pulse");   // Phase 3: Pulse leads (was trends)
  const [briefOpen, setBriefOpen] = useState(null);
  const [memoOpen, setMemoOpen] = useState(true);      // Monday Memo auto-opens
  const [hiwOpen, setHiwOpen] = useState(false);
  const [diagOpen, setDiagOpen] = useState(false);
  const [studioSeed, setStudioSeed] = useState(null);
  const [studioOpen, setStudioOpen] = useState(false);  // Phase 6 — Studio modal

  const briefById = (id) => BRIEFS.find(b => b.id === id);
  const openStudioWith = (seed) => {
    setStudioSeed(seed);
    setStudioOpen(true);
  };

  return (
    <div className="app">
      {/* SIDEBAR */}
      <aside className="sb">
        <div className="sb-brand">
          <MaazahArch className="sb-logo" />
          <div>
            <div className="sb-brand-name">MAAZAH</div>
            <div className="sb-brand-sub">Engine · OBSOLETE V0.1</div>
          </div>
        </div>

        <button className={`sb-item ${page==="intel"?"active":""}`} onClick={() => setPage("intel")}>
          <span className="sb-item-icon">⌘</span> Intelligence Brief
        </button>
        <button className={`sb-item ${page==="briefs"?"active":""}`} onClick={() => setPage("briefs")}>
          <span className="sb-item-icon">⊞</span> Content Briefs <span className="sb-item-soon">{BRIEFS.length}</span>
        </button>
        <button className={`sb-item ${page==="wholesale"?"active":""}`} onClick={() => setPage("wholesale")}>
          <span className="sb-item-icon">👁</span> Wholesale Lens
        </button>
        <button className="sb-item" onClick={() => { setStudioSeed(null); setStudioOpen(true); }}>
          <span className="sb-item-icon">✦</span> Studio Canvas
        </button>
        <button className={`sb-item ${page==="calendar"?"active":""}`} onClick={() => setPage("calendar")}>
          <span className="sb-item-icon">▢</span> Calendar <span className="sb-item-soon">WIP</span>
        </button>
        <button className={`sb-item ${page==="performance"?"active":""}`} onClick={() => setPage("performance")}>
          <span className="sb-item-icon">↗</span> Performance <span className="sb-item-soon">WIP</span>
        </button>

        <button className="sb-diag-btn" onClick={() => setDiagOpen(true)}>
          <span style={{fontSize:16,lineHeight:1}}>💭</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.02em",lineHeight:1.2}}>Diagnostic Inbox</div>
            <div style={{fontSize:10,opacity:0.85,marginTop:2,lineHeight:1.3}}>tell the engine what's coming →</div>
          </div>
        </button>

        <div className="sb-footer">
          <strong>Built for Yasameen + Sheilla</strong>
          OBSOLETE · weekly refresh Sun PM
          <button className="sb-howit" onClick={() => setHiwOpen(true)}>↓ how it works</button>
        </div>
      </aside>

      {/* MAIN */}
      <main className="main">
        {page === "intel" && <IntelPage tab={intelTab} setTab={setIntelTab} openMemo={() => setMemoOpen(true)} openStudioWith={openStudioWith} />}
        {page === "briefs" && <BriefsPage onOpen={setBriefOpen} />}
        {page === "wholesale" && <WholesaleLensPage />}
        {page === "calendar" && <CalendarPreview />}
        {page === "performance" && <PerformancePreview />}

        <MainFooter />

        {briefOpen && <BriefModal brief={briefById(briefOpen)} onClose={() => setBriefOpen(null)} onDrop={() => {
          const b = briefById(briefOpen);
          const hook = b.hooks?.find(h => h.tag)?.text || b.hooks?.[0]?.text || b.concept;
          openStudioWith(`I want to sharpen brief ${b.id}: "${b.concept}".\n\nRecommended hook: "${hook}"\nPlatform: ${b.platform} · Pillar: ${b.pillarLabel} · SKU: ${b.sku}\n\nWhere can this land harder?`);
          setBriefOpen(null);
        }} />}
        {memoOpen && <MondayMemoModal onClose={() => setMemoOpen(false)} onShipIt={() => { setMemoOpen(false); setPage("intel"); }} />}
        {hiwOpen && <HowItWorksModal onClose={() => setHiwOpen(false)} />}
        {diagOpen && <DiagnosticInboxModal onClose={() => setDiagOpen(false)} />}
        {studioOpen && <StudioModal onClose={() => { setStudioOpen(false); setStudioSeed(null); }} initialSeed={studioSeed} />}
      </main>
    </div>
  );
}

/* ============================================================
   MONDAY MEMO MODAL (Phase 2)
   Single popup, magazine card, 3 sections.
   Auto-opens on first load · ESC to close · backdrop click to close.
   ============================================================ */
function MondayMemoModal({ onClose, onShipIt }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
  return (
    <div className="mmm-bg" onClick={onClose}>
      <div className="mmm-card" onClick={(e) => e.stopPropagation()}>
        <button className="mmm-close" onClick={onClose} aria-label="close">×</button>

        <div className="mmm-hero">
          <div className="mmm-hero-date">{WEEK_LABEL}</div>
          <h2 className="mmm-hero-title">The Monday Memo</h2>
          <div className="mmm-hero-sig">— The Strategist · OBSOLETE Engine</div>
        </div>

        <div className="mmm-body">
          {/* THE READ */}
          <div className="mmm-section">
            <div className="mmm-section-eye">// THE READ</div>
            <div className="mmm-pullquote">{WELCOME_PULLQUOTE}</div>
            <div className="mmm-read-block">
              <div className="mmm-read-sub-eye">What's happening</div>
              <p className="mmm-read">{WELCOME_THESIS.happening}</p>
            </div>
            <div className="mmm-read-block">
              <div className="mmm-read-sub-eye">Maazah's edge</div>
              <p className="mmm-read">{WELCOME_THESIS.edge}</p>
            </div>
            <div className="mmm-read-block">
              <div className="mmm-read-sub-eye">This week's job</div>
              <p className="mmm-read">{WELCOME_THESIS.job}</p>
            </div>
          </div>

          {/* 5 SIGNALS */}
          <div className="mmm-section">
            <div className="mmm-section-eye">// 5 SIGNALS DRIVING THE WEEK</div>
            <div className="mmm-signals">
              {WELCOME_HIGHLIGHTS.map((h, i) => (
                <div key={i} className="mmm-signal">
                  <div className="mmm-signal-stat">{h.stat}</div>
                  <div className="mmm-signal-body">
                    <div className="mmm-signal-label">{h.label}</div>
                    <div className="mmm-signal-detail">{h.detail}</div>
                    {h.url ? (
                      <a className="mmm-signal-src" href={h.url} target="_blank" rel="noreferrer">{h.src}</a>
                    ) : (
                      <span className="mmm-signal-src">{h.src}</span>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* 3 MOVES */}
          <div className="mmm-section">
            <div className="mmm-section-eye">// 3 RECOMMENDED MOVES</div>
            <div className="mmm-moves">
              {WELCOME_MOVES.map((m, i) => (
                <div key={i} className="mmm-move">
                  <div className="mmm-move-num">{String(i + 1).padStart(2, "0")}</div>
                  <div className="mmm-move-body">
                    <div className="mmm-move-verb">{m.verb}</div>
                    <div className="mmm-move-why">{m.why}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10.5,letterSpacing:"0.06em",color:"var(--ink-soft)",lineHeight:1.6,paddingTop:8,whiteSpace:"pre-line"}}>{WELCOME_SIG}</div>
        </div>

        <div className="mmm-footer">
          <button className="mmm-cta" onClick={onShipIt}>SEE THIS WEEK'S ENGINE →</button>
        </div>
      </div>
    </div>
  );
}

function DiagnosticInboxModal({ onClose }) {
  const [answers, setAnswers] = useState({});
  const [drafts, setDrafts] = useState({});
  const [freeForm, setFreeForm] = useState("");
  const [freeFormLocked, setFreeFormLocked] = useState(false);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const selectOption = (qid, opt) => {
    setDrafts(d => ({ ...d, [qid]: { value: opt.value, label: opt.label, note: d[qid]?.note || "" } }));
  };
  const setDraftNote = (qid, note) => {
    setDrafts(d => ({ ...d, [qid]: { ...d[qid], note } }));
  };
  const lockAnswer = (qid) => {
    const draft = drafts[qid];
    if (!draft) return;
    setAnswers(a => ({ ...a, [qid]: { ...draft, locked: true } }));
  };
  const lockAnswerNoNote = (qid) => {
    const draft = drafts[qid];
    if (!draft) return;
    setAnswers(a => ({ ...a, [qid]: { ...draft, note: "", locked: true } }));
  };
  const changeAnswer = (qid) => {
    setAnswers(a => { const c = {...a}; delete c[qid]; return c; });
    setDrafts(d => { const c = {...d}; delete c[qid]; return c; });
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal diag-modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Diagnostic Inbox</h2>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="diag-intro">Three questions the engine can't answer from public signals. Your answers thread directly into next week's brief mix — sister availability, press timing, mood. Skip any that don't apply this week.</div>

          <div className="diag-q-list">
            {DIAG_QUESTIONS.map(q => {
              const locked = answers[q.id];
              const draft = drafts[q.id];
              return (
                <div key={q.id} className={`diag-q ${q.railClass}`}>
                  <div className="diag-q-head">
                    <span className="diag-q-glyph">{q.glyph}</span>
                    <div className="diag-q-body">
                      <div className="diag-q-eye">// {q.eye}</div>
                      <div className="diag-q-text">{q.text}</div>
                    </div>
                  </div>
                  {!locked && (
                    <>
                      <div className="diag-q-opts">
                        {q.opts.map(opt => (
                          <button key={opt.value} className={`diag-q-opt ${draft?.value === opt.value ? "selected" : ""}`} onClick={() => selectOption(q.id, opt)}>
                            {opt.label}
                          </button>
                        ))}
                      </div>
                      {draft && q.needsDetail && draft.value !== "none" && (
                        <div className="diag-q-detail">
                          <textarea
                            value={draft.note || ""}
                            onChange={(e) => setDraftNote(q.id, e.target.value)}
                            placeholder={q.detailPlaceholder}
                          />
                          <div className="diag-q-actions">
                            <button className="diag-q-lock" onClick={() => lockAnswer(q.id)}>Lock it in →</button>
                            <button className="diag-q-skip" onClick={() => lockAnswerNoNote(q.id)}>Skip note</button>
                          </div>
                        </div>
                      )}
                      {draft && (!q.needsDetail || draft.value === "none") && (
                        <div className="diag-q-detail">
                          <div className="diag-q-actions">
                            <button className="diag-q-lock" onClick={() => lockAnswer(q.id)}>Lock it in →</button>
                          </div>
                        </div>
                      )}
                    </>
                  )}
                  {locked && (
                    <div className="diag-q-locked">
                      <span className="diag-q-locked-pill">✓ LOCKED IN</span>
                      <div className="diag-q-locked-value">{locked.label}</div>
                      {locked.note && <div className="diag-q-locked-note">{locked.note}</div>}

function StudioModal({ onClose, initialSeed }) {
  const [mode, setMode] = useState("chat");
  const [text, setText] = useState(initialSeed || "");
  const [messages, setMessages] = useState([]);
  const [listening, setListening] = useState(false);
  const recognitionRef = React.useRef(null);
  const seedFiredRef = React.useRef(false);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  // Voice mic — uses Web Speech API (Chrome/Edge/Safari). Live-transcribes into textarea.
  const toggleVoice = () => {
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Rec) {
      alert("Voice input requires Chrome, Edge, or Safari. Your browser doesn't support it.");
      return;
    }
    if (listening && recognitionRef.current) {
      recognitionRef.current.stop();
      setListening(false);
      return;
    }
    const rec = new Rec();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = "en-US";
    let buffer = "";
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) buffer += e.results[i][0].transcript + " ";
        else interim += e.results[i][0].transcript;
      }
      setText((buffer + interim).trim());
    };
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recognitionRef.current = rec;
    rec.start();
    setListening(true);
  };

  const handleSend = (override) => {
    const content = (override ?? text).trim();
    if (!content) return;
    setMessages(m => [...m, { role: "user", text: content }]);
    setText("");
    // Phase 6 is shell-only — show graceful "API not configured" assistant message.
    // Phase 7 (Wednesday) wires Gemini Flash via /api/studio.js
    setTimeout(() => {
      setMessages(m => [...m, {
        role: "assistant",
        text: "📡 *Studio API not yet wired on this Vercel project.*\n\nOnce Alex adds **GEMINI_API_KEY** to maazah.vercel.app environment variables (Wednesday), I'll respond live in your voice with full engine context loaded — average 2-5 second responses via Gemini 2.5 Flash with `thinkingBudget:0`.\n\nFor now: every signal card has a `↓ Send to Studio` button that pre-loads this textarea with a smart seed. You can review + edit the seed and the Wednesday-live version will pick up right here."
      }]);
    }, 350);
  };

  // Smart-seed auto-fire — only once per modal open
  useEffect(() => {
    if (initialSeed && !seedFiredRef.current) {
      seedFiredRef.current = true;
      // pre-fill but DON'T auto-send — let user review the seed first
      setText(initialSeed);
    }
  }, [initialSeed]);

  return (
    <div className="studio-bg" onClick={onClose}>
      <div className="studio-card" onClick={(e) => e.stopPropagation()}>
        <div className="studio-head">
          <span className="studio-head-glyph">🧠</span>
          <div className="studio-head-titles">
            <div className="studio-head-title">The Strategist</div>
            <div className="studio-head-sub">{mode === "chat" ? "Live · full Maazah engine context loaded" : "Voice Compass · score caption fit"}</div>
          </div>
          <div className="studio-mode-toggle">
            <button className={`studio-mode-btn ${mode==="chat"?"active":""}`} onClick={() => setMode("chat")}>Chat</button>
            <button className={`studio-mode-btn ${mode==="voice"?"active":""}`} onClick={() => setMode("voice")}>Voice Compass</button>
          </div>
          <button className="studio-close" onClick={onClose} aria-label="close">×</button>
        </div>

        <div className="studio-body">
          {mode === "chat" && messages.length === 0 && (
            <>
              <div className="studio-welcome-eye">// ASK ME ANYTHING ABOUT MAAZAH</div>
              <div className="studio-welcome-title">What do you want to sharpen?</div>
              <div className="studio-welcome-sub">Drop a signal, a caption, a hook — or ask anything. I have your voice compass, every brief, every signal lane, every anti-pattern loaded. Try a starter below or just type.</div>
              <div className="studio-starters">
                {STUDIO_STARTERS.map((s, i) => (
                  <button key={i} className="studio-starter" onClick={() => setText(s.text)}>
                    <span className="studio-starter-glyph">{s.glyph}</span>
                    <div className="studio-starter-body">
                      <div className="studio-starter-text">{s.text}</div>
                    </div>
                    <span className="studio-starter-arrow">→</span>
                  </button>
                ))}
              </div>
            </>
          )}
          {mode === "chat" && messages.length > 0 && (
            <div className="studio-messages">
              {messages.map((m, i) => (
                <div key={i} className={"studio-msg studio-msg-" + m.role}>
                  <div className="studio-msg-bubble">{m.text}</div>
                </div>
              ))}
            </div>
          )}
          {mode === "voice" && (
            <>
              <div className="studio-welcome-eye">// VOICE COMPASS</div>
              <div className="studio-welcome-title">Score a caption against Maazah's voice.</div>
              <div className="studio-welcome-sub">Paste a caption below. The engine scores it against your 8 tonal territories + anti-patterns + platform fit. Returns a score, verdict, and suggested rewrites.</div>
              <div className="studio-shell-notice">📡 Voice Compass needs the ANTHROPIC_API_KEY env var to score live. Wires Wednesday alongside Studio chat. Until then: try the chat mode and ask "score this caption for me."</div>
            </>
          )}
        </div>

        <div className="studio-input-section">
          <div className="studio-hint">
            <span className="studio-hint-dot"></span>
            <span>{listening ? "Listening — tap mic again to stop" : "Tap mic for voice · ⌘+Enter to send"}</span>
          </div>
          <div className="studio-input-row">
            <textarea
              className="studio-textarea"
              value={text}
              onChange={(e) => setText(e.target.value)}
              onKeyDown={(e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); handleSend(); } }}
              placeholder={mode === "chat" ? "Ask the strategist anything..." : "Paste a caption to score..."}
              rows={2}
            />
            <button className={`studio-mic ${listening?"listening":""}`} onClick={toggleVoice} title={listening ? "Stop listening" : "Voice input"}>🎙️</button>
            <button className="studio-send" onClick={() => handleSend()} disabled={!text.trim()}>Send</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ERROR BOUNDARY — catches render-time exceptions in any subtree
   and shows a recoverable fallback in Maazah's voice.
   ============================================================ */
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { error:null, info:null }; }
  static getDerivedStateFromError(error){ return { error }; }
  componentDidCatch(error, info){
    console.error("ErrorBoundary caught:", error, info);
    this.setState({ info });
  }
  reset(){ this.setState({ error:null, info:null }); }
  render(){
    if (this.state.error) {
      return (
        <div style={{padding:"40px 32px",maxWidth:680,margin:"0 auto"}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:"0.18em",color:"#B5563B",fontWeight:700,textTransform:"uppercase",marginBottom:8}}>// ENGINE HICCUP</div>
          <h2 style={{fontFamily:"'Bagel Fat One',serif",fontWeight:400,fontSize:30,color:"#2A1F12",marginBottom:10,lineHeight:1.05,letterSpacing:"0.005em"}}>something glitched. the engine's still running.</h2>
          <p style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:14.5,lineHeight:1.55,color:"#5C4E3E",marginBottom:18}}>a component threw during render. click reload to recover — your week's intel and briefs are still cached server-side.</p>
          <details style={{marginBottom:18,fontSize:11,fontFamily:"'JetBrains Mono',monospace",color:"#7A6D5E"}}>
            <summary style={{cursor:"pointer",marginBottom:6}}>technical details</summary>
            <pre style={{background:"#FDFAF0",padding:12,borderRadius:6,border:"1px solid #D8CFB0",whiteSpace:"pre-wrap",fontSize:10,maxHeight:180,overflow:"auto"}}>{String(this.state.error?.stack || this.state.error)}</pre>
          </details>
          <button onClick={()=>window.location.reload()} style={{background:"#D67A5A",color:"#fff",border:0,padding:"10px 18px",borderRadius:99,fontFamily:"'JetBrains Mono',monospace",fontSize:11,letterSpacing:"0.14em",fontWeight:700,textTransform:"uppercase",cursor:"pointer",marginRight:8}}>↻ RELOAD</button>
          <button onClick={()=>this.reset()} style={{background:"transparent",color:"#3F7B28",border:"1.5px solid #6FAF4D",padding:"10px 18px",borderRadius:99,fontFamily:"'JetBrains Mono',monospace",fontSize:11,letterSpacing:"0.14em",fontWeight:700,textTransform:"uppercase",cursor:"pointer"}}>try again</button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============================================================
   MOUNT
   ============================================================ */
const ROOT = ReactDOM.createRoot(document.getElementById("root"));
ROOT.render(<ErrorBoundary><MaazahApp /></ErrorBoundary>);
</script>
</body>
</html>
